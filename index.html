<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
:root{
  --bg:#f2f4f6; --panel:#ffffff; --ink:#22282d; --dim:#68727c; --line:#dce1e6;
  --acc:#b23a26; --on-acc:#ffffff; --good:#2e7d5b; --chip:#e7ebee; --used:#f0f2f4;
  --shadow:0 1px 3px rgba(30,40,50,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181b; --panel:#1f2226; --ink:#e9eaec; --dim:#98a1aa; --line:#33383e;
    --acc:#d9573f; --on-acc:#ffffff; --good:#5db88e; --chip:#2a2e33; --used:#1a1d20;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#16181b; --panel:#1f2226; --ink:#e9eaec; --dim:#98a1aa; --line:#33383e;
  --acc:#d9573f; --on-acc:#ffffff; --good:#5db88e; --chip:#2a2e33; --used:#1a1d20;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans","Segoe UI",sans-serif;
  min-height:100vh;padding-bottom:76px}
.hz{font-family:"Noto Serif SC","SimSun",serif}
header{padding:14px 16px 8px;max-width:760px;margin:0 auto}
h1{font-size:19px;margin:0 0 10px;font-weight:600;letter-spacing:.2px}
h1 .hz{color:var(--acc);margin-right:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
main{max-width:760px;margin:0 auto;padding:4px 16px}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabbar button{background:none;border:0;color:var(--dim);font:inherit;font-size:12px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 10px;border-radius:10px}
.tabbar button .ico{font-size:20px;line-height:1}
.tabbar button.on{color:var(--acc)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  padding:16px;margin:10px 0}
button.act{background:var(--chip);color:var(--ink);border:0;border-radius:10px;padding:10px 18px;
  font:inherit;font-weight:500;cursor:pointer}
button.act.primary{background:var(--acc);color:var(--on-acc)}
button.act.ok{color:var(--good)}
button.act:focus-visible,.chip:focus-visible,.tabbar button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* карточки */
#fc-q{font-size:52px;text-align:center;margin:18px 0 6px;min-height:70px}
#fc-q.small{font-size:20px;font-family:"IBM Plex Sans",sans-serif}
#fc-a{text-align:center;color:var(--acc);min-height:24px;font-size:16px}
#fc-parts{text-align:center;color:var(--dim);font-size:13px;min-height:20px;margin-top:4px}
#fc-lesson{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
#fc-btns{justify-content:center;margin-top:14px}
#fc-stat{color:var(--dim);font-size:12px;text-align:center;margin-top:10px}
/* слова */
#search{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel);color:var(--ink);font:inherit}
.wrow{display:grid;grid-template-columns:96px 1fr;gap:4px 14px;padding:10px 4px;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wrow .hz{font-size:24px}
.wrow .py{color:var(--acc);font-size:13px}
.wrow .ru{font-size:14px}
.wrow .parts{grid-column:1/3;color:var(--dim);font-size:12.5px}
.lesson-tag{color:var(--dim);font-size:11px}
/* фразы */
#sx-ru{font-size:16px;margin:4px 0 10px}
#sx-built{font-size:26px;min-height:40px;color:var(--acc)}
#sx-built.good{color:var(--good)}
#sx-verdict{min-height:22px;font-size:14px;color:var(--dim)}
#sx-chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
#sx-chips button{font-size:20px;padding:8px 14px;background:var(--chip);border:0;border-radius:10px;
  color:var(--ink);cursor:pointer}
#sx-chips button:disabled{background:var(--used);color:var(--dim)}
#sx-score{color:var(--dim);font-size:12px;margin-top:8px}
/* тексты */
.t-h{color:var(--acc);font-weight:600;font-size:16px;margin:20px 0 8px}
.t-zh{font-size:19px;margin:6px 0 0}
.t-pr{color:var(--dim);font-size:13px;margin:0 0 4px}
.t-pr .p{color:var(--acc)}
.t-b{color:var(--dim);font-size:13px;border-left:3px solid var(--line);padding-left:10px;margin:10px 0}
.toggles{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:3}
.hidden{display:none}
.hz-c{cursor:pointer}
.hz-c:active{color:var(--acc)}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  box-shadow:0 -4px 20px rgba(0,0,0,.18);border-radius:16px 16px 0 0;padding:16px;z-index:10;
  max-height:65vh;overflow-y:auto;max-width:760px;margin:0 auto}
#sheet.hidden{display:none}
#sheet-close{float:right;background:var(--chip);border:0;border-radius:8px;color:var(--dim);
  font:inherit;padding:4px 10px;cursor:pointer}
#sheet-char{font-size:56px;line-height:1.2}
#sheet-py{color:var(--acc);font-size:15px}
#sheet-parts{color:var(--dim);font-size:13px;margin:4px 0 8px}
#sheet-words .wrow .hz{font-size:20px}
@media (min-width:700px){
  #fc-q{font-size:64px}
}
</style>

<header>
  <h1><span class="hz">汉语</span>Ханьюй-тренажёр <span id="vtag" style="font-size:11px;color:#98a1aa">v4</span></h1>
  <div class="chips" id="lessons"></div>
</header>
<main>
  <section id="tab-fc">
    <div class="card">
      <div id="fc-lesson"></div>
      <div id="fc-q" class="hz"></div>
      <div id="fc-a"></div>
      <div id="fc-parts"></div>
      <div class="row" id="fc-btns"></div>
      <div id="fc-stat"></div>
    </div>
  </section>
  <section id="tab-words" class="hidden">
    <input id="search" placeholder="поиск: иероглиф, пиньинь или перевод">
    <div class="card" id="wlist"></div>
  </section>
  <section id="tab-sx" class="hidden">
    <div class="card">
      <div id="sx-ru"></div>
      <div id="sx-built" class="hz">…</div>
      <div id="sx-verdict"></div>
      <div id="sx-chips"></div>
      <div class="row">
        <button class="act" id="sx-reset">сброс</button>
        <button class="act primary" id="sx-check">проверить</button>
        <button class="act ok" id="sx-next">следующее</button>
      </div>
      <div id="sx-score"></div>
    </div>
  </section>
  <section id="tab-texts" class="hidden">
    <div class="toggles row">
      <button class="act" id="tg-py">скрыть пиньинь</button>
      <button class="act" id="tg-ru">скрыть перевод</button>
    </div>
    <div id="treader"></div>
  </section>
</main>
<div id="sheet" class="hidden">
  <button id="sheet-close">закрыть</button>
  <div id="sheet-char" class="hz"></div>
  <div id="sheet-py"></div>
  <div id="sheet-parts"></div>
  <div id="sheet-words"></div>
</div>
<nav class="tabbar">
  <button data-tab="fc" class="on"><span class="ico hz">卡</span>Карточки</button>
  <button data-tab="words"><span class="ico hz">词</span>Слова</button>
  <button data-tab="sx"><span class="ico hz">句</span>Фразы</button>
  <button data-tab="texts"><span class="ico hz">文</span>Тексты</button>
</nav>

: 8}, {"t": ["能", "不", "能", "骑", "自行车", "去", "？"], "r": "Можно ли доехать на велосипеде?", "l": 8}, {"t": ["不行", "，", "太", "远", "了", "！"], "r": "Нет, слишком далеко!", "l": 8}], "texts": [{"l": 1, "title": "Урок 1. Текст 1 (знакомство в университете)", "rows": [{"t": "zh", "x": "白小红: 您好!"}, {"t": "pr", "p": "Nín hǎo!", "r": "Здравствуйте!"}, {"t": "zh", "x": "王英: 您好!"}, {"t": "pr", "p": "Nín hǎo!", "r": "Здравствуйте!"}, {"t": "zh", "x": "白小红: 您贵姓?"}, {"t": "pr", "p": "Nín guìxìng?", "r": "Как ваша фамилия?"}, {"t": "zh", "x": "王英: 我姓王。您呢?"}, {"t": "pr", "p": "Wǒ xìng Wáng. Nín ne?", "r": "Моя фамилия Ван. А ваша?"}, {"t": "zh", "x": "白小红: 我姓白。"}, {"t": "pr", "p": "Wǒ xìng Bái.", "r": "Моя фамилия Бай."}, {"t": "zh", "x": "王英: 您是俄罗斯人吗?"}, {"t": "pr", "p": "Nín shì Éluósīrén ma?", "r": "Вы россиянка?"}, {"t": "zh", "x": "白小红: 不，我不是俄罗斯人，我是中国人。您是不是俄罗斯人?"}, {"t": "r", "x": "Bù, wǒ bú shì Éluósīrén, wǒ shì Zhōngguórén. Nín shì bu shì Éluósīrén?"}, {"t": "r", "x": "Нет, я не россиянка, я китаянка. А вы россиянка?"}, {"t": "zh", "x": "王英: 我是俄罗斯人。"}, {"t": "pr", "p": "Wǒ shì Éluósīrén.", "r": "Я россиянка."}, {"t": "b", "x": "Разбор:** 您贵姓 без 吗 (это уже вопрос). Отрицание 不 перед 是. Вопрос двумя способами: …吗? и 是不是."}]}, {"l": 1, "title": "Урок 1. Текст 2 (в аудитории)", "rows": [{"t": "zh", "x": "张老师: 同学们好!"}, {"t": "pr", "p": "Tóngxuémen hǎo!", "r": "Здравствуйте, товарищи!"}, {"t": "zh", "x": "同学们: 老师好!"}, {"t": "pr", "p": "Lǎoshī hǎo!", "r": "Здравствуйте, учитель!"}, {"t": "zh", "x": "王英: 您是不是林老师?"}, {"t": "pr", "p": "Nín shì bu shì Lín lǎoshī?", "r": "Вы учитель Линь?"}, {"t": "zh", "x": "张老师: 我不是林老师，我是张老师。我姓张，叫张林。你叫什么名字?"}, {"t": "r", "x": "Wǒ bú shì Lín lǎoshī, wǒ shì Zhāng lǎoshī. Wǒ xìng Zhāng, jiào Zhāng Lín. Nǐ jiào shénme míngzi?"}, {"t": "r", "x": "Я не учитель Линь, я учитель Чжан. Моя фамилия Чжан, зовут Чжан Линь. Как тебя зовут?"}, {"t": "zh", "x": "王英: 我叫王英。"}, {"t": "pr", "p": "Wǒ jiào Wáng Yīng.", "r": "Меня зовут Ван Ин."}, {"t": "zh", "x": "张老师: 你是哪国人?"}, {"t": "pr", "p": "Nǐ shì nǎ guó rén?", "r": "Ты из какой страны?"}, {"t": "zh", "x": "王英: 我是俄罗斯人。"}, {"t": "pr", "p": "Wǒ shì Éluósīrén.", "r": "Я из России."}, {"t": "zh", "x": "张老师: 你呢?"}, {"t": "pr", "p": "Nǐ ne?", "r": "А ты?"}, {"t": "zh", "x": "安德烈: 我叫安德烈，也是俄罗斯人。"}, {"t": "pr", "p": "Wǒ jiào Āndéliè, yě shì Éluósīrén.", "r": "Меня зовут Андрей, я тоже из России."}, {"t": "zh", "x": "张老师: 你也是俄罗斯人吗?"}, {"t": "pr", "p": "Nǐ yě shì Éluósīrén ma?", "r": "Ты тоже россиянин?"}, {"t": "zh", "x": "托马什: 不，我不是俄罗斯人。我是波兰人。"}, {"t": "pr", "p": "Bù, wǒ bú shì Éluósīrén. Wǒ shì Bōlánrén.", "r": "Нет, я не россиянин. Я поляк."}, {"t": "zh", "x": "张老师: 你说俄语还是说英语?"}, {"t": "pr", "p": "Nǐ shuō Éyǔ háishi shuō Yīngyǔ?", "r": "Ты говоришь по-русски или по-английски?"}, {"t": "zh", "x": "托马什: 我说俄语。我们都说俄语。张老师，您说不说俄语?"}, {"t": "r", "x": "Wǒ shuō Éyǔ. Wǒmen dōu shuō Éyǔ. Zhāng lǎoshī, nín shuō bu shuō Éyǔ?"}, {"t": "r", "x": "Я говорю по-русски. Мы все говорим по-русски. Учитель Чжан, вы говорите по-русски?"}, {"t": "zh", "x": "张老师: 我不说俄语。我只说汉语。"}, {"t": "pr", "p": "Wǒ bù shuō Éyǔ. Wǒ zhǐ shuō Hànyǔ.", "r": "Я не говорю по-русски. Я говорю только по-китайски."}, {"t": "b", "x": "Разбор:** обращение «фамилия + 老师». 也 и 都 и 只 всегда перед глаголом. Выбор через 还是. В 是不是-вопросе нельзя 也/都/只."}, {"t": "b", "x": "Вопросы к текстам урока 1 (ответь письменно):"}, {"t": "zh", "x": "1. 白小红是哪国人?"}, {"t": "zh", "x": "2. 张老师姓什么，叫什么名字?"}, {"t": "zh", "x": "3. 托马什是不是俄罗斯人?"}, {"t": "zh", "x": "4. 张老师说什么语?"}, {"t": "zh", "x": "Ответы: 1. 她是中国人。 2. 他姓张，叫张林。 3. 不是，他是波兰人。 4. 他只说汉语。"}]}, {"l": 2, "title": "Урок 2. Текст 1 (в самолёте)", "rows": [{"t": "zh", "x": "塔拉斯: 你好! 我叫塔拉斯。"}, {"t": "pr", "p": "Nǐ hǎo! Wǒ jiào Tǎlāsī.", "r": "Привет! Меня зовут Тарас."}, {"t": "zh", "x": "白小红: 你好! 我叫白小红。"}, {"t": "pr", "p": "Nǐ hǎo! Wǒ jiào Bái Xiǎohóng.", "r": "Здравствуйте! Меня зовут Бай Сяохун."}, {"t": "zh", "x": "塔拉斯: 认识你很高兴!"}, {"t": "pr", "p": "Rènshi nǐ hěn gāoxìng!", "r": "Очень рад с вами познакомиться."}, {"t": "zh", "x": "白小红: 认识你我也很高兴!"}, {"t": "pr", "p": "Rènshi nǐ wǒ yě hěn gāoxìng!", "r": "И я рада с вами познакомиться."}, {"t": "zh", "x": "塔拉斯: 我在进出口公司工作，你呢?"}, {"t": "pr", "p": "Wǒ zài jìnchūkǒu gōngsī gōngzuò, nǐ ne?", "r": "Я работаю в импортно-экспортной компании. А вы?"}, {"t": "zh", "x": "白小红: 我在北京语言大学汉语学院汉语系学习。"}, {"t": "r", "x": "Wǒ zài Běijīng Yǔyán Dàxué Hànyǔ Xuéyuàn Hànyǔxì xuéxí."}, {"t": "r", "x": "Я учусь в Пекинском университете языков, в Институте китайского языка, на факультете китайского языка."}, {"t": "zh", "x": "塔拉斯: 可以给你打电话吗?"}, {"t": "pr", "p": "Kěyǐ gěi nǐ dǎ diànhuà ma?", "r": "Могу ли я вам позвонить?"}, {"t": "zh", "x": "白小红: 可以。我的电话号码是 215 70 988。"}, {"t": "pr", "p": "Kěyǐ. Wǒ de diànhuà hàomǎ shì èr yāo wǔ qī líng jiǔ bā bā.", "r": "Пожалуйста. Мой номер: 21570988."}, {"t": "zh", "x": "塔拉斯: 可(以)不可以给你发电子邮件?"}, {"t": "pr", "p": "Kě(yǐ) bu kěyǐ gěi nǐ fā diànzǐ yóujiàn?", "r": "А письмо по электронной почте могу послать?"}, {"t": "zh", "x": "白小红: 可以，你也可以给我发电子邮件。"}, {"t": "pr", "p": "Kěyǐ, nǐ yě kěyǐ gěi wǒ fā diànzǐ yóujiàn.", "r": "Да, можете и по почте писать."}, {"t": "b", "x": "Разбор:** 在 + место перед глаголом. Цепочка мест от большого к малому (университет → институт → факультет). 给 + кому + глагол. В номерах 1 читается yāo."}]}, {"l": 2, "title": "Урок 2. Текст 2 (в гостях)", "rows": [{"t": "zh", "x": "安德烈: 这是我的女朋友，张园园。"}, {"t": "pr", "p": "Zhè shì wǒ de nǚ péngyou, Zhāng Yuányuan.", "r": "Это моя подруга, Чжан Юаньюань."}, {"t": "zh", "x": "丁汉生: 你好! 请进!"}, {"t": "pr", "p": "Nǐ hǎo! Qǐng jìn!", "r": "Здравствуйте! Проходите!"}, {"t": "zh", "x": "张园园: 谢谢。"}, {"t": "pr", "p": "Xièxie.", "r": "Спасибо."}, {"t": "zh", "x": "丁汉生: 请坐!"}, {"t": "pr", "p": "Qǐng zuò!", "r": "Присаживайтесь!"}, {"t": "zh", "x": "安德烈: 谢谢!"}, {"t": "pr", "p": "Xièxie!", "r": "Спасибо!"}, {"t": "zh", "x": "丁汉生: 请喝茶!"}, {"t": "pr", "p": "Qǐng hē chá!", "r": "Пейте чай, пожалуйста."}, {"t": "zh", "x": "张园园: 好，谢谢!"}, {"t": "pr", "p": "Hǎo, xièxie!", "r": "Хорошо, спасибо!"}, {"t": "zh", "x": "丁汉生: 你在哪儿学习?"}, {"t": "pr", "p": "Nǐ zài nǎr xuéxí?", "r": "Где вы учитесь?"}, {"t": "zh", "x": "张园园: 我在俄罗斯莫斯科大学东方学院语文系学习。"}, {"t": "r", "x": "Wǒ zài Éluósī Mòsīkē Dàxué Dōngfāng Xuéyuàn Yǔwénxì xuéxí."}, {"t": "r", "x": "В России, на филологическом факультете Института Востока МГУ."}, {"t": "zh", "x": "丁汉生: 哦。莫斯科大学怎么样?"}, {"t": "pr", "p": "Ò. Mòsīkē Dàxué zěnmeyàng?", "r": "Понятно. И как вам МГУ?"}, {"t": "zh", "x": "张园园: 很好。很大，也很漂亮。我很喜欢。"}, {"t": "pr", "p": "Hěn hǎo. Hěn dà, yě hěn piàoliang. Wǒ hěn xǐhuan.", "r": "Очень хороший. Большой и красивый, мне нравится."}, {"t": "b", "x": "Разбор:** вежливое 请 + глагол (请进, 请坐, 请喝茶). Вопрос 怎么样. Прилагательное-сказуемое без 是: 很大，也很漂亮. Неполные предложения в ответе."}, {"t": "b", "x": "Вопросы к текстам урока 2:"}, {"t": "zh", "x": "1. 塔拉斯在哪儿工作?"}, {"t": "zh", "x": "2. 白小红在哪儿学习?"}, {"t": "zh", "x": "3. 莫斯科大学怎么样?"}, {"t": "zh", "x": "Ответы: 1. 他在进出口公司工作。 2. 她在北京语言大学(汉语学院汉语系)学习。 3. 很好，很大，也很漂亮。"}]}, {"l": 3, "title": "Урок 3. Текст 1 (о семье)", "rows": [{"t": "zh", "x": "白小红: 你是什么地方人?"}, {"t": "pr", "p": "Nǐ shì shénme dìfang rén?", "r": "Вы откуда родом?"}, {"t": "zh", "x": "丁汉生: 我是浙江人，你呢?"}, {"t": "pr", "p": "Wǒ shì Zhèjiāngrén, nǐ ne?", "r": "Я из провинции Чжэцзян. А вы?"}, {"t": "zh", "x": "白小红: 我也是浙江人。"}, {"t": "pr", "p": "Wǒ yě shì Zhèjiāngrén.", "r": "И я из Чжэцзяна."}, {"t": "zh", "x": "丁汉生: 你一个人在这儿?"}, {"t": "pr", "p": "Nǐ yí gè rén zài zhèr?", "r": "Вы здесь одна?"}, {"t": "zh", "x": "白小红: 一个人。你呢?"}, {"t": "pr", "p": "Yí gè rén. Nǐ ne?", "r": "Одна. А вы?"}, {"t": "zh", "x": "丁汉生: 我一家人都在这儿。"}, {"t": "pr", "p": "Wǒ yì jiā rén dōu zài zhèr.", "r": "Я здесь с семьёй."}, {"t": "zh", "x": "白小红: 你家有几口人?"}, {"t": "pr", "p": "Nǐ jiā yǒu jǐ kǒu rén?", "r": "Сколько человек в вашей семье?"}, {"t": "zh", "x": "丁汉生: 五口。我爸爸、妈妈，我和我太太，一个女儿。"}, {"t": "r", "x": "Wǔ kǒu. Wǒ bàba, māma, wǒ hé wǒ tàitai, yí gè nǚ'ér."}, {"t": "r", "x": "Пять. Папа, мама, мы с женой и дочка."}, {"t": "zh", "x": "白小红: 孩子多大?"}, {"t": "pr", "p": "Háizi duō dà?", "r": "Сколько лет ребёнку?"}, {"t": "zh", "x": "丁汉生: 两岁。"}, {"t": "pr", "p": "Liǎng suì.", "r": "Два годика."}, {"t": "zh", "x": "白小红: 很可爱吧?"}, {"t": "pr", "p": "Hěn kě'ài ba?", "r": "Очень миленькая, да?"}, {"t": "zh", "x": "丁汉生: 是啊，很可爱。"}, {"t": "pr", "p": "Shì a, hěn kě'ài.", "r": "Да, очень мила."}, {"t": "b", "x": "Разбор:** 一个人 «в одиночку», 一家人 «вся семья». 几口人 про семью. 的 опущено: 我爸爸, 我太太. Возраст без глагола: 两岁. 吧 предположение."}]}, {"l": 3, "title": "Урок 3. Текст 2 (об университете)", "rows": [{"t": "zh", "x": "塔拉斯: 你们学校有多少学生?"}, {"t": "pr", "p": "Nǐmen xuéxiào yǒu duōshao xuésheng?", "r": "Сколько студентов в вашем университете?"}, {"t": "zh", "x": "张林: 我想，大概有三万个。"}, {"t": "pr", "p": "Wǒ xiǎng, dàgài yǒu sān wàn gè.", "r": "Думаю, примерно тридцать тысяч."}, {"t": "zh", "x": "塔拉斯: 有没有人学习汉语?"}, {"t": "pr", "p": "Yǒu méiyǒu rén xuéxí Hànyǔ?", "r": "Есть ли кто-то, кто учит китайский?"}, {"t": "zh", "x": "张林: 有很多人学习汉语。"}, {"t": "pr", "p": "Yǒu hěn duō rén xuéxí Hànyǔ.", "r": "Многие учат китайский."}, {"t": "zh", "x": "塔拉斯: 大概有多少人?"}, {"t": "pr", "p": "Dàgài yǒu duōshao rén?", "r": "Примерно сколько?"}, {"t": "zh", "x": "张林: 大概有一千个。"}, {"t": "pr", "p": "Dàgài yǒu yì qiān gè.", "r": "Около тысячи."}, {"t": "zh", "x": "塔拉斯: 我想去你们学校学习汉语。"}, {"t": "pr", "p": "Wǒ xiǎng qù nǐmen xuéxiào xuéxí Hànyǔ.", "r": "Я хочу поехать в ваш университет учить китайский."}, {"t": "zh", "x": "张林: 是吗? 你为什么想学习汉语?"}, {"t": "pr", "p": "Shì ma? Nǐ wèi shénme xiǎng xuéxí Hànyǔ?", "r": "Правда? А почему вы хотите учить китайский?"}, {"t": "zh", "x": "塔拉斯: 我们在上海有一个分公司，老板让我去那儿工作。"}, {"t": "r", "x": "Wǒmen zài Shànghǎi yǒu yí gè fēn gōngsī, lǎobǎn ràng wǒ qù nàr gōngzuò."}, {"t": "r", "x": "У нас в Шанхае филиал, шеф посылает меня туда работать."}, {"t": "b", "x": "Разбор:** 有 в значении «есть, имеется», отрицание 没有. 很多 перед сущ. (не голое 多). Числа: 三万 = 30 000. Два глагольных оборота: 想去…学习, 让我去…工作."}, {"t": "b", "x": "Вопросы к текстам урока 3:"}, {"t": "zh", "x": "1. 丁汉生家有几口人?"}, {"t": "zh", "x": "2. 丁汉生的女儿多大?"}, {"t": "zh", "x": "3. 张林的学校有多少学生?"}, {"t": "zh", "x": "4. 塔拉斯为什么想学习汉语?"}, {"t": "zh", "x": "Ответы: 1. 五口人。 2. 两岁。 3. 大概有三万个。 4. 因为他们在上海有一个分公司，老板让他去那儿工作。"}]}, {"l": 4, "title": "Урок 4. Текст 1 (карта Китая)", "rows": [{"t": "zh", "x": "安德烈: 你有没有中国地图?"}, {"t": "pr", "p": "Nǐ yǒu méiyǒu Zhōngguó dìtú?", "r": "У тебя есть карта Китая?"}, {"t": "zh", "x": "白小红: 有。我有两张中国地图。一张中文的，一张俄文的。"}, {"t": "r", "x": "Yǒu. Wǒ yǒu liǎng zhāng Zhōngguó dìtú. Yì zhāng Zhōngwén de, yì zhāng Éwén de."}, {"t": "r", "x": "Есть. У меня две карты Китая: одна на китайском, одна на русском."}, {"t": "zh", "x": "安德烈: 我看一下，行吗?"}, {"t": "pr", "p": "Wǒ kàn yíxià, xíng ma?", "r": "Дай посмотреть, можно?"}, {"t": "zh", "x": "白小红: 行。你要中文的还是俄文的?"}, {"t": "pr", "p": "Xíng. Nǐ yào Zhōngwén de háishi Éwén de?", "r": "Можно. Тебе на китайском или на русском?"}, {"t": "zh", "x": "安德烈: 俄文的。"}, {"t": "pr", "p": "Éwén de.", "r": "На русском."}, {"t": "zh", "x": "白小红: 给。这张地图是俄文的。"}, {"t": "pr", "p": "Gěi. Zhè zhāng dìtú shì Éwén de.", "r": "Держи. Эта карта на русском."}, {"t": "zh", "x": "安德烈: 谢谢!"}, {"t": "pr", "p": "Xièxie!", "r": "Спасибо!"}, {"t": "zh", "x": "白小红: 你看中国地图干什么? 你想去各地旅游?"}, {"t": "r", "x": "Nǐ kàn Zhōngguó dìtú gàn shénme? Nǐ xiǎng qù gèdì lǚyóu?"}, {"t": "r", "x": "Зачем тебе карта Китая? Хочешь путешествовать по стране?"}, {"t": "zh", "x": "安德烈: 是的，我想去各地玩儿。你看，这是北京。"}, {"t": "pr", "p": "Shìde, wǒ xiǎng qù gèdì wánr. Nǐ kàn, zhè shì Běijīng.", "r": "Да, хочу везде побывать. Смотри, это Пекин."}, {"t": "zh", "x": "白小红: 我知道。这是上海。这是龙山。"}, {"t": "pr", "p": "Wǒ zhīdao. Zhè shì Shànghǎi. Zhè shì Lóngshān.", "r": "Знаю. Это Шанхай. А это Луншань."}, {"t": "zh", "x": "安德烈: 龙山? 不知道。龙山大不大?"}, {"t": "pr", "p": "Lóngshān? Bù zhīdao. Lóngshān dà bu dà?", "r": "Луншань? Не знаю такого. Он большой?"}, {"t": "zh", "x": "白小红: 比较小。我家在那儿。"}, {"t": "pr", "p": "Bǐjiào xiǎo. Wǒ jiā zài nàr.", "r": "Довольно маленький. Там мой дом."}, {"t": "zh", "x": "安德烈: 这个名字真有意思! 那儿有龙吗?"}, {"t": "pr", "p": "Zhège míngzi zhēn yǒu yìsi! Nàr yǒu lóng ma?", "r": "Какое интересное название! Там есть драконы?"}, {"t": "zh", "x": "白小红: 那儿没有龙，只有山。"}, {"t": "pr", "p": "Nàr méiyǒu lóng, zhǐ yǒu shān.", "r": "Драконов нет, только горы."}, {"t": "b", "x": "Разбор:** 有没有 вопрос. Счётное слово 张. 的-обороты без существительного: 中文的, 俄文的. 看一下 вежливая просьба. 给 «держи». 真 + прилагательное восклицание. 比较 «довольно»."}]}, {"l": 4, "title": "Урок 4. Текст 2 (чей словарь?)", "rows": [{"t": "zh", "x": "托马什: 这是什么词典?"}, {"t": "pr", "p": "Zhè shì shénme cídiǎn?", "r": "Что это за словарь?"}, {"t": "zh", "x": "安德烈: 汉俄词典。"}, {"t": "pr", "p": "Hàn-É cídiǎn.", "r": "Китайско-русский."}, {"t": "zh", "x": "托马什: 那本呢?"}, {"t": "pr", "p": "Nà běn ne?", "r": "А тот?"}, {"t": "zh", "x": "安德烈: 俄汉词典。"}, {"t": "pr", "p": "É-Hàn cídiǎn.", "r": "Русско-китайский."}, {"t": "zh", "x": "托马什: 这两本词典都是你的吗?"}, {"t": "pr", "p": "Zhè liǎng běn cídiǎn dōu shì nǐ de ma?", "r": "Оба словаря твои?"}, {"t": "zh", "x": "安德烈: 这本汉俄词典是我的，那本俄汉词典不是我的。"}, {"t": "r", "x": "Zhè běn Hàn-É cídiǎn shì wǒ de, nà běn É-Hàn cídiǎn bú shì wǒ de."}, {"t": "r", "x": "Этот китайско-русский мой, а тот русско-китайский не мой."}, {"t": "zh", "x": "托马什: 是谁的?"}, {"t": "pr", "p": "Shì shuí de?", "r": "А чей?"}, {"t": "zh", "x": "安德烈: 不知道。我想，这大概是老师的词典。"}, {"t": "pr", "p": "Bù zhīdao. Wǒ xiǎng, zhè dàgài shì lǎoshī de cídiǎn.", "r": "Не знаю. Думаю, наверное, учителя."}, {"t": "r", "x": "(входит учитель Чжан)"}, {"t": "zh", "x": "托马什: 老师，请问，这本词典是您的吗?"}, {"t": "pr", "p": "Lǎoshī, qǐng wèn, zhè běn cídiǎn shì nín de ma?", "r": "Учитель, позвольте спросить, этот словарь ваш?"}, {"t": "zh", "x": "张老师: 对，是我的。"}, {"t": "pr", "p": "Duì, shì wǒ de.", "r": "Верно, мой."}, {"t": "zh", "x": "托马什: 这本词典怎么样?"}, {"t": "pr", "p": "Zhè běn cídiǎn zěnmeyàng?", "r": "И как этот словарь?"}, {"t": "zh", "x": "张老师: 这本词典非常好，非常有用。"}, {"t": "pr", "p": "Zhè běn cídiǎn fēicháng hǎo, fēicháng yǒuyòng.", "r": "Очень хороший, очень полезный."}, {"t": "zh", "x": "托马什: 我能不能用一下?"}, {"t": "pr", "p": "Wǒ néng bu néng yòng yíxià?", "r": "Можно мне им попользоваться?"}, {"t": "zh", "x": "张老师: 当然可以。"}, {"t": "pr", "p": "Dāngrán kěyǐ.", "r": "Конечно, можно."}, {"t": "b", "x": "Разбор:** 这/那 + 本 + сущ. 都 перед 是. 的-принадлежность: 是谁的? 是我的。 Вежливое 请问. 能不能 + глагол + 一下; ответ 当然可以."}, {"t": "b", "x": "Вопросы к текстам урока 4:"}, {"t": "zh", "x": "1. 白小红有几张中国地图?"}, {"t": "zh", "x": "2. 安德烈要中文的还是俄文的?"}, {"t": "zh", "x": "3. 龙山大不大? 那儿有没有龙?"}, {"t": "zh", "x": "4. 那本俄汉词典是谁的?"}, {"t": "zh", "x": "Ответы: 1. 两张，一张中文的，一张俄文的。 2. 他要俄文的。 3. 比较小。那儿没有龙，只有山。 4. 是（张）老师的。"}]}, {"l": 5, "title": "Урок 5. Текст 1 (в магазине)", "rows": [{"t": "zh", "x": "小姐: 哟，您会说汉语?"}, {"t": "pr", "p": "Yō, nín huì shuō Hànyǔ?", "r": "О, вы говорите по-китайски?"}, {"t": "zh", "x": "塔拉斯: 我会说一点儿。"}, {"t": "pr", "p": "Wǒ huì shuō yìdiǎnr.", "r": "Я немного говорю."}, {"t": "zh", "x": "小姐: 先生想买什么?"}, {"t": "pr", "p": "Xiānsheng xiǎng mǎi shénme?", "r": "Что господин хочет купить?"}, {"t": "zh", "x": "塔拉斯: 我想买一件衬衫。这件白衬衫多少钱?"}, {"t": "r", "x": "Wǒ xiǎng mǎi yí jiàn chènshān. Zhè jiàn bái chènshān duōshao qián?"}, {"t": "r", "x": "Я хочу купить рубашку. Сколько стоит эта белая?"}, {"t": "zh", "x": "小姐: 四百二十八块。"}, {"t": "pr", "p": "Sìbǎi èrshíbā kuài. 428", "r": "юаней."}, {"t": "zh", "x": "塔拉斯: 太贵了! 那件红衬衫呢?"}, {"t": "pr", "p": "Tài guì le! Nà jiàn hóng chènshān ne?", "r": "Слишком дорого! А та красная?"}, {"t": "zh", "x": "小姐: 一百六十五块。比较便宜，也比较漂亮。"}, {"t": "pr", "p": "Yìbǎi liùshíwǔ kuài. Bǐjiào piányi, yě bǐjiào piàoliang. 165", "r": "юаней. Подешевле и покрасивее."}, {"t": "zh", "x": "塔拉斯: 好，我要那一件。"}, {"t": "pr", "p": "Hǎo, wǒ yào nà yí jiàn.", "r": "Хорошо, мне ту."}, {"t": "zh", "x": "小姐: 您还要买什么?"}, {"t": "pr", "p": "Nín hái yào mǎi shénme?", "r": "Что ещё хотите купить?"}, {"t": "zh", "x": "塔拉斯: 一条裤子。能不能试一试?"}, {"t": "pr", "p": "Yì tiáo kùzi. Néng bu néng shì yi shì?", "r": "Брюки. Можно примерить?"}, {"t": "zh", "x": "小姐: 当然可以。…… 怎么样?"}, {"t": "pr", "p": "Dāngrán kěyǐ. ... Zěnmeyàng?", "r": "Конечно. ... Ну как?"}, {"t": "zh", "x": "塔拉斯: 这条太大。"}, {"t": "pr", "p": "Zhè tiáo tài dà.", "r": "Эти слишком велики."}, {"t": "zh", "x": "小姐: 那您试试这条吧，这条不太大。"}, {"t": "pr", "p": "Nà nín shìshi zhè tiáo ba, zhè tiáo bú tài dà.", "r": "Тогда примерьте эти, они не такие большие."}, {"t": "b", "x": "Разбор:** 会 умение («выучился»), 能 возможность. 太…了 «слишком». Деньги: 块 (разг.) = 元; 四百二十八块. Счётные слова: 件 (рубашки), 条 (брюки). Удвоение глагола 试一试 = 试试 = 试一下 «попробовать разок». 吧 мягкое предложение."}]}, {"l": 5, "title": "Урок 5. Текст 2 (в ресторане)", "rows": [{"t": "zh", "x": "小姐: 请坐。……请喝茶。"}, {"t": "pr", "p": "Qǐng zuò. ... Qǐng hē chá.", "r": "Садитесь. ... Пейте чай."}, {"t": "zh", "x": "大家: 谢谢!"}, {"t": "pr", "p": "Xièxie!", "r": "Спасибо!"}, {"t": "zh", "x": "小姐: 来点儿什么?"}, {"t": "pr", "p": "Lái diǎnr shénme?", "r": "Что закажете?"}, {"t": "zh", "x": "托马什: 小姐，你们饭店最好吃的菜是什么?"}, {"t": "pr", "p": "Xiǎojiě, nǐmen fàndiàn zuì hǎochī de cài shì shénme?", "r": "Девушка, какое блюдо у вас самое вкусное?"}, {"t": "zh", "x": "小姐: 糖醋鱼。"}, {"t": "pr", "p": "Tángcùyú.", "r": "Рыба в кисло-сладком соусе."}, {"t": "zh", "x": "托马什: 好，来一个糖醋鱼。"}, {"t": "pr", "p": "Hǎo, lái yí gè tángcùyú.", "r": "Хорошо, несите её."}, {"t": "zh", "x": "安德烈: 我最喜欢吃辣的。你能不能吃辣的? 来个酸辣汤。"}, {"t": "r", "x": "Wǒ zuì xǐhuan chī là de. Nǐ néng bu néng chī là de? Lái ge suānlàtāng."}, {"t": "r", "x": "Я больше всего люблю острое. Ты можешь есть острое? Принесите кисло-острый суп."}, {"t": "zh", "x": "白小红: 我能吃一点儿。"}, {"t": "pr", "p": "Wǒ néng chī yìdiǎnr.", "r": "Я немного могу."}, {"t": "zh", "x": "小姐: 好。要不要来个牛肉?"}, {"t": "pr", "p": "Hǎo. Yào bu yào lái ge niúròu?", "r": "Хорошо. Будете говядину?"}, {"t": "zh", "x": "丁汉生: 可以。来一个红烧牛肉吧。"}, {"t": "pr", "p": "Kěyǐ. Lái yí gè hóngshāo niúròu ba.", "r": "Можно. Давайте тушёную говядину."}, {"t": "zh", "x": "小姐: 还要什么?"}, {"t": "pr", "p": "Hái yào shénme?", "r": "Что ещё?"}, {"t": "zh", "x": "白小红: 米饭。 丁汉生: 水饺。"}, {"t": "pr", "p": "Mǐfàn. / Shuǐjiǎo.", "r": "Рис. / Пельмени."}, {"t": "zh", "x": "托马什: 来三瓶啤酒。"}, {"t": "pr", "p": "Lái sān píng píjiǔ.", "r": "И три бутылки пива."}, {"t": "zh", "x": "小姐: 好，请等一下。"}, {"t": "pr", "p": "Hǎo, qǐng děng yíxià.", "r": "Хорошо, подождите немного."}, {"t": "b", "x": "Разбор:** 来 + блюдо = «принесите». 最 + прилагательное: превосходная степень (最好吃的菜). 辣的 «острое» (的-оборот). 能 про способность переносить. 瓶 счётное слово для бутылок."}, {"t": "b", "x": "Вопросы к урокам 5:"}, {"t": "zh", "x": "1. 那件白衬衫多少钱?"}, {"t": "zh", "x": "2. 塔拉斯要白衬衫还是红衬衫? 为什么?"}, {"t": "zh", "x": "3. 他们饭店最好吃的菜是什么?"}, {"t": "zh", "x": "4. 谁最喜欢吃辣的?"}, {"t": "zh", "x": "Ответы: 1. 四百二十八块。 2. 他要红衬衫，因为红衬衫比较便宜，也比较漂亮。 3. 糖醋鱼。 4. 安德烈。"}]}, {"l": 6, "title": "Урок 6. Текст 1 (планы на выходные)", "rows": [{"t": "zh", "x": "白小红: 明天星期六，我们都不上课。你们打算干什么?"}, {"t": "r", "x": "Míngtiān xīngqīliù, wǒmen dōu bú shàng kè. Nǐmen dǎsuàn gàn shénme?"}, {"t": "r", "x": "Завтра суббота, занятий нет. Что вы собираетесь делать?"}, {"t": "zh", "x": "安德烈: 我明天要去打工。"}, {"t": "pr", "p": "Wǒ míngtiān yào qù dǎgōng.", "r": "Я завтра пойду подрабатывать."}, {"t": "zh", "x": "王英: 我明天晚上有一个约会。"}, {"t": "pr", "p": "Wǒ míngtiān wǎnshang yǒu yí gè yuēhuì.", "r": "У меня завтра вечером встреча."}, {"t": "zh", "x": "白小红: 白天呢?"}, {"t": "pr", "p": "Báitiān ne?", "r": "А днём?"}, {"t": "zh", "x": "王英: 在家里休息。你呢?"}, {"t": "pr", "p": "Zài jiāli xiūxi. Nǐ ne?", "r": "Дома отдыхаю. А ты?"}, {"t": "zh", "x": "白小红: 我想去打球，你们去不去?"}, {"t": "pr", "p": "Wǒ xiǎng qù dǎ qiú, nǐmen qù bu qù?", "r": "Я хочу пойти поиграть в мяч, вы идёте?"}, {"t": "zh", "x": "托马什: 我跟你一起去。"}, {"t": "pr", "p": "Wǒ gēn nǐ yìqǐ qù.", "r": "Я пойду с тобой."}, {"t": "zh", "x": "白小红: 好啊。王英，你去不去?"}, {"t": "pr", "p": "Hǎo a. Wáng Yīng, nǐ qù bu qù?", "r": "Отлично. Ван Ин, а ты?"}, {"t": "zh", "x": "王英: 不去。我不喜欢打球。我喜欢在家里看电视。"}, {"t": "r", "x": "Bú qù. Wǒ bù xǐhuan dǎ qiú. Wǒ xǐhuan zài jiāli kàn diànshì."}, {"t": "r", "x": "Нет. Я не люблю играть в мяч, я люблю смотреть дома телевизор."}, {"t": "b", "x": "Разбор:** 明天星期六: перед днями недели 是 опускается. Вопрос о дне: 明天星期几? 跟…一起 + глагол «вместе с». 要 здесь «собираюсь, намерен»."}]}, {"l": 6, "title": "Урок 6. Текст 2 (телефонный разговор, договариваются о встрече)", "rows": [{"t": "zh", "x": "白小红: 喂!"}, {"t": "pr", "p": "Wèi!", "r": "Алло!"}, {"t": "zh", "x": "托马什: 是小红吗?"}, {"t": "pr", "p": "Shì Xiǎohóng ma?", "r": "Это Сяохун?"}, {"t": "zh", "x": "白小红: 是我，您哪位?"}, {"t": "pr", "p": "Shì wǒ, nín nǎ wèi?", "r": "Я. А кто говорит?"}, {"t": "zh", "x": "托马什: 我是托马什。"}, {"t": "pr", "p": "Wǒ shì Tuōmǎshí.", "r": "Это Томаш."}, {"t": "zh", "x": "白小红: 啊，托马什呀，你好! 什么事儿?"}, {"t": "pr", "p": "Ā, Tuōmǎshí ya, nǐ hǎo! Shénme shìr?", "r": "А, Томаш, привет! Что случилось?"}, {"t": "zh", "x": "托马什: 我想请你一起去喝咖啡。"}, {"t": "pr", "p": "Wǒ xiǎng qǐng nǐ yìqǐ qù hē kāfēi.", "r": "Я хочу пригласить тебя на кофе."}, {"t": "zh", "x": "白小红: 什么时候?"}, {"t": "pr", "p": "Shénme shíhou?", "r": "Когда?"}, {"t": "zh", "x": "托马什: 今天晚上。行吗?"}, {"t": "pr", "p": "Jīntiān wǎnshang. Xíng ma?", "r": "Сегодня вечером. Пойдёт?"}, {"t": "zh", "x": "白小红: 不行，今天晚上我很忙，我要去看一位朋友，还要做功课。对不起!"}, {"t": "r", "x": "Bù xíng, jīntiān wǎnshang wǒ hěn máng, wǒ yào qù kàn yí wèi péngyou, hái yào zuò gōngkè. Duìbuqǐ!"}, {"t": "r", "x": "Нет, сегодня вечером я занята: надо навестить друга и сделать уроки. Извини!"}, {"t": "zh", "x": "托马什: 没关系。明天晚上怎么样?"}, {"t": "pr", "p": "Méi guānxi. Míngtiān wǎnshang zěnmeyàng?", "r": "Ничего. А завтра вечером?"}, {"t": "zh", "x": "白小红: 明天晚上我有空儿。几点钟?"}, {"t": "pr", "p": "Míngtiān wǎnshang wǒ yǒu kòngr. Jǐ diǎnzhōng?", "r": "Завтра вечером я свободна. Во сколько?"}, {"t": "zh", "x": "托马什: 八点半，行吗?"}, {"t": "pr", "p": "Bā diǎn bàn, xíng ma?", "r": "В полдевятого, идёт?"}, {"t": "zh", "x": "白小红: 行。在哪儿见面?"}, {"t": "pr", "p": "Xíng. Zài nǎr jiànmiàn?", "r": "Идёт. Где встретимся?"}, {"t": "zh", "x": "托马什: 明天晚上八点一刻我去接你。"}, {"t": "pr", "p": "Míngtiān wǎnshang bā diǎn yí kè wǒ qù jiē nǐ.", "r": "Завтра в 20:15 я за тобой заеду."}, {"t": "zh", "x": "白小红: 好吧。谢谢! 再见!"}, {"t": "pr", "p": "Hǎo ba. Xièxie! Zàijiàn!", "r": "Хорошо. Спасибо! Пока!"}, {"t": "b", "x": "Разбор:** время: 八点半 8:30, 八点一刻 8:15, 两点 2:00, 差五分三点 2:55. Порядок: день → часть суток → час (明天晚上八点). 请 + кого + глагол: пригласить (угостить). 位 вежливое счётное для людей. 还要 «ещё надо»."}, {"t": "b", "x": "Вопросы к урокам 6:"}, {"t": "zh", "x": "1. 明天星期几?"}, {"t": "zh", "x": "2. 王英明天打算干什么?"}, {"t": "zh", "x": "3. 托马什想请白小红干什么?"}, {"t": "zh", "x": "4. 白小红今天晚上为什么很忙?"}, {"t": "zh", "x": "5. 他们几点见面?"}, {"t": "zh", "x": "Ответы: 1. 星期六。 2. 晚上有一个约会，白天在家里休息。 3. 一起去喝咖啡。 4. 因为她要去看一位朋友，还要做功课。 5. 明天晚上八点半 (托马什八点一刻去接她)。"}]}, {"l": 7, "title": "Урок 7. Текст 1 (планы на каникулы)", "rows": [{"t": "zh", "x": "丁汉生: 你们什么时候放假?"}, {"t": "pr", "p": "Nǐmen shénme shíhou fàng jià?", "r": "Когда у вас каникулы?"}, {"t": "zh", "x": "安德烈: 四月下旬。"}, {"t": "pr", "p": "Sì yuè xiàxún.", "r": "В конце апреля."}, {"t": "zh", "x": "丁汉生: 放假以后你打算干什么?"}, {"t": "pr", "p": "Fàng jià yǐhòu nǐ dǎsuàn gàn shénme?", "r": "Что собираешься делать на каникулах?"}, {"t": "zh", "x": "安德烈: 我想去中国旅行。"}, {"t": "pr", "p": "Wǒ xiǎng qù Zhōngguó lǚxíng.", "r": "Хочу поехать путешествовать по Китаю."}, {"t": "zh", "x": "丁汉生: 要去很多地方吧?"}, {"t": "pr", "p": "Yào qù hěn duō dìfang ba?", "r": "Наверное, во много мест?"}, {"t": "zh", "x": "安德烈: 是啊，上海、四川、云南……"}, {"t": "pr", "p": "Shì a, Shànghǎi, Sìchuān, Yúnnán...", "r": "Да: Шанхай, Сычуань, Юньнань..."}, {"t": "zh", "x": "丁汉生: 什么时候去?"}, {"t": "pr", "p": "Shénme shíhou qù?", "r": "Когда едешь?"}, {"t": "zh", "x": "安德烈: 五月中旬或者下旬。"}, {"t": "pr", "p": "Wǔ yuè zhōngxún huòzhě xiàxún.", "r": "В середине или конце мая."}, {"t": "zh", "x": "丁汉生: 什么时候回来?"}, {"t": "pr", "p": "Shénme shíhou huílai?", "r": "Когда вернёшься?"}, {"t": "zh", "x": "安德烈: 我打算七月一号以前回来。"}, {"t": "pr", "p": "Wǒ dǎsuàn qī yuè yī hào yǐqián huílai.", "r": "Собираюсь вернуться до 1 июля."}, {"t": "zh", "x": "丁汉生: 你一个人去吗?"}, {"t": "pr", "p": "Nǐ yí gè rén qù ma?", "r": "Едешь один?"}, {"t": "zh", "x": "安德烈: 不，跟我的女朋友一起去。可是，我们的汉语不太好，我有点儿担心。"}, {"t": "r", "x": "Bù, gēn wǒ de nǚpéngyou yìqǐ qù. Kěshì, wǒmen de Hànyǔ bú tài hǎo, wǒ yǒudiǎnr dānxīn."}, {"t": "r", "x": "Нет, с девушкой. Но наш китайский не очень, я немного беспокоюсь."}, {"t": "zh", "x": "丁汉生: 你别担心。我在上海、四川都有朋友，可以请他们帮助你。"}, {"t": "r", "x": "Nǐ bié dānxīn. Wǒ zài Shànghǎi, Sìchuān dōu yǒu péngyou, kěyǐ qǐng tāmen bāngzhù nǐ."}, {"t": "r", "x": "Не беспокойся. У меня в Шанхае и Сычуани есть друзья, попрошу их помочь тебе."}, {"t": "b", "x": "Разбор:** даты: год (二〇〇五年) → месяц (四月) → число (三十号/日). 以前 / 以后 после отрезка времени: 七月一号以前 «до 1 июля», 放假以后 «после начала каникул». 或者 «или» в утверждении, 还是 в вопросе. 有点儿 + прил./глагол «немного» (о неприятном). 别 + глагол: запрет."}]}, {"l": 7, "title": "Урок 7. Текст 2 (ищет учителя Ван)", "rows": [{"t": "zh", "x": "塔拉斯: 请问，可以进来吗?"}, {"t": "pr", "p": "Qǐngwèn, kěyǐ jìnlai ma?", "r": "Простите, можно войти?"}, {"t": "zh", "x": "老师: 你找谁?"}, {"t": "pr", "p": "Nǐ zhǎo shuí?", "r": "Вы к кому?"}, {"t": "zh", "x": "塔拉斯: 我找王老师。"}, {"t": "pr", "p": "Wǒ zhǎo Wáng lǎoshī.", "r": "Мне нужна учитель Ван."}, {"t": "zh", "x": "老师: 哪位王老师? 我们这儿有两位王老师。"}, {"t": "pr", "p": "Nǎ wèi Wáng lǎoshī? Wǒmen zhèr yǒu liǎng wèi Wáng lǎoshī.", "r": "Который Ван? У нас их две."}, {"t": "zh", "x": "塔拉斯: 我不知道她叫什么名字。她是女的。"}, {"t": "pr", "p": "Wǒ bù zhīdao tā jiào shénme míngzi. Tā shì nǚ de.", "r": "Не знаю, как её зовут. Она женщина."}, {"t": "zh", "x": "老师: 这儿的老师都是女的。"}, {"t": "pr", "p": "Zhèr de lǎoshī dōu shì nǚ de.", "r": "Здесь все учителя женщины."}, {"t": "zh", "x": "塔拉斯: 她戴一副眼镜。"}, {"t": "pr", "p": "Tā dài yí fù yǎnjìng.", "r": "Она носит очки."}, {"t": "zh", "x": "老师: 在我们这儿，每位老师都戴眼镜。"}, {"t": "pr", "p": "Zài wǒmen zhèr, měi wèi lǎoshī dōu dài yǎnjìng.", "r": "У нас каждый учитель носит очки."}, {"t": "zh", "x": "塔拉斯: 她瘦瘦的，高高的，头发长长的，穿一条牛仔裤。"}, {"t": "r", "x": "Tā shòushòu de, gāogāo de, tóufa chángcháng de, chuān yì tiáo niúzǎikù."}, {"t": "r", "x": "Она худенькая, высокая, с длинными волосами, в джинсах."}, {"t": "zh", "x": "老师: 哦，你要找王欢老师，她刚出去。"}, {"t": "pr", "p": "Ò, nǐ yào zhǎo Wáng Huān lǎoshī, tā gāng chūqu.", "r": "А, вам нужна Ван Хуань, она только что вышла."}, {"t": "zh", "x": "塔拉斯: 她大概什么时候回来?"}, {"t": "pr", "p": "Tā dàgài shénme shíhou huílai?", "r": "Когда она примерно вернётся?"}, {"t": "zh", "x": "老师: 不知道。你过一会儿再来看看吧。"}, {"t": "pr", "p": "Bù zhīdao. Nǐ guò yíhuìr zài lái kànkan ba.", "r": "Не знаю. Зайдите ещё раз попозже."}, {"t": "b", "x": "Разбор:** удвоение прилагательных: 瘦瘦的，高高的，长长的 (живописное описание). 每…都: «каждый… (все)». 刚 + глагол «только что». 过一会儿再… «через некоторое время снова». 这儿/那儿 после существительного: 老师那儿 «у преподавателя», 我们这儿 «у нас». Глаголы направления: 进来/进去, 出来/出去, 回来/回去 (来 к говорящему, 去 от него)."}, {"t": "b", "x": "Вопросы к урокам 7:"}, {"t": "zh", "x": "1. 安德烈打算什么时候去中国旅行?"}, {"t": "zh", "x": "2. 他跟谁一起去?"}, {"t": "zh", "x": "3. 他为什么有点儿担心?"}, {"t": "zh", "x": "4. 王欢老师是什么样的人? (описание)"}, {"t": "zh", "x": "Ответы: 1. 五月中旬或者下旬去。 2. 跟他的女朋友一起去。 3. 因为他们的汉语不太好。 4. 她瘦瘦的，高高的，头发长长的，戴一副眼镜，穿一条牛仔裤。"}]}, {"l": 8, "title": "Урок 8. Текст 1 (ищут банк и почту)", "rows": [{"t": "zh", "x": "安德烈: 请问，附近有没有银行?"}, {"t": "pr", "p": "Qǐngwèn, fùjìn yǒu méiyǒu yínháng?", "r": "Скажите, поблизости есть банк?"}, {"t": "zh", "x": "行人: 有。附近有一个中国银行。"}, {"t": "pr", "p": "Yǒu. Fùjìn yǒu yí gè Zhōngguó Yínháng.", "r": "Есть, недалеко Банк Китая."}, {"t": "zh", "x": "安德烈: 离这儿远不远?"}, {"t": "pr", "p": "Lí zhèr yuǎn bu yuǎn?", "r": "Далеко отсюда?"}, {"t": "zh", "x": "行人: 不太远。"}, {"t": "pr", "p": "Bú tài yuǎn.", "r": "Не очень."}, {"t": "zh", "x": "安德烈: 怎么走?"}, {"t": "pr", "p": "Zěnme zǒu?", "r": "Как пройти?"}, {"t": "zh", "x": "行人: 往前走一点儿，往右拐，过两条马路，就是中国银行。"}, {"t": "r", "x": "Wǎng qián zǒu yìdiǎnr, wǎng yòu guǎi, guò liǎng tiáo mǎlù, jiù shì Zhōngguó Yínháng."}, {"t": "r", "x": "Пройдите немного вперёд, поверните направо, перейдите две улицы, и вот Банк Китая."}, {"t": "zh", "x": "安德烈: 附近有没有邮局?"}, {"t": "pr", "p": "Fùjìn yǒu méiyǒu yóujú?", "r": "А почта поблизости есть?"}, {"t": "zh", "x": "行人: 有。邮局就在那个银行的旁边。"}, {"t": "pr", "p": "Yǒu. Yóujú jiù zài nàge yínháng de pángbiān.", "r": "Есть, почта прямо рядом с тем банком."}, {"t": "zh", "x": "安德烈: 谢谢您!"}, {"t": "pr", "p": "Xièxie nín!", "r": "Спасибо!"}, {"t": "zh", "x": "行人: 不客气。"}, {"t": "pr", "p": "Bú kèqi.", "r": "Не за что."}, {"t": "b", "x": "Разбор:** 有没有 = есть ли. 离 + место + 远/近: расстояние (离这儿远不远?). 往 + направление + глагол: 往前走, 往右拐. 就 подчёркивает «именно, прямо»: 就是, 就在…旁边."}]}, {"l": 8, "title": "Урок 8. Текст 2 (как доехать до центра)", "rows": [{"t": "zh", "x": "安德烈: 我们现在怎么去市中心呢?"}, {"t": "pr", "p": "Wǒmen xiànzài zěnme qù shì zhōngxīn ne?", "r": "Как нам сейчас добраться до центра?"}, {"t": "zh", "x": "张园园: 有人告诉我，可以坐地铁去。"}, {"t": "pr", "p": "Yǒu rén gàosu wǒ, kěyǐ zuò dìtiě qù.", "r": "Мне сказали, можно на метро."}, {"t": "zh", "x": "安德烈: 你知道怎么走吗?"}, {"t": "pr", "p": "Nǐ zhīdao zěnme zǒu ma?", "r": "Ты знаешь, как ехать?"}, {"t": "zh", "x": "张园园: 不知道。"}, {"t": "pr", "p": "Bù zhīdao.", "r": "Нет."}, {"t": "zh", "x": "安德烈: 我们问一下吧。同学，请问从这儿到市中心怎么走?"}, {"t": "r", "x": "Wǒmen wèn yíxià ba. Tóngxué, qǐngwèn cóng zhèr dào shì zhōngxīn zěnme zǒu?"}, {"t": "r", "x": "Давай спросим. Приятель, как отсюда добраться до центра?"}, {"t": "zh", "x": "学生: 你在学校门口坐139路公共汽车，坐五站，然后换地铁，坐两站，从地铁站出来，就是市中心。"}, {"t": "r", "x": "Nǐ zài xuéxiào ménkǒu zuò yāo-sān-jiǔ lù gōnggòng qìchē, zuò wǔ zhàn, ránhòu huàn dìtiě, zuò liǎng zhàn, cóng dìtiě zhàn chūlai, jiù shì shì zhōngxīn."}, {"t": "r", "x": "У входа в университет садитесь на автобус 139, едете пять остановок, потом пересаживаетесь на метро, две станции, выходите, и вот центр."}, {"t": "zh", "x": "张园园: 地铁站离汽车站远不远?"}, {"t": "pr", "p": "Dìtiě zhàn lí qìchē zhàn yuǎn bu yuǎn?", "r": "Станция метро далеко от остановки?"}, {"t": "zh", "x": "学生: 不远。你下车以后往右拐，过马路，就是地铁站。"}, {"t": "r", "x": "Bù yuǎn. Nǐ xià chē yǐhòu wǎng yòu guǎi, guò mǎlù, jiù shì dìtiě zhàn."}, {"t": "r", "x": "Недалеко. Выйдете, повернёте направо, перейдёте дорогу, и вот станция."}, {"t": "zh", "x": "安德烈: 能不能骑自行车去?"}, {"t": "pr", "p": "Néng bu néng qí zìxíngchē qù?", "r": "А на велосипеде можно?"}, {"t": "zh", "x": "学生: 不行，太远了!"}, {"t": "pr", "p": "Bù xíng, tài yuǎn le!", "r": "Нет, слишком далеко!"}, {"t": "b", "x": "Разбор:** 从 А 到 Б: «от А до Б». Транспорт: 坐 + транспорт (坐地铁, 坐公共汽车), но 骑 + велосипед/лошадь (骑自行车), пешком 走路. Номер маршрута: 139路, 1 читается yāo. 坐五站 «проехать пять остановок», 换 «пересесть». Направления-слова: 前/后, 左/右, 上/下, 里/外 + 面/边; 旁边 «рядом», 附近 «поблизости», 门口 «у входа»."}, {"t": "b", "x": "Вопросы к урокам 8:"}, {"t": "zh", "x": "1. 附近有没有银行? 怎么走?"}, {"t": "zh", "x": "2. 邮局在哪儿?"}, {"t": "zh", "x": "3. 从学校到市中心怎么走?"}, {"t": "zh", "x": "4. 为什么不能骑自行车去市中心?"}, {"t": "zh", "x": "Ответы: 1. 有。往前走一点儿，往右拐，过两条马路就是。 2. 邮局就在那个银行的旁边。 3. 在学校门口坐139路公共汽车，坐五站，然后换地铁，坐两站。 4. 因为太远了。"}]}], "lessons": [0, 1, 2, 3, 4, 5, 6, 7, 8]};
const LS = "hanyu-progress-v1";
const ROTATION = [0,1,2,3,4];   // уроки в ротации карточек при фильтре «Все»
const inRotation = o => lesson === "all" ? ROTATION.includes(o.l) : o.l === lesson;
let progress = {};
try { progress = JSON.parse(localStorage.getItem(LS)) || {}; } catch(e) {}
const saveP = () => { try { localStorage.setItem(LS, JSON.stringify(progress)); } catch(e) {} };
let lesson = "all";   // "all" | number
let tab = "fc";

const $ = id => document.getElementById(id);
const lname = n => n === 0 ? "К экзамену" : "Урок " + n;
const inLesson = o => lesson === "all" || o.l === lesson;

/* --- фильтр уроков --- */
const chipsBox = $("lessons");
const allChips = [["all","Все"]].concat(DATA.lessons.map(n => [n, lname(n)]));
allChips.forEach(([v, t]) => {
  const b = document.createElement("button");
  b.className = "chip" + (v === "all" ? " on" : "");
  b.textContent = t;
  b.onclick = () => { lesson = v;
    chipsBox.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
    b.classList.add("on"); refresh(); };
  chipsBox.appendChild(b);
});

/* --- вкладки --- */
document.querySelectorAll(".tabbar button").forEach(b => {
  b.onclick = () => { tab = b.dataset.tab;
    document.querySelectorAll(".tabbar button").forEach(x => x.classList.toggle("on", x === b));
    ["fc","words","sx","texts"].forEach(t => $("tab-" + t).classList.toggle("hidden", t !== tab));
    refresh(); };
});

function refresh(){
  if (tab === "fc") fcNew();
  if (tab === "words") renderWords();
  if (tab === "sx") sxNew();
  if (tab === "texts") renderTexts();
}

/* --- карточка иероглифа по клику --- */
const spanify = str => Array.from(str).map(ch =>
  /[一-鿿]/.test(ch) ? `<span class="hz-c">${ch}</span>` : ch).join("");
function showChar(ch){
  const exact = DATA.words.find(w => w.h === ch);
  const withCh = DATA.words.filter(w => w.h.includes(ch) && w.h !== ch).slice(0, 8);
  document.getElementById("sheet-char").textContent = ch;
  document.getElementById("sheet-py").textContent = exact ? exact.p + "   " + exact.r : "";
  document.getElementById("sheet-parts").textContent = exact && exact.c ? exact.c : "";
  const box = document.getElementById("sheet-words");
  box.innerHTML = withCh.length ? "<div style='color:var(--dim);font-size:12px'>слова с этим знаком:</div>" : "";
  withCh.forEach(w => {
    const d = document.createElement("div"); d.className = "wrow";
    d.innerHTML = `<div class="hz">${w.h}</div><div><span class="py">${w.p}</span><br><span class="ru">${w.r}</span></div>`;
    box.appendChild(d);
  });
  document.getElementById("sheet").classList.remove("hidden");
}
document.getElementById("sheet-close").onclick = () => document.getElementById("sheet").classList.add("hidden");
document.addEventListener("click", e => {
  if (e.target.classList && e.target.classList.contains("hz-c")) showChar(e.target.textContent);
});

/* --- карточки --- */
const BOXW = {0:8,1:5,2:3,3:1.5,4:0.7};
let fcWord = null, fcDir = "zh", fcShown = false, fcSession = {ok:0,all:0};
function pick(list, key){
  const ws = list.map(o => BOXW[(progress[key(o)]||{}).box || 0] || 0.7);
  let s = ws.reduce((a,b)=>a+b,0), r = Math.random()*s;
  for (let i=0;i<list.length;i++){ r -= ws[i]; if (r<=0) return list[i]; }
  return list[list.length-1];
}
function fcNew(){
  const pool = DATA.words.filter(inRotation);
  if (!pool.length) return;
  fcWord = pick(pool, o => o.h);
  fcDir = Math.random() < 0.5 ? "zh" : "ru";
  fcShown = false;
  $("fc-lesson").textContent = lname(fcWord.l);
  const q = $("fc-q");
  if (fcDir === "zh"){ q.textContent = fcWord.h; q.classList.remove("small"); }
  else { q.textContent = fcWord.r; q.classList.add("small"); }
  $("fc-a").textContent = ""; $("fc-parts").textContent = "";
  const bx = $("fc-btns"); bx.innerHTML = "";
  const show = document.createElement("button");
  show.className = "act primary"; show.textContent = "показать";
  show.onclick = fcReveal; bx.appendChild(show);
  stat();
}
function fcReveal(){
  if (fcShown) return; fcShown = true;
  if (fcDir === "zh"){ $("fc-a").textContent = fcWord.p + "   " + fcWord.r; }
  else { $("fc-q").textContent = fcWord.h; $("fc-q").classList.remove("small"); $("fc-a").textContent = fcWord.p; }
  $("fc-parts").textContent = fcWord.c || "";
  const bx = $("fc-btns"); bx.innerHTML = "";
  [["знал", true, "ok"], ["не знал", false, ""]].forEach(([t, v, cls]) => {
    const b = document.createElement("button");
    b.className = "act " + cls; b.textContent = t;
    b.onclick = () => { bump(fcWord.h, v); fcSession.all++; if (v) fcSession.ok++; fcNew(); };
    bx.appendChild(b);
  });
}
function bump(key, ok){
  const r = progress[key] || {box:0, seen:0, okc:0};
  r.seen++; if (ok){ r.okc++; r.box = Math.min((r.box||0)+1, 4); } else r.box = 0;
  progress[key] = r; saveP();
}
function stat(){
  const pool = DATA.words.filter(inRotation);
  const sure = pool.filter(o => (progress[o.h]||{}).box >= 3).length;
  $("fc-stat").textContent = `за сессию: ${fcSession.ok}/${fcSession.all} · уверенно: ${sure} из ${pool.length}`
    + (lesson === "all" ? " · в ротации уроки 0–4" : "");
}

/* --- слова --- */
function renderWords(){
  const q = ($("search").value || "").toLowerCase();
  const box = $("wlist"); box.innerHTML = "";
  DATA.words.filter(inLesson).filter(o =>
    !q || o.h.includes(q) || o.p.toLowerCase().includes(q) || o.r.toLowerCase().includes(q)
  ).forEach(o => {
    const d = document.createElement("div"); d.className = "wrow";
    d.innerHTML = `<div class="hz">${spanify(o.h)}</div>
      <div><span class="py">${o.p}</span> <span class="lesson-tag">· ${lname(o.l).toLowerCase()}</span><br>
      <span class="ru">${o.r}</span></div>` + (o.c ? `<div class="parts">${o.c}</div>` : "");
    box.appendChild(d);
  });
}
$("search").addEventListener("input", renderWords);

/* --- фразы --- */
let sent = null, built = [], sxScore = {ok:0, all:0};
function sxNew(){
  const pool = DATA.sents.filter(inRotation);
  const box = $("sx-chips"); box.innerHTML = "";
  $("sx-verdict").textContent = ""; $("sx-built").textContent = "…";
  $("sx-built").classList.remove("good");
  if (!pool.length){ $("sx-ru").textContent = "Для этого урока фраз пока нет."; sent = null; return; }
  sent = pick(pool, o => "s:" + o.t.join(""));
  built = [];
  $("sx-ru").textContent = sent.r;
  let order = sent.t.map((_, i) => i);
  do { order.sort(() => Math.random() - 0.5); }
  while (sent.t.length > 1 && order.every((v, i) => v === i));
  order.forEach(idx => {
    const b = document.createElement("button");
    b.className = "hz"; b.textContent = sent.t[idx];
    b.onclick = () => { if (b.disabled) return; b.disabled = true; built.push(idx);
      $("sx-built").textContent = built.map(i => sent.t[i]).join("") || "…"; };
    box.appendChild(b);
  });
}
$("sx-reset").onclick = () => { if (!sent) return; built = [];
  $("sx-chips").querySelectorAll("button").forEach(b => b.disabled = false);
  $("sx-built").textContent = "…"; $("sx-built").classList.remove("good"); $("sx-verdict").textContent = ""; };
$("sx-check").onclick = () => {
  if (!sent) return;
  const ok = built.length === sent.t.length && built.every((v, i) => v === i);
  sxScore.all++;
  bump("s:" + sent.t.join(""), ok);
  if (ok){ sxScore.ok++; $("sx-built").classList.add("good");
    $("sx-verdict").textContent = "对! верно"; }
  else { $("sx-verdict").textContent = "правильно: " + sent.t.join(""); }
  $("sx-score").textContent = `верно ${sxScore.ok} из ${sxScore.all}`;
};
$("sx-next").onclick = sxNew;

/* --- тексты --- */
let hidePy = false, hideRu = false;
function renderTexts(){
  const box = $("treader"); box.innerHTML = "";
  const blocks = DATA.texts.filter(t => lesson === "all" || t.l === lesson);
  if (!blocks.length){ box.innerHTML = '<div class="card">Для этого урока текстов пока нет.</div>'; return; }
  blocks.forEach(bl => {
    const h = document.createElement("div"); h.className = "t-h"; h.textContent = bl.title;
    box.appendChild(h);
    bl.rows.forEach(r => {
      const d = document.createElement("div");
      if (r.t === "zh"){ d.className = "t-zh hz"; d.innerHTML = spanify(r.x); }
      else if (r.t === "pr"){ d.className = "t-pr";
        d.innerHTML = (hidePy ? "" : `<span class="p">${r.p}</span> `) + (hideRu ? "" : `<span>${r.r}</span>`);
        if (hidePy && hideRu) return; }
      else if (r.t === "b"){ d.className = "t-b"; d.textContent = r.x; }
      else { d.className = "t-pr"; if (hideRu) return; d.textContent = r.x; }
      box.appendChild(d);
    });
  });
}
$("tg-py").onclick = () => { hidePy = !hidePy; $("tg-py").textContent = hidePy ? "показать пиньинь" : "скрыть пиньинь"; renderTexts(); };
$("tg-ru").onclick = () => { hideRu = !hideRu; $("tg-ru").textContent = hideRu ? "показать перевод" : "скрыть перевод"; renderTexts(); };

fcNew();
</script>
</body></html>
