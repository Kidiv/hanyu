/* --- карточка иероглифа по клику --- */
const spanify = str => Array.from(str).map(ch =>
  /[一-鿿]/.test(ch) ? `<span class="hz-c">${ch}</span>` : ch).join("");
const DICT = new Map();
DATA.words.forEach(w => { if (/^[\u4e00-\u9fff]+$/.test(w.h) && !DICT.has(w.h)) DICT.set(w.h, w); });
const segWords = str => {                // жадно по самому длинному слову из словника
  const out = [];
  for (let i = 0; i < str.length;){
    let n = Math.min(4, str.length - i);
    while (n > 1 && !DICT.has(str.substr(i, n))) n--;
    out.push(str.substr(i, n)); i += n;
  }
  return out;
};
const segHtml = str => str.replace(/[\u4e00-\u9fff]+/g,
  run => segWords(run).map(w => `<span class="hz-c">${w}</span>`).join(""));
function showChar(ch){
  const exact = DATA.words.find(w => w.h === ch);
  const withCh = DATA.words.filter(w => w.h.includes(ch) && w.h !== ch).slice(0, 8);
  document.getElementById("sheet-char").textContent = ch;
  document.getElementById("sheet-py").textContent = exact ? exact.p + "   " + exact.r : "";
  let parts = exact && exact.c ? exact.c : "";
  if (ch.length > 1){                      // у слова ещё и знаки по отдельности
    const each = Array.from(ch).map(c => DICT.get(c)).filter(Boolean)
      .map(w => w.h + " " + w.p + " " + w.r);
    if (each.length) parts += (parts ? "\n" : "") + each.join(" · ");
  }
  const sp = document.getElementById("sheet-parts");
  sp.textContent = parts; sp.style.whiteSpace = "pre-line";
  const box = document.getElementById("sheet-words");
  box.innerHTML = withCh.length ? "<div style='color:var(--dim);font-size:12px'>слова с этим знаком:</div>" : "";
  withCh.forEach(w => {
    const d = document.createElement("div"); d.className = "wrow";
    d.innerHTML = `<div class="hz">${w.h}</div><div><span class="py">${w.p}</span><br><span class="ru">${w.r}</span></div>`;
    box.appendChild(d);
  });
  document.getElementById("sheet").classList.remove("hidden");
}
document.getElementById("sheet-close").onclick = () => document.getElementById("sheet").classList.add("hidden");
document.addEventListener("click", e => {
  if (e.target.classList && e.target.classList.contains("hz-c")) showChar(e.target.textContent);
});

/* --- карточки --- */
const BOXW = {0:8,1:5,2:3,3:1.5,4:0.7};
let fcWord = null, fcDir = "zh", fcShown = false, fcSession = {ok:0,all:0};
function pick(list, key){
  const ws = list.map(o => BOXW[(progress[key(o)]||{}).box || 0] || 0.7);
  let s = ws.reduce((a,b)=>a+b,0), r = Math.random()*s;
  for (let i=0;i<list.length;i++){ r -= ws[i]; if (r<=0) return list[i]; }
  return list[list.length-1];
}
function fcNew(){
  const pool = DATA.words.filter(inRotation);
  if (!pool.length) return;
  fcWord = pick(pool, o => o.h);
  fcDir = Math.random() < 0.5 ? "zh" : "ru";
  fcShown = false;
  $("fc-lesson").textContent = lname(fcWord.l);
  const q = $("fc-q");
  if (fcDir === "zh"){ q.textContent = fcWord.h; q.classList.remove("small"); }
  else { q.textContent = fcWord.r; q.classList.add("small"); }
  $("fc-a").textContent = ""; $("fc-parts").textContent = "";
  const bx = $("fc-btns"); bx.innerHTML = "";
  const show = document.createElement("button");
  show.className = "act primary"; show.textContent = "показать";
  show.onclick = fcReveal; bx.appendChild(show);
  stat();
}
function fcReveal(){
  if (fcShown) return; fcShown = true;
  if (fcDir === "zh"){ $("fc-a").textContent = fcWord.p + "   " + fcWord.r; }
  else { $("fc-q").textContent = fcWord.h; $("fc-q").classList.remove("small"); $("fc-a").textContent = fcWord.p; }
  $("fc-parts").textContent = fcWord.c || "";
  const bx = $("fc-btns"); bx.innerHTML = "";
  [["знал", true, "ok"], ["не знал", false, ""]].forEach(([t, v, cls]) => {
    const b = document.createElement("button");
    b.className = "act " + cls; b.textContent = t;
    b.onclick = () => { bump(fcWord.h, v); fcSession.all++; if (v) fcSession.ok++; fcNew(); };
    bx.appendChild(b);
  });
}
function bump(key, ok){
  const r = progress[key] || {box:0, seen:0, okc:0};
  r.seen++; if (ok){ r.okc++; r.box = Math.min((r.box||0)+1, 4); } else r.box = 0;
  progress[key] = r; saveP();
}
function stat(){
  const pool = DATA.words.filter(inRotation);
  const sure = pool.filter(o => (progress[o.h]||{}).box >= 3).length;
  $("fc-stat").textContent = `за сессию: ${fcSession.ok}/${fcSession.all} · уверенно: ${sure} из ${pool.length}`
    + (lesson === "all" && ROTATION.length < DATA.lessons.length
      ? " · в ротации уроки " + ROTATION.join(",") : "");
}

/* --- слова --- */
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/ё/g, "е");
const matcher = q => {                   // поиск без тонов и без пробелов: gongsi, gong si, gōngsī
  const a = norm(q.trim()), b = a.replace(/[\s'’]/g, "");
  return s => { const n = norm(s); return n.includes(a) || n.replace(/[\s'’]/g, "").includes(b); };
};
/* Порядок в поиске слов: точное совпадение, потом слова, которые начинаются с набранного, потом остальные. */
function wordRank(o, q){
  const hq = q.trim(), nq = norm(hq).replace(/[\s'’]/g, ""), rq = norm(hq);
  const py = norm(o.p).replace(/[\s'’]/g, ""), ru = norm(o.r).split(/[^a-zа-я0-9]+/).filter(Boolean);
  if (o.h === hq || py === nq || ru.includes(rq)) return 0;
  if (o.h.startsWith(hq) || py.startsWith(nq) || ru.some(w => w.startsWith(rq))) return 1;
  return 2;
}
const byRank = (list, q) => list.map((o, i) => [wordRank(o, q), i, o]).sort((a, b) => a[0] - b[0] || a[1] - b[1]).map(x => x[2]);
function renderWords(){
  const q = ($("search").value || "").trim();
  const box = $("wlist"); box.innerHTML = "";
  const hit = matcher(q);
  let list = DATA.words.filter(inLesson).filter(o => !q || hit(o.h + " " + o.p + " " + o.r));
  if (q) list = byRank(list, q);
  list.forEach(o => {
    const d = document.createElement("div"); d.className = "wrow";
    d.innerHTML = `<div class="hz">${spanify(o.h)}</div>
      <div><span class="py">${o.p}</span> <span class="lesson-tag">· ${lname(o.l).toLowerCase()}</span><br>
      <span class="ru">${o.r}</span></div>` + (o.c ? `<div class="parts">${o.c}</div>` : "");
    box.appendChild(d);
  });
}
$("search").addEventListener("input", renderWords);

function sxNew(){
  const pool = DATA.sents.filter(inRotation);
  const box = $("sx-chips"); box.innerHTML = "";
  $("sx-verdict").textContent = ""; $("sx-built").textContent = "…";
  $("sx-built").classList.remove("good");
  if (!pool.length){ $("sx-ru").textContent = "Для этого урока фраз пока нет."; sent = null; return; }
  sent = pick(pool, o => "s:" + o.t.join(""));
  built = [];
  $("sx-ru").textContent = sent.r + (sent.w ? " · из тетради" : "");
  let order = sent.t.map((_, i) => i);
  do { order.sort(() => Math.random() - 0.5); }
  while (sent.t.length > 1 && order.every((v, i) => v === i));
  order.forEach(idx => {
    const b = document.createElement("button");
    b.className = "hz"; b.textContent = sent.t[idx];
    b.onclick = () => { if (b.disabled) return; b.disabled = true; built.push(idx);
      $("sx-built").textContent = built.map(i => sent.t[i]).join("") || "…"; };
    box.appendChild(b);
  });
}
$("sx-reset").onclick = () => { if (!sent) return; built = [];
  $("sx-chips").querySelectorAll("button").forEach(b => b.disabled = false);
  $("sx-built").textContent = "…"; $("sx-built").classList.remove("good"); $("sx-verdict").textContent = ""; };
$("sx-check").onclick = () => {
  if (!sent) return;
  const ok = built.length === sent.t.length && built.every((v, i) => v === i);
  sxScore.all++;
  bump("s:" + sent.t.join(""), ok);
  if (ok){ sxScore.ok++; $("sx-built").classList.add("good");
    $("sx-verdict").textContent = "对! верно" + (sent.p ? " · " + sent.p : ""); }
  else { $("sx-verdict").textContent = "правильно: " + sent.t.join("") + (sent.p ? " · " + sent.p : ""); }
  $("sx-score").textContent = `верно ${sxScore.ok} из ${sxScore.all}`;
};
$("sx-next").onclick = sxNew;

let task = null, tkScore = {ok:0, all:0};
function tkNew(){
  const pool = (DATA.tasks || []).filter(inRotation);
  const opts = $("tk-opts"); opts.innerHTML = "";
  $("tk-why").textContent = "";
  if (!pool.length){
    $("tk-lesson").textContent = "";
    $("tk-q").textContent = "Для этого урока заданий пока нет.";
    task = null; return;
  }
  task = pick(pool, o => "t:" + o.s);

  $("tk-q").innerHTML = task.gap
    ? task.s.replace("___", '<span class="gap">&nbsp;?&nbsp;</span>')
    : task.s;
  const long = !task.gap;
  $("tk-opts").className = long ? "long" : "";
  const all = [task.a].concat(task.o).sort(() => Math.random() - 0.5);
  all.forEach(v => {
    const b = document.createElement("button");
    b.className = "hz"; b.textContent = v;
    b.onclick = () => tkAnswer(b, v);
    opts.appendChild(b);
  });

function tkAnswer(btn, v){
  if (!task || btn.disabled) return;
  const ok = v === task.a;
  tkScore.all++; if (ok) tkScore.ok++;
  bump("t:" + task.s, ok);
  if (task.gap) $("tk-q").innerHTML = task.s.replace("___", '<span class="gap filled">' + task.a + '</span>');
  Array.from($("tk-opts").children).forEach(b => {
    b.disabled = true;
    if (b.textContent === task.a) b.classList.add("right");
    else if (b === btn) b.classList.add("wrong");
  });
  $("tk-why").textContent = (ok ? "对! " : "") + (task.e || "");
  $("tk-score").textContent = "верно " + tkScore.ok + " из " + tkScore.all;
}

/* --- шпаргалка --- */
const hzPlain = str => str.replace(/[\u4e00-\u9fff\u3001\u3002\uff0c\uff1f\uff01\u2026]+/g,
  m => '<span class="hz">' + m + '</span>');
const hzWrap = str => str.replace(/[\u4e00-\u9fff\u3001\u3002\uff0c\uff1f\uff01\u2026]+/g,
  m => '<span class="hz">' + segHtml(m) + '</span>');
const rowText = r => Object.keys(r).filter(k => k !== "k").map(k => [].concat(r[k]).join(" ")).join(" ");

/* ответ держится вместе со своей фразой, строка таблицы вместе со своей шапкой */
function cheatGroups(rows){
  const out = []; let th = null;
  rows.forEach(r => {
    if (r.k === "th"){ th = r; out.push({rows: [r], th: null}); return; }
    if (r.k === "ans" && out.length){ out[out.length - 1].rows.push(r); return; }
    out.push({rows: [r], th: r.k === "tr" ? th : null});
  });
  return out;
}

function cheatRow(r){
  const el = document.createElement("div");
  if (r.k === "h"){ el.className = "ch-h"; el.innerHTML = hzWrap(r.x); }
  else if (r.k === "trap"){
    el.className = "ch-trap";
    el.innerHTML = '<span class="bad">' + hzWrap(r.a) + '</span>' +
                   '<span class="arr">→</span>' +
                   '<span class="good">' + hzWrap(r.b) + '</span>' +
                   (r.n ? '<span class="note">' + hzWrap(r.n) + '</span>' : "");
  }
  else if (r.k === "ph" || r.k === "ans"){
    el.className = r.k === "ph" ? "ch-ph" : "ch-ans";
    el.innerHTML = '<div class="z">' + hzWrap(r.z) + '</div>' +
      (r.p ? '<div class="p">' + r.p + '</div>' : "") +
      (r.r ? '<div class="r">' + hzWrap(r.r) + '</div>' : "");
  }
  else { el.className = r.k === "b" ? "ch-b" : "ch-p"; el.innerHTML = hzWrap(r.x); }
  return el;
}

function renderCheat(){
  const q = ($("ch-search").value || "").trim();
  const hit = matcher(q);
  const box = $("ch-list");
  box.innerHTML = "";
  let shown = 0;

  if (q){                                  // словарь всех уроков прямо в поиске
    const nq = norm(q).replace(/[\s'’]/g, "");
    const words = byRank(DATA.words.filter(w => hit(w.h + " " + w.p + " " + w.r)), q);
    if (words.length){
      shown++;
      const d = document.createElement("details");
      d.className = "ch-sec ch-dict"; d.open = true;
      d.innerHTML = '<summary>Словарь: ' + words.length + '</summary>';
      const body = document.createElement("div"); body.className = "ch-body";
      words.slice(0, 30).forEach(o => {
        const w = document.createElement("div"); w.className = "wrow";
        w.innerHTML = `<div class="hz">${segHtml(o.h)}</div>
          <div><span class="py">${o.p}</span> <span class="lesson-tag">· ${lname(o.l).toLowerCase()}</span><br>
          <span class="ru">${o.r}</span></div>` + (o.c ? `<div class="parts">${o.c}</div>` : "");
        body.appendChild(w);
      });
      d.appendChild(body);
      box.appendChild(d);
    }
  }

  (DATA.cheat || []).forEach(sec => {
    const titleHit = q && hit(sec.t);
    let rows = sec.r;
    if (q && !titleHit){
      rows = [];
      let lastTh = null;
      cheatGroups(sec.r).forEach(g => {
        if (!g.rows.some(r => hit(rowText(r)))) return;
        if (g.th && g.th !== lastTh){ rows.push(g.th); lastTh = g.th; }
        if (g.rows[0].k === "th") lastTh = g.rows[0];
        rows.push(...g.rows);
      });
      if (!rows.length) return;
    }
    shown++;
    const d = document.createElement("details");
    d.className = "ch-sec";
    if (q) d.open = true;
    const sum = document.createElement("summary");
    sum.innerHTML = hzPlain(sec.t);
    d.appendChild(sum);
    const body = document.createElement("div");
    body.className = "ch-body";
    let tbl = null;
    rows.forEach(r => {
      if (r.k === "th" || r.k === "tr"){
        if (!tbl || r.k === "th"){
          tbl = document.createElement("table");
          tbl.className = "ch-tbl" + (r.c.length === 2 ? " w2" : "");
          body.appendChild(tbl);
        }
        const tr = document.createElement("tr");
        r.c.forEach(c => {
          const td = document.createElement("td");
          td.className = r.k === "th" ? "k" : "";
          td.innerHTML = hzWrap(c);
          tr.appendChild(td);
        });
        tbl.appendChild(tr);
        return;
      }
      tbl = null;
      body.appendChild(cheatRow(r));
    });
    d.appendChild(body);
    box.appendChild(d);
  });
  if (!shown){
    const none = document.createElement("div");
    none.className = "ch-none";
    none.textContent = "В шпаргалке ничего не нашлось. Попробуй другое слово, пиньинь без тонов или иероглиф.";
    box.appendChild(none);
  }
}
$("ch-search").addEventListener("input", renderCheat);

/* --- предложения уроков 1-10 в шпаргалке: пиньинь, первые буквы, по-русски своими словами, с опечатками (движок poisk18.js) --- */
let s8Timer = 0;
/* Похоже на предложение: три слова и больше, первые буквы подряд или пиньинь из трёх слогов. */
function sentenceLike(q){
  const toks = q.trim().split(/\s+/).filter(Boolean), t = toks.join("");
  if (toks.length >= 3) return true;
  if (/^[а-яё0-9]{4,}$/i.test(t)) return (t.match(/[аеёиоуыэюя]/gi) || []).length / t.length < 0.3;
  if (/^[a-z]{4,}$/i.test(t)) return !/[aeiouv]/i.test(t) || (t.match(/[aeiouv]+/gi) || []).length >= 3;
  return false;
}
function renderSent(){
  const box = $("ch-sent");
  box.innerHTML = "";
  if (typeof window.Poisk18Load !== "function") return;
  const q = ($("ch-search").value || "").trim();
  if (q.replace(/[^a-zа-яё0-9]/gi, "").length < 3) return;
  let got;
  try { got = window.Poisk18Load().search(q); } catch (e) { return; }
  if (!got || !got.length) return;
  // слово для шпаргалки, а не предложение: показываем только почти точное; если шпаргалка ничего не нашла, показываем и похожее
  const cheatEmpty = !!document.querySelector("#ch-list .ch-none");
  if (got[0].c > 0.3 && !sentenceLike(q) && !cheatEmpty) return;
  const d = document.createElement("details");
  d.className = "ch-sec"; d.open = true;
  d.innerHTML = '<summary>Предложения уроков 1-10: ' + got.length + '</summary>';
  const body = document.createElement("div"); body.className = "ch-body s8-list";
  got.forEach(r => body.appendChild(window.Poisk18.card(r)));
  d.appendChild(body);
  box.appendChild(d);
}
$("ch-search").addEventListener("input", () => { clearTimeout(s8Timer); s8Timer = setTimeout(renderSent, 250); });

/* --- тексты --- */
let hidePy = false, hideRu = false;
function renderTexts(){
  const box = $("treader"); box.innerHTML = "";
  const blocks = DATA.texts.filter(t => lesson === "all" || t.l === lesson);
  if (!blocks.length){ box.innerHTML = '<div class="card">Для этого урока текстов пока нет.</div>'; return; }
  blocks.forEach(bl => {
    const h = document.createElement("div"); h.className = "t-h"; h.textContent = bl.title;
    box.appendChild(h);
    bl.rows.forEach(r => {
      const d = document.createElement("div");
      if (r.t === "zh"){ d.className = "t-zh hz"; d.innerHTML = segHtml(r.x); }
      else if (r.t === "pr"){ d.className = "t-pr";
        d.innerHTML = (hidePy ? "" : `<span class="p">${r.p}</span> `) + (hideRu ? "" : `<span>${r.r}</span>`);
        if (hidePy && hideRu) return; }
      else if (r.t === "b"){ d.className = "t-b"; d.textContent = r.x; }
      else { d.className = "t-pr"; if (hideRu) return; d.textContent = r.x; }
      box.appendChild(d);
    });
  });
}
$("tg-py").onclick = () => { hidePy = !hidePy; $("tg-py").textContent = hidePy ? "показать пиньинь" : "скрыть пиньинь"; renderTexts(); };
$("tg-ru").onclick = () => { hideRu = !hideRu; $("tg-ru").textContent = hideRu ? "показать перевод" : "скрыть перевод"; renderTexts(); };

fcNew();
