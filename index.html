<style>
:root{
  --bg:#f2f4f6; --panel:#ffffff; --ink:#22282d; --dim:#68727c; --line:#dce1e6;
  --acc:#b23a26; --on-acc:#ffffff; --good:#2e7d5b; --chip:#e7ebee; --used:#f0f2f4;
  --shadow:0 1px 3px rgba(30,40,50,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181b; --panel:#1f2226; --ink:#e9eaec; --dim:#98a1aa; --line:#33383e;
    --acc:#d9573f; --on-acc:#ffffff; --good:#5db88e; --chip:#2a2e33; --used:#1a1d20;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#16181b; --panel:#1f2226; --ink:#e9eaec; --dim:#98a1aa; --line:#33383e;
  --acc:#d9573f; --on-acc:#ffffff; --good:#5db88e; --chip:#2a2e33; --used:#1a1d20;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans","Segoe UI",sans-serif;
  min-height:100vh;padding-bottom:76px}
.hz{font-family:"Noto Serif SC","SimSun",serif}
header{padding:14px 16px 8px;max-width:760px;margin:0 auto}
h1{font-size:19px;margin:0 0 10px;font-weight:600;letter-spacing:.2px}
h1 .hz{color:var(--acc);margin-right:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
main{max-width:760px;margin:0 auto;padding:4px 16px}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabbar button{background:none;border:0;color:var(--dim);font:inherit;font-size:12px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 10px;border-radius:10px}
.tabbar button .ico{font-size:20px;line-height:1}
.tabbar button.on{color:var(--acc)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  padding:16px;margin:10px 0}
button.act{background:var(--chip);color:var(--ink);border:0;border-radius:10px;padding:10px 18px;
  font:inherit;font-weight:500;cursor:pointer}
button.act.primary{background:var(--acc);color:var(--on-acc)}
button.act.ok{color:var(--good)}
button.act:focus-visible,.chip:focus-visible,.tabbar button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* карточки */
#fc-q{font-size:52px;text-align:center;margin:18px 0 6px;min-height:70px}
#fc-q.small{font-size:20px;font-family:"IBM Plex Sans",sans-serif}
#fc-a{text-align:center;color:var(--acc);min-height:24px;font-size:16px}
#fc-parts{text-align:center;color:var(--dim);font-size:13px;min-height:20px;margin-top:4px}
#fc-lesson{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
#fc-btns{justify-content:center;margin-top:14px}
#fc-stat{color:var(--dim);font-size:12px;text-align:center;margin-top:10px}
/* слова */
#search{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel);color:var(--ink);font:inherit}
.wrow{display:grid;grid-template-columns:96px 1fr;gap:4px 14px;padding:10px 4px;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wrow .hz{font-size:24px}
.wrow .py{color:var(--acc);font-size:13px}
.wrow .ru{font-size:14px}
.wrow .parts{grid-column:1/3;color:var(--dim);font-size:12.5px}
.lesson-tag{color:var(--dim);font-size:11px}
/* фразы */
#sx-ru{font-size:16px;margin:4px 0 10px}
#sx-built{font-size:26px;min-height:40px;color:var(--acc)}
#sx-built.good{color:var(--good)}
#sx-verdict{min-height:22px;font-size:14px;color:var(--dim)}
#sx-chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
#sx-chips button{font-size:20px;padding:8px 14px;background:var(--chip);border:0;border-radius:10px;
  color:var(--ink);cursor:pointer}
#sx-chips button:disabled{background:var(--used);color:var(--dim)}
#sx-score{color:var(--dim);font-size:12px;margin-top:8px}
/* задания из тетради */
#tk-lesson{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
#tk-q{font-size:24px;margin:10px 0 4px;line-height:1.6}
#tk-q .gap{color:var(--acc);border-bottom:2px solid var(--acc);padding:0 10px}
#tk-q .gap.filled{border-bottom-color:var(--good);color:var(--good)}
#tk-opts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
#tk-opts button{font-size:20px;padding:8px 16px;background:var(--chip);border:0;border-radius:10px;
  color:var(--ink);cursor:pointer}
#tk-opts button.right{background:var(--good);color:#fff}
#tk-opts button.wrong{background:var(--acc);color:#fff}
#tk-opts button:disabled{opacity:.55}
#tk-opts.long{flex-direction:column;align-items:stretch}
#tk-opts.long button{font-size:18px;text-align:left;line-height:1.5}
#tk-modes{display:flex;gap:8px;margin-bottom:8px}
#tk-modes button{font-size:12.5px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer}
#tk-modes button.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.tk-item{padding:10px 0;border-bottom:1px solid var(--line)}
.tk-item:last-child{border-bottom:0}
.tk-item .num{color:var(--dim);font-size:12px}
.tk-item .q{font-size:19px;margin:2px 0 4px}
.tk-item .q .ans{color:var(--good)}
.tk-item .vars{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.tk-item .opt{background:var(--chip);color:var(--ink);border:0;border-radius:8px;
  padding:7px 12px;font:inherit;font-size:16px;cursor:pointer;font-family:"Noto Serif SC","SimSun",serif}
.tk-item .opt.right{background:var(--good);color:#fff}
.tk-item .opt.wrong{background:var(--acc);color:#fff}
.tk-item .opt.off{opacity:.45;cursor:default}
.tk-item .opt.long{flex:1 1 100%;text-align:left}
/* Ответы отрисованы сразу и просто скрыты: переключение это класс, а не перерисовка. */
.tk-item .ans{display:none}
.tk-item .why{display:none}
.show-ans .tk-item .ans,.tk-item.done .ans{display:inline}
.show-ans .tk-item .why,.tk-item.done .why{display:block}
.tk-item .ansline{display:none;color:var(--good);font-size:15px;margin-top:5px}
.show-ans .tk-item .ansline,.tk-item.done .ansline{display:block}
.tk-item .ansline b{font-family:"Noto Serif SC","SimSun",serif;font-weight:600}
.show-ans .tk-item .blank,.tk-item.done .blank{display:none}
.show-ans .tk-item .opt.key,.tk-item.done .opt.key{background:var(--good);color:#fff}
.tk-head{display:flex;align-items:center;gap:10px}
.eye{background:none;border:1px solid var(--line);color:var(--dim);border-radius:999px;
  font:inherit;font-size:11.5px;padding:2px 9px;cursor:pointer;line-height:1.5}
.eye:hover{color:var(--ink)}
.tk-item .num{display:flex;align-items:center;gap:8px}
.tk-item .why{color:var(--dim);font-size:12.5px;margin-top:2px}
#tk-why{font-size:13.5px;color:var(--dim);min-height:20px;margin-top:4px}
#tk-score{color:var(--dim);font-size:12px;margin-top:10px}
/* тексты */
.t-h{color:var(--acc);font-weight:600;font-size:16px;margin:20px 0 8px}
.t-zh{font-size:19px;margin:6px 0 0}
.t-pr{color:var(--dim);font-size:13px;margin:0 0 4px}
.t-pr .p{color:var(--acc)}
.t-b{color:var(--dim);font-size:13px;border-left:3px solid var(--line);padding-left:10px;margin:10px 0}
.toggles{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:3}
.hidden{display:none}
.hz-c{cursor:pointer}
.hz-c:active{color:var(--acc)}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  box-shadow:0 -4px 20px rgba(0,0,0,.18);border-radius:16px 16px 0 0;padding:16px;z-index:10;
  max-height:65vh;overflow-y:auto;max-width:760px;margin:0 auto}
#sheet.hidden{display:none}
#sheet-close{float:right;background:var(--chip);border:0;border-radius:8px;color:var(--dim);
  font:inherit;padding:4px 10px;cursor:pointer}
#sheet-char{font-size:56px;line-height:1.2}
#sheet-py{color:var(--acc);font-size:15px}
#sheet-parts{color:var(--dim);font-size:13px;margin:4px 0 8px}
#sheet-words .wrow .hz{font-size:20px}
@media (min-width:700px){
  #fc-q{font-size:64px}
}
</style>

<main>

    <div id="treader"></div>
  </section>
</main>
<div id="sheet" class="hidden">
  <button id="sheet-close">закрыть</button>
  <div id="sheet-char" class="hz"></div>
  <div id="sheet-py"></div>
  <div id="sheet-parts"></div>
  <div id="sheet-words"></div>
</div>

 "x": ""}, {"t": "zh", "x": "丁汉生: 你一个人去吗?"}, {"t": "pr", "p": "Nǐ yí gè rén qù ma?", "r": "Едешь один?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 不，跟我的女朋友一起去。可是，我们的汉语不太好，我有点儿担心。"}, {"t": "r", "x": "Bù, gēn wǒ de nǚpéngyou yìqǐ qù. Kěshì, wǒmen de Hànyǔ bú tài hǎo, wǒ yǒudiǎnr dānxīn."}, {"t": "r", "x": "Нет, с девушкой. Но наш китайский не очень, я немного беспокоюсь."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "丁汉生: 你别担心。我在上海、四川都有朋友，可以请他们帮助你。"}, {"t": "r", "x": "Nǐ bié dānxīn. Wǒ zài Shànghǎi, Sìchuān dōu yǒu péngyou, kěyǐ qǐng tāmen bāngzhù nǐ."}, {"t": "r", "x": "Не беспокойся. У меня в Шанхае и Сычуани есть друзья, попрошу их помочь тебе."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Разбор:** даты: год (二〇〇五年) → месяц (四月) → число (三十号/日). 以前 / 以后 после отрезка времени: 七月一号以前 «до 1 июля», 放假以后 «после начала каникул». 或者 «или» в утверждении, 还是 в вопросе. 有点儿 + прил./глагол «немного» (о неприятном). 别 + глагол: запрет."}, {"t": "sp", "x": ""}]}, {"l": 7, "title": "Урок 7. Текст 2 (ищет учителя Ван)", "rows": [{"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: 请问，可以进来吗?"}, {"t": "pr", "p": "Qǐngwèn, kěyǐ jìnlai ma?", "r": "Простите, можно войти?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "老师: 你找谁?"}, {"t": "pr", "p": "Nǐ zhǎo shuí?", "r": "Вы к кому?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: 我找王老师。"}, {"t": "pr", "p": "Wǒ zhǎo Wáng lǎoshī.", "r": "Мне нужна учитель Ван."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "老师: 哪位王老师? 我们这儿有两位王老师。"}, {"t": "pr", "p": "Nǎ wèi Wáng lǎoshī? Wǒmen zhèr yǒu liǎng wèi Wáng lǎoshī.", "r": "Который Ван? У нас их две."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: 我不知道她叫什么名字。她是女的。"}, {"t": "pr", "p": "Wǒ bù zhīdao tā jiào shénme míngzi. Tā shì nǚ de.", "r": "Не знаю, как её зовут. Она женщина."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "老师: 这儿的老师都是女的。"}, {"t": "pr", "p": "Zhèr de lǎoshī dōu shì nǚ de.", "r": "Здесь все учителя женщины."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: 她戴一副眼镜。"}, {"t": "pr", "p": "Tā dài yí fù yǎnjìng.", "r": "Она носит очки."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "老师: 在我们这儿，每位老师都戴眼镜。"}, {"t": "pr", "p": "Zài wǒmen zhèr, měi wèi lǎoshī dōu dài yǎnjìng.", "r": "У нас каждый учитель носит очки."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: 她瘦瘦的，高高的，头发长长的，穿一条牛仔裤。"}, {"t": "r", "x": "Tā shòushòu de, gāogāo de, tóufa chángcháng de, chuān yì tiáo niúzǎikù."}, {"t": "r", "x": "Она худенькая, высокая, с длинными волосами, в джинсах."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "老师: 哦，你要找王欢老师，她刚出去。"}, {"t": "pr", "p": "Ò, nǐ yào zhǎo Wáng Huān lǎoshī, tā gāng chūqu.", "r": "А, вам нужна Ван Хуань, она только что вышла."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: 她大概什么时候回来?"}, {"t": "pr", "p": "Tā dàgài shénme shíhou huílai?", "r": "Когда она примерно вернётся?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "老师: 不知道。你过一会儿再来看看吧。"}, {"t": "pr", "p": "Bù zhīdao. Nǐ guò yíhuìr zài lái kànkan ba.", "r": "Не знаю. Зайдите ещё раз попозже."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Разбор:** удвоение прилагательных: 瘦瘦的，高高的，长长的 (живописное описание). 每…都: «каждый… (все)». 刚 + глагол «только что». 过一会儿再… «через некоторое время снова». 这儿/那儿 после существительного: 老师那儿 «у преподавателя», 我们这儿 «у нас». Глаголы направления: 进来/进去, 出来/出去, 回来/回去 (来 к говорящему, 去 от него)."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Вопросы к урокам 7:"}, {"t": "zh", "x": "1. 安德烈打算什么时候去中国旅行?"}, {"t": "zh", "x": "2. 他跟谁一起去?"}, {"t": "zh", "x": "3. 他为什么有点儿担心?"}, {"t": "zh", "x": "4. 王欢老师是什么样的人? (описание)"}, {"t": "zh", "x": "Ответы: 1. 五月中旬或者下旬去。 2. 跟他的女朋友一起去。 3. 因为他们的汉语不太好。 4. 她瘦瘦的，高高的，头发长长的，戴一副眼镜，穿一条牛仔裤。"}, {"t": "sp", "x": ""}]}, {"l": 8, "title": "Урок 8. Текст 1 (ищут банк и почту)", "rows": [{"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 请问，附近有没有银行?"}, {"t": "pr", "p": "Qǐngwèn, fùjìn yǒu méiyǒu yínháng?", "r": "Скажите, поблизости есть банк?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "行人: 有。附近有一个中国银行。"}, {"t": "pr", "p": "Yǒu. Fùjìn yǒu yí gè Zhōngguó Yínháng.", "r": "Есть, недалеко Банк Китая."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 离这儿远不远?"}, {"t": "pr", "p": "Lí zhèr yuǎn bu yuǎn?", "r": "Далеко отсюда?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "行人: 不太远。"}, {"t": "pr", "p": "Bú tài yuǎn.", "r": "Не очень."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 怎么走?"}, {"t": "pr", "p": "Zěnme zǒu?", "r": "Как пройти?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "行人: 往前走一点儿，往右拐，过两条马路，就是中国银行。"}, {"t": "r", "x": "Wǎng qián zǒu yìdiǎnr, wǎng yòu guǎi, guò liǎng tiáo mǎlù, jiù shì Zhōngguó Yínháng."}, {"t": "r", "x": "Пройдите немного вперёд, поверните направо, перейдите две улицы, и вот Банк Китая."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 附近有没有邮局?"}, {"t": "pr", "p": "Fùjìn yǒu méiyǒu yóujú?", "r": "А почта поблизости есть?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "行人: 有。邮局就在那个银行的旁边。"}, {"t": "pr", "p": "Yǒu. Yóujú jiù zài nàge yínháng de pángbiān.", "r": "Есть, почта прямо рядом с тем банком."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 谢谢您!"}, {"t": "pr", "p": "Xièxie nín!", "r": "Спасибо!"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "行人: 不客气。"}, {"t": "pr", "p": "Bú kèqi.", "r": "Не за что."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Разбор:** 有没有 = есть ли. 离 + место + 远/近: расстояние (离这儿远不远?). 往 + направление + глагол: 往前走, 往右拐. 就 подчёркивает «именно, прямо»: 就是, 就在…旁边."}, {"t": "sp", "x": ""}]}, {"l": 8, "title": "Урок 8. Текст 2 (как доехать до центра)", "rows": [{"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 我们现在怎么去市中心呢?"}, {"t": "pr", "p": "Wǒmen xiànzài zěnme qù shì zhōngxīn ne?", "r": "Как нам сейчас добраться до центра?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "张园园: 有人告诉我，可以坐地铁去。"}, {"t": "pr", "p": "Yǒu rén gàosu wǒ, kěyǐ zuò dìtiě qù.", "r": "Мне сказали, можно на метро."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 你知道怎么走吗?"}, {"t": "pr", "p": "Nǐ zhīdao zěnme zǒu ma?", "r": "Ты знаешь, как ехать?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "张园园: 不知道。"}, {"t": "pr", "p": "Bù zhīdao.", "r": "Нет."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 我们问一下吧。同学，请问从这儿到市中心怎么走?"}, {"t": "r", "x": "Wǒmen wèn yíxià ba. Tóngxué, qǐngwèn cóng zhèr dào shì zhōngxīn zěnme zǒu?"}, {"t": "r", "x": "Давай спросим. Приятель, как отсюда добраться до центра?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "学生: 你在学校门口坐139路公共汽车，坐五站，然后换地铁，坐两站，从地铁站出来，就是市中心。"}, {"t": "r", "x": "Nǐ zài xuéxiào ménkǒu zuò yāo-sān-jiǔ lù gōnggòng qìchē, zuò wǔ zhàn, ránhòu huàn dìtiě, zuò liǎng zhàn, cóng dìtiě zhàn chūlai, jiù shì shì zhōngxīn."}, {"t": "r", "x": "У входа в университет садитесь на автобус 139, едете пять остановок, потом пересаживаетесь на метро, две станции, выходите, и вот центр."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "张园园: 地铁站离汽车站远不远?"}, {"t": "pr", "p": "Dìtiě zhàn lí qìchē zhàn yuǎn bu yuǎn?", "r": "Станция метро далеко от остановки?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "学生: 不远。你下车以后往右拐，过马路，就是地铁站。"}, {"t": "r", "x": "Bù yuǎn. Nǐ xià chē yǐhòu wǎng yòu guǎi, guò mǎlù, jiù shì dìtiě zhàn."}, {"t": "r", "x": "Недалеко. Выйдете, повернёте направо, перейдёте дорогу, и вот станция."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 能不能骑自行车去?"}, {"t": "pr", "p": "Néng bu néng qí zìxíngchē qù?", "r": "А на велосипеде можно?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "学生: 不行，太远了!"}, {"t": "pr", "p": "Bù xíng, tài yuǎn le!", "r": "Нет, слишком далеко!"}, {"t": "sp", "x": ""}, {"t": "b", "x": "Разбор:** 从 А 到 Б: «от А до Б». Транспорт: 坐 + транспорт (坐地铁, 坐公共汽车), но 骑 + велосипед/лошадь (骑自行车), пешком 走路. Номер маршрута: 139路, 1 читается yāo. 坐五站 «проехать пять остановок», 换 «пересесть». Направления-слова: 前/后, 左/右, 上/下, 里/外 + 面/边; 旁边 «рядом», 附近 «поблизости», 门口 «у входа»."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Вопросы к урокам 8:"}, {"t": "zh", "x": "1. 附近有没有银行? 怎么走?"}, {"t": "zh", "x": "2. 邮局在哪儿?"}, {"t": "zh", "x": "3. 从学校到市中心怎么走?"}, {"t": "zh", "x": "4. 为什么不能骑自行车去市中心?"}, {"t": "zh", "x": "Ответы: 1. 有。往前走一点儿，往右拐，过两条马路就是。 2. 邮局就在那个银行的旁边。 3. 在学校门口坐139路公共汽车，坐五站，然后换地铁，坐两站。 4. 因为太远了。"}]}, {"l": 9, "title": "Урок 9. Текст 1 (разговор со стариком в парке)", "rows": [{"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 老人家，这只小狗真可爱。"}, {"t": "pr", "p": "Lǎorénjia, zhè zhī xiǎo gǒu zhēn kě'ài.", "r": "Дедушка, эта собачка такая милая."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "老人: 是啊。我以前养过花儿，养过鸟儿，但是不喜欢养狗。"}, {"t": "r", "x": "Shì a. Wǒ yǐqián yǎngguo huār, yǎngguo niǎor, dànshì bù xǐhuan yǎng gǒu."}, {"t": "r", "x": "Да. Я раньше выращивал цветы, держал птичек, но собак держать не любил."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "老人: 来这儿以后，这儿的人都喜欢养狗，我也养狗了。"}, {"t": "r", "x": "Lái zhèr yǐhòu, zhèr de rén dōu xǐhuan yǎng gǒu, wǒ yě yǎng gǒu le."}, {"t": "r", "x": "После переезда сюда, здесь все любят собак, вот и я завёл."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 听说在中国城市里不能养狗，是吗?"}, {"t": "r", "x": "Tīngshuō zài Zhōngguó chéngshì li bù néng yǎng gǒu, shì ma?"}, {"t": "r", "x": "Говорят, в китайских городах нельзя держать собак, это так?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "老人: 以前不行，现在可以了。有的人喜欢养狗，有的人喜欢养猫，"}, {"t": "r", "x": "Yǐqián bù xíng, xiànzài kěyǐ le. Yǒude rén xǐhuan yǎng gǒu, yǒude rén xǐhuan yǎng māo,"}, {"t": "r", "x": "Раньше было нельзя, теперь можно. Одни любят собак, другие кошек,"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "老人: 有的人喜欢养鸟儿，还有的人喜欢养鱼……你也喜欢养小动物?"}, {"t": "r", "x": "yǒude rén xǐhuan yǎng niǎor, hái yǒude rén xǐhuan yǎng yú... Nǐ yě xǐhuan yǎng xiǎo dòngwù?"}, {"t": "r", "x": "третьи птичек, а кто-то рыбок... Ты тоже любишь держать животных?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 我喜欢小动物，但是不养小动物。"}, {"t": "pr", "p": "Wǒ xǐhuan xiǎo dòngwù, dànshì bù yǎng xiǎo dòngwù.", "r": "Я люблю животных, но не завожу их."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "老人: 为什么? 是不是太麻烦?"}, {"t": "pr", "p": "Wèi shénme? Shì bu shì tài máfan?", "r": "Почему? Слишком хлопотно?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 不是。因为我没有时间，也没有钱。我只能养我自己。"}, {"t": "r", "x": "Bú shì. Yīnwèi wǒ méiyǒu shíjiān, yě méiyǒu qián. Wǒ zhǐ néng yǎng wǒ zìjǐ."}, {"t": "r", "x": "Нет. У меня нет ни времени, ни денег. Я могу прокормить только себя."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Разбор:** 过 после глагола означает опыт в прошлом (养过 «доводилось держать»), отрицание 没(有) + глагол + 过. 了 в конце показывает перемену: 我也养狗了 «теперь и я завёл». 有的人…有的人… «одни… другие…». 是不是 «правда ли» между подлежащим и сказуемым."}, {"t": "sp", "x": ""}]}, {"l": 9, "title": "Урок 9. Текст 2 (прощание перед командировкой)", "rows": [{"t": "sp", "x": ""}, {"t": "zh", "x": "白小红: 听说，你要去上海了?"}, {"t": "pr", "p": "Tīngshuō, nǐ yào qù Shànghǎi le?", "r": "Говорят, ты уезжаешь в Шанхай?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: 对啊。公司让我去上海办点儿事儿。"}, {"t": "pr", "p": "Duì a. Gōngsī ràng wǒ qù Shànghǎi bàn diǎnr shìr.", "r": "Да, компания посылает уладить дела."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "白小红: 什么时候走?"}, {"t": "pr", "p": "Shénme shíhou zǒu?", "r": "Когда едешь?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: 下星期三。"}, {"t": "pr", "p": "Xià xīngqīsān.", "r": "В следующую среду."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "白小红: 你对北京很熟悉了吧?"}, {"t": "pr", "p": "Nǐ duì Běijīng hěn shúxī le ba?", "r": "Ты ведь уже хорошо знаешь Пекин?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: 当然。你看这些照片。这是故宫，这是颐和园……"}, {"t": "r", "x": "Dāngrán. Nǐ kàn zhèxiē zhàopiàn. Zhè shì Gùgōng, zhè shì Yíhéyuán..."}, {"t": "r", "x": "Конечно. Посмотри эти фотографии. Это Гугун, это Ихэюань..."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "白小红: 你登过长城吗?"}, {"t": "pr", "p": "Nǐ dēngguo Chángchéng ma?", "r": "Ты поднимался на Великую стену?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: “不到长城非好汉”，我怎么能不登长城呢?"}, {"t": "r", "x": "\"Bú dào Chángchéng fēi hǎohàn\", wǒ zěnme néng bù dēng Chángchéng ne?"}, {"t": "r", "x": "«Кто не был на Великой стене, тот не молодец», как я мог не подняться?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "白小红: 你还去过别的城市吗?"}, {"t": "pr", "p": "Nǐ hái qùguo biéde chéngshì ma?", "r": "Ты бывал в других городах?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: 上海、西安、成都……我都去过。可是，有一个地方我还没去过。"}, {"t": "r", "x": "Shànghǎi, Xī'ān, Chéngdū... wǒ dōu qùguo. Kěshì, yǒu yí ge dìfang wǒ hái méi qùguo."}, {"t": "r", "x": "Шанхай, Сиань, Чэнду... везде был. Но одно место я ещё не видел."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "白小红: 什么地方?"}, {"t": "pr", "p": "Shénme dìfang?", "r": "Какое место?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: 你的家。"}, {"t": "pr", "p": "Nǐ de jiā.", "r": "Твой дом."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "白小红: 欢迎你去呀! 要是你想去的话，我陪你一起去。但是，你得给我买机票。"}, {"t": "r", "x": "Huānyíng nǐ qù ya! Yàoshi nǐ xiǎng qù dehua, wǒ péi nǐ yìqǐ qù. Dànshì, nǐ děi gěi wǒ mǎi jīpiào."}, {"t": "r", "x": "Добро пожаловать! Если хочешь, поеду с тобой. Но билет на самолёт покупаешь ты."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Разбор:** 要…了 «вот-вот, скоро» о будущем: 你要去上海了. 对 + место + 熟悉 «хорошо знать что-то». 这些 / 那些 / 哪些 множественное от 这 / 那 / 哪, счётное слово после них не ставится. 要是…的话 «если». 得 děi «должен, надо»."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Вопросы к уроку 9:"}, {"t": "zh", "x": "1. 老人以前养过什么?"}, {"t": "zh", "x": "2. 安德烈为什么不养小动物?"}, {"t": "zh", "x": "3. 塔拉斯什么时候去上海?"}, {"t": "zh", "x": "4. 塔拉斯去过哪些城市?"}, {"t": "zh", "x": "5. 塔拉斯还没去过什么地方?"}, {"t": "zh", "x": "Ответы: 1. 养过花儿，养过鸟儿。 2. 因为他没有时间，也没有钱。 3. 下星期三。 4. 上海、西安、成都，还有北京。 5. 白小红的家。"}, {"t": "sp", "x": ""}]}, {"l": 10, "title": "Урок 10. Текст 1 (в аудитории, Ван Ин не пришла)", "rows": [{"t": "sp", "x": ""}, {"t": "zh", "x": "老师: 大家都来了吗?"}, {"t": "pr", "p": "Dàjiā dōu lái le ma?", "r": "Все пришли?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "托马什: 王英还没来，别的同学都来了。"}, {"t": "pr", "p": "Wáng Yīng hái méi lái, biéde tóngxué dōu lái le.", "r": "Ван Ин ещё нет, остальные пришли."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "老师: 王英怎么啦?"}, {"t": "pr", "p": "Wáng Yīng zěnme la?", "r": "Что с Ван Ин?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "托马什: 不知道。"}, {"t": "pr", "p": "Bù zhīdao.", "r": "Не знаю."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "里奇: 她住学生宿舍，每天在学校餐厅吃早饭。"}, {"t": "r", "x": "Tā zhù xuésheng sùshè, měi tiān zài xuéxiào cāntīng chī zǎofàn."}, {"t": "r", "x": "Она живёт в общежитии и каждый день завтракает в студенческой столовой."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "田中: 我想，现在她可能正在吃早饭。"}, {"t": "pr", "p": "Wǒ xiǎng, xiànzài tā kěnéng zhèngzài chī zǎofàn.", "r": "Думаю, сейчас она как раз завтракает."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "金容南: 大概还在睡觉呢。"}, {"t": "pr", "p": "Dàgài hái zài shuìjiào ne.", "r": "Наверное, ещё спит."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "里奇: 不可能，她肯定已经起床了。"}, {"t": "pr", "p": "Bù kěnéng, tā kěndìng yǐjīng qǐchuáng le.", "r": "Не может быть, она точно уже встала."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "张园园: 你们都错了。王英去医院了。"}, {"t": "pr", "p": "Nǐmen dōu cuò le. Wáng Yīng qù yīyuàn le.", "r": "Вы все ошибаетесь. Ван Ин пошла в больницу."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "老师: 怎么，她病了吗?"}, {"t": "pr", "p": "Zěnme, tā bìng le ma?", "r": "Как, она заболела?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "张园园: 她有点儿不舒服。"}, {"t": "pr", "p": "Tā yǒudiǎnr bù shūfu.", "r": "Ей немного нездоровится."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Разбор:** 正在 / 在 + глагол = действие прямо сейчас: 正在吃早饭. Отличать от предлога 在 + место (在餐厅吃饭). 还没 + глагол «ещё не». 已经…了 «уже». 怎么啦 «что случилось?» (о положении дел), 怎么 «как, каким образом», 怎么样 «каков». Удвоенное счётное слово даёт «каждый»: 天天 = 每天, 个个都, 张张都."}, {"t": "sp", "x": ""}]}, {"l": 10, "title": "Урок 10. Текст 2 (Ван Ин у врача)", "rows": [{"t": "sp", "x": ""}, {"t": "zh", "x": "王英: 医生，我肚子疼。"}, {"t": "pr", "p": "Yīshēng, wǒ dùzi téng.", "r": "Доктор, у меня болит живот."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "医生: 你是不是吃了不干净的东西?"}, {"t": "pr", "p": "Nǐ shì bu shì chīle bù gānjìng de dōngxi?", "r": "Вы не съели ли чего-то несвежего?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "王英: 没有啊。"}, {"t": "pr", "p": "Méiyǒu a.", "r": "Да нет."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "医生: 今天早上吃了什么?"}, {"t": "pr", "p": "Jīntiān zǎoshang chīle shénme?", "r": "Что вы ели сегодня утром?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "王英: 吃了几片面包，喝了一杯牛奶。……不过，昨天晚上朋友请客，"}, {"t": "r", "x": "Chīle jǐ piàn miànbāo, hēle yì bēi niúnǎi. ... Búguò, zuótiān wǎnshang péngyou qǐng kè,"}, {"t": "r", "x": "Съела несколько кусочков хлеба, выпила стакан молока. ...Правда, вчера друг угощал,"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "王英: 我们去了学校附近的一个饭店，我吃了很多生鱼片。"}, {"t": "r", "x": "wǒmen qùle xuéxiào fùjìn de yí ge fàndiàn, wǒ chīle hěn duō shēng yúpiàn."}, {"t": "r", "x": "мы пошли в ресторан рядом с университетом, и я съела много сашими."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "医生: 可能生鱼片不太新鲜。你得吃药，还得……"}, {"t": "r", "x": "Kěnéng shēng yúpiàn bú tài xīnxiān. Nǐ děi chī yào, hái děi..."}, {"t": "r", "x": "Возможно, рыба была несвежая. Вам нужно принимать лекарство, и ещё..."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "王英: 对不起……"}, {"t": "pr", "p": "Duìbuqǐ...", "r": "Извините..."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "医生: 别着急，我还没说完呢。你得吃药，还得……"}, {"t": "r", "x": "Bié zháojí, wǒ hái méi shuō-wán ne. Nǐ děi chī yào, hái děi..."}, {"t": "r", "x": "Не спешите, я ещё не договорил. Вам нужно принимать лекарство, и ещё..."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "王英: 对不起，厕所在哪儿?"}, {"t": "pr", "p": "Duìbuqǐ, cèsuǒ zài nǎr?", "r": "Извините, где туалет?"}, {"t": "sp", "x": ""}, {"t": "b", "x": "Разбор:** 了 после глагола = действие завершено: 吃了几片面包, 喝了一杯牛奶, 去了一个饭店. Сравни с 了 в конце предложения (перемена): 她去医院了. Счётные слова еды: 片 (ломтики), 杯 (стаканы), 块 (куски). 几 здесь «несколько», а не «сколько». 得 děi «надо»: 你得吃药. 别 + глагол: 别着急."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Вопросы к уроку 10:"}, {"t": "zh", "x": "1. 王英为什么没来上课?"}, {"t": "zh", "x": "2. 她住在哪儿? 每天在哪儿吃早饭?"}, {"t": "zh", "x": "3. 王英今天早上吃了什么?"}, {"t": "zh", "x": "4. 医生说，她为什么肚子疼?"}, {"t": "zh", "x": "5. 医生让她做什么?"}, {"t": "zh", "x": "Ответы: 1. 因为她有点儿不舒服，去医院了。 2. 她住学生宿舍，每天在学校餐厅吃早饭。 3. 吃了几片面包，喝了一杯牛奶。 4. 可能昨天晚上的生鱼片不太新鲜。 5. 让她吃药。"}]}], "tasks": [{"s": "«В выходные я отдыхаю дома»", "a": "周末我在家里休息。", "o": ["我周末在家里休息吗。", "周末在家里我休 function refresh(){

/* --- карточка иероглифа по клику --- */
const spanify = str => Array.from(str).map(ch =>
  /[一-鿿]/.test(ch) ? `<span class="hz-c">${ch}</span>` : ch).join("");
function showChar(ch){
  const exact = DATA.words.find(w => w.h === ch);
  const withCh = DATA.words.filter(w => w.h.includes(ch) && w.h !== ch).slice(0, 8);
  document.getElementById("sheet-char").textContent = ch;
  document.getElementById("sheet-py").textContent = exact ? exact.p + "   " + exact.r : "";
  document.getElementById("sheet-parts").textContent = exact && exact.c ? exact.c : "";
  const box = document.getElementById("sheet-words");
  box.innerHTML = withCh.length ? "<div style='color:var(--dim);font-size:12px'>слова с этим знаком:</div>" : "";
  withCh.forEach(w => {
    const d = document.createElement("div"); d.className = "wrow";
    d.innerHTML = `<div class="hz">${w.h}</div><div><span class="py">${w.p}</span><br><span class="ru">${w.r}</span></div>`;
    box.appendChild(d);
  });
  document.getElementById("sheet").classList.remove("hidden");
}
document.getElementById("sheet-close").onclick = () => document.getElementById("sheet").classList.add("hidden");
document.addEventListener("click", e => {
  if (e.target.classList && e.target.classList.contains("hz-c")) showChar(e.target.textContent);
});

/* --- карточки --- */
const BOXW = {0:8,1:5,2:3,3:1.5,4:0.7};
let fcWord = null, fcDir = "zh", fcShown = false, fcSession = {ok:0,all:0};
function pick(list, key){
  const ws = list.map(o => BOXW[(progress[key(o)]||{}).box || 0] || 0.7);
  let s = ws.reduce((a,b)=>a+b,0), r = Math.random()*s;
  for (let i=0;i<list.length;i++){ r -= ws[i]; if (r<=0) return list[i]; }
  return list[list.length-1];
}
function fcNew(){
  const pool = DATA.words.filter(inRotation);
  if (!pool.length) return;
  fcWord = pick(pool, o => o.h);
  fcDir = Math.random() < 0.5 ? "zh" : "ru";
  fcShown = false;
  $("fc-lesson").textContent = lname(fcWord.l);
  const q = $("fc-q");
  if (fcDir === "zh"){ q.textContent = fcWord.h; q.classList.remove("small"); }
  else { q.textContent = fcWord.r; q.classList.add("small"); }
  $("fc-a").textContent = ""; $("fc-parts").textContent = "";
  const bx = $("fc-btns"); bx.innerHTML = "";
  const show = document.createElement("button");
  show.className = "act primary"; show.textContent = "показать";
  show.onclick = fcReveal; bx.appendChild(show);
  stat();
}
function fcReveal(){
  if (fcShown) return; fcShown = true;
  if (fcDir === "zh"){ $("fc-a").textContent = fcWord.p + "   " + fcWord.r; }
  else { $("fc-q").textContent = fcWord.h; $("fc-q").classList.remove("small"); $("fc-a").textContent = fcWord.p; }
  $("fc-parts").textContent = fcWord.c || "";
  const bx = $("fc-btns"); bx.innerHTML = "";
  [["знал", true, "ok"], ["не знал", false, ""]].forEach(([t, v, cls]) => {
    const b = document.createElement("button");
    b.className = "act " + cls; b.textContent = t;
    b.onclick = () => { bump(fcWord.h, v); fcSession.all++; if (v) fcSession.ok++; fcNew(); };
    bx.appendChild(b);
  });
}
function bump(key, ok){
  const r = progress[key] || {box:0, seen:0, okc:0};
  r.seen++; if (ok){ r.okc++; r.box = Math.min((r.box||0)+1, 4); } else r.box = 0;
  progress[key] = r; saveP();
}
function stat(){
  const pool = DATA.words.filter(inRotation);
  const sure = pool.filter(o => (progress[o.h]||{}).box >= 3).length;
  $("fc-stat").textContent = `за сессию: ${fcSession.ok}/${fcSession.all} · уверенно: ${sure} из ${pool.length}`
    + (lesson === "all" && ROTATION.length < DATA.lessons.length
      ? " · в ротации уроки " + ROTATION.join(",") : "");
}

/* --- слова --- */
function renderWords(){
  const q = ($("search").value || "").toLowerCase();
  const box = $("wlist"); box.innerHTML = "";
  DATA.words.filter(inLesson).filter(o =>
    !q || o.h.includes(q) || o.p.toLowerCase().includes(q) || o.r.toLowerCase().includes(q)
  ).forEach(o => {
    const d = document.createElement("div"); d.className = "wrow";
    d.innerHTML = `<div class="hz">${spanify(o.h)}</div>
      <div><span class="py">${o.p}</span> <span class="lesson-tag">· ${lname(o.l).toLowerCase()}</span><br>
      <span class="ru">${o.r}</span></div>` + (o.c ? `<div class="parts">${o.c}</div>` : "");
    box.appendChild(d);
  });
}
$("search").addEventListener("input", renderWords);

/* --- фразы --- */
let sent = null, built = [], sxScore = {ok:0, all:0};
function sxNew(){
  const pool = DATA.sents.filter(inRotation);
  const box = $("sx-chips"); box.innerHTML = "";
  $("sx-verdict").textContent = ""; $("sx-built").textContent = "…";
  $("sx-built").classList.remove("good");
  if (!pool.length){ $("sx-ru").textContent = "Для этого урока фраз пока нет."; sent = null; return; }
  sent = pick(pool, o => "s:" + o.t.join(""));
  built = [];
  $("sx-ru").textContent = sent.r;
  let order = sent.t.map((_, i) => i);
  do { order.sort(() => Math.random() - 0.5); }
  while (sent.t.length > 1 && order.every((v, i) => v === i));
  order.forEach(idx => {
    const b = document.createElement("button");
    b.className = "hz"; b.textContent = sent.t[idx];
    b.onclick = () => { if (b.disabled) return; b.disabled = true; built.push(idx);
      $("sx-built").textContent = built.map(i => sent.t[i]).join("") || "…"; };
    box.appendChild(b);
  });
}
$("sx-reset").onclick = () => { if (!sent) return; built = [];
  $("sx-chips").querySelectorAll("button").forEach(b => b.disabled = false);
  $("sx-built").textContent = "…"; $("sx-built").classList.remove("good"); $("sx-verdict").textContent = ""; };
$("sx-check").onclick = () => {
  if (!sent) return;
  const ok = built.length === sent.t.length && built.every((v, i) => v === i);
  sxScore.all++;

  if (ok){ sxScore.ok++; $("sx-built").classList.add("good");
    $("sx-verdict").textContent = "对! верно"; }
  else { $("sx-verdict").textContent = "правильно: " + sent.t.join(""); }

  const pool = (DATA.tasks || []).filter(inRotation);
  const opts = $("tk-opts"); opts.innerHTML = "";
  $("tk-why").textContent = "";

    $("tk-lesson").textContent = "";
    $("tk-q").textContent = "Для этого урока заданий пока нет.";

  task = pick(pool, o => "t:" + o.s);
  $("tk-lesson").textContent = lname(task.l) + " · вставь пропущенное";
  $("tk-q").innerHTML = task.gap
    ? task.s.replace("___", '<span class="gap">&nbsp;?&nbsp;</span>')
    : task.s;
  const long = !task.gap;
  $("tk-opts").className = long ? "long" : "";
  const all = [task.a].concat(task.o).sort(() => Math.random() - 0.5);
  all.forEach(v => {
    const b = document.createElement("button");
    b.className = "hz"; b.textContent = v;
    b.onclick = () => tkAnswer(b, v);
    opts.appendChild(b);
  });
}
function tkAnswer(btn, v){
  if (!task || btn.disabled) return;
  const ok = v === task.a;
  tkScore.all++; if (ok) tkScore.ok++;
  bump("t:" + task.s, ok);
  if (task.gap) $("tk-q").innerHTML = task.s.replace("___", '<span class="gap filled">' + task.a + '</span>');
  Array.from($("tk-opts").children).forEach(b => {
    b.disabled = true;
    if (b.textContent === task.a) b.classList.add("right");
    else if (b === btn) b.classList.add("wrong");
  });
  $("tk-why").textContent = (ok ? "对! " : "") + (task.e || "");
  $("tk-score").textContent = "верно " + tkScore.ok + " из " + tkScore.all;
}

      const wasOpen = d.classList.contains("done");
      d.classList.toggle("done", !wasOpen);
      if (wasOpen) tkResetItem(d, vars, why, t);   // закрыли ответ: даём перерешать
    };
    head.appendChild(num); head.appendChild(eye);
    d.appendChild(head);
    const qd = document.createElement("div");
    qd.className = "q hz";
    qd.innerHTML = q;
    d.appendChild(qd);
    const vars = document.createElement("div");
    vars.className = "vars";
    const ansline = document.createElement("div");
    ansline.className = "ansline";
    ansline.innerHTML = "ответ: <b>" + t.a + "</b>";
    const why = document.createElement("div");
    why.className = "why";
    why.textContent = t.e || "";
    [t.a].concat(t.o).slice().sort(() => Math.random() - 0.5).forEach(v => {
      const b = document.createElement("button");
      b.className = "opt" + (t.gap ? "" : " long") + (v === t.a ? " key" : "");
      b.textContent = v;
      b.onclick = () => {
        if (vars.dataset.done) return;
        vars.dataset.done = "1";
        const ok = v === t.a;
        bump("t:" + t.s, ok);
        vars.querySelectorAll(".opt").forEach(x => {
          if (x.classList.contains("key")) x.classList.add("right");
          else if (x === b) x.classList.add("wrong");
          else x.classList.add("off");
        });
        why.textContent = (ok ? "对! " : "") + (t.e || "");
        d.classList.add("done");
        d.dataset.answered = "1";
      };
      vars.appendChild(b);
    });
    d.appendChild(vars);
    d.appendChild(ansline);
    d.appendChild(why);
    block.appendChild(d);
  });
}
$("tk-mode-one").onclick = () => tkSetMode("one");
$("tk-mode-all").onclick = () => tkSetMode("all");
$("tk-show-ans").onclick = () => {
  tkAnswers = !tkAnswers;
  $("tk-show-ans").textContent = tkAnswers ? "скрыть ответы" : "показать ответы";
  // только класс на контейнере: список не пересобирается, поэтому переключение мгновенное
  $("tk-list").classList.toggle("show-ans", tkAnswers);
  if (!tkAnswers)
    $("tk-list").querySelectorAll(".lesson-block.show-ans")
      .forEach(b => b.classList.remove("show-ans"));
};
$("tk-show-ans").style.display = "none";

/* --- тексты --- */
let hidePy = false, hideRu = false;
function renderTexts(){
  const box = $("treader"); box.innerHTML = "";
  const blocks = DATA.texts.filter(t => lesson === "all" || t.l === lesson);
  if (!blocks.length){ box.innerHTML = '<div class="card">Для этого урока текстов пока нет.</div>'; return; }
  blocks.forEach(bl => {
    const h = document.createElement("div"); h.className = "t-h"; h.textContent = bl.title;
    box.appendChild(h);
    bl.rows.forEach(r => {
      const d = document.createElement("div");
      if (r.t === "zh"){ d.className = "t-zh hz"; d.innerHTML = spanify(r.x); }
      else if (r.t === "pr"){ d.className = "t-pr";
        d.innerHTML = (hidePy ? "" : `<span class="p">${r.p}</span> `) + (hideRu ? "" : `<span>${r.r}</span>`);
        if (hidePy && hideRu) return; }
      else if (r.t === "b"){ d.className = "t-b"; d.textContent = r.x; }
      else { d.className = "t-pr"; if (hideRu) return; d.textContent = r.x; }
      box.appendChild(d);
    });
  });
}
$("tg-py").onclick = () => { hidePy = !hidePy; $("tg-py").textContent = hidePy ? "показать пиньинь" : "скрыть пиньинь"; renderTexts(); };
$("tg-ru").onclick = () => { hideRu = !hideRu; $("tg-ru").textContent = hideRu ? "показать перевод" : "скрыть перевод"; renderTexts(); };

fcNew();
