<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ханьюй-тренажёр</title></head><body><noscript><div style="padding:14px;background:#b23a26;color:#fff;font-family:sans-serif">Этот просмотрщик отключил JavaScript, приложение не сможет работать. Откройте файл в браузере.</div></noscript><script>window.onerror=function(m,s,l,c){var d=document.createElement("div");d.style.cssText="padding:10px;background:#b23a26;color:#fff;font:13px sans-serif;white-space:pre-wrap";d.textContent="Ошибка: "+m+" ("+l+":"+c+")";document.body.insertBefore(d,document.body.firstChild);};document.addEventListener("DOMContentLoaded",function(){var v=document.getElementById("vtag");if(v)v.textContent="v8·js";});</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
:root{
  --bg:#f2f4f6; --panel:#ffffff; --ink:#22282d; --dim:#68727c; --line:#dce1e6;
  --acc:#b23a26; --on-acc:#ffffff; --good:#2e7d5b; --chip:#e7ebee; --used:#f0f2f4;
  --shadow:0 1px 3px rgba(30,40,50,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181b; --panel:#1f2226; --ink:#e9eaec; --dim:#98a1aa; --line:#33383e;
    --acc:#d9573f; --on-acc:#ffffff; --good:#5db88e; --chip:#2a2e33; --used:#1a1d20;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#16181b; --panel:#1f2226; --ink:#e9eaec; --dim:#98a1aa; --line:#33383e;
  --acc:#d9573f; --on-acc:#ffffff; --good:#5db88e; --chip:#2a2e33; --used:#1a1d20;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans","Segoe UI",sans-serif;
  min-height:100vh;padding-bottom:76px}
.hz{font-family:"Noto Serif SC","SimSun",serif}
header{padding:14px 16px 8px;max-width:760px;margin:0 auto}
h1{font-size:19px;margin:0 0 10px;font-weight:600;letter-spacing:.2px}
h1 .hz{color:var(--acc);margin-right:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
main{max-width:760px;margin:0 auto;padding:4px 16px}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabbar button{background:none;border:0;color:var(--dim);font:inherit;font-size:11px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 4px;border-radius:10px;
  flex:1 1 0;min-width:0}
.tabbar button .ico{font-size:19px;line-height:1}
@media (max-width:360px){ .tabbar button{font-size:10px} .tabbar button .ico{font-size:17px} }
.tabbar button.on{color:var(--acc)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  padding:16px;margin:10px 0}
button.act{background:var(--chip);color:var(--ink);border:0;border-radius:10px;padding:10px 18px;
  font:inherit;font-weight:500;cursor:pointer}
button.act.primary{background:var(--acc);color:var(--on-acc)}
button.act.ok{color:var(--good)}
button.act:focus-visible,.chip:focus-visible,.tabbar button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* карточки */
#fc-q{font-size:52px;text-align:center;margin:18px 0 6px;min-height:70px}
#fc-q.small{font-size:20px;font-family:"IBM Plex Sans",sans-serif}
#fc-a{text-align:center;color:var(--acc);min-height:24px;font-size:16px}
#fc-parts{text-align:center;color:var(--dim);font-size:13px;min-height:20px;margin-top:4px}
#fc-lesson{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
#fc-btns{justify-content:center;margin-top:14px}
#fc-stat{color:var(--dim);font-size:12px;text-align:center;margin-top:10px}
/* слова */
#search{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel);color:var(--ink);font:inherit}
.wrow{display:grid;grid-template-columns:96px 1fr;gap:4px 14px;padding:10px 4px;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wrow .hz{font-size:24px}
.wrow .py{color:var(--acc);font-size:13px}
.wrow .ru{font-size:14px}
.wrow .parts{grid-column:1/3;color:var(--dim);font-size:12.5px}
.lesson-tag{color:var(--dim);font-size:11px}
/* фразы */
#sx-ru{font-size:16px;margin:4px 0 10px}
#sx-built{font-size:26px;min-height:40px;color:var(--acc)}
#sx-built.good{color:var(--good)}
#sx-verdict{min-height:22px;font-size:14px;color:var(--dim)}
#sx-chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
#sx-chips button{font-size:20px;padding:8px 14px;background:var(--chip);border:0;border-radius:10px;
  color:var(--ink);cursor:pointer}
#sx-chips button:disabled{background:var(--used);color:var(--dim)}
#sx-score{color:var(--dim);font-size:12px;margin-top:8px}
/* задания из тетради */
#tk-lesson{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
#tk-q{font-size:24px;margin:10px 0 4px;line-height:1.6}
#tk-q .gap{color:var(--acc);border-bottom:2px solid var(--acc);padding:0 10px}
#tk-q .gap.filled{border-bottom-color:var(--good);color:var(--good)}
#tk-opts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
#tk-opts button{font-size:20px;padding:8px 16px;background:var(--chip);border:0;border-radius:10px;
  color:var(--ink);cursor:pointer}
#tk-opts button.right{background:var(--good);color:#fff}
#tk-opts button.wrong{background:var(--acc);color:#fff}
#tk-opts button:disabled{opacity:.55}
#tk-opts.long{flex-direction:column;align-items:stretch}
#tk-opts.long button{font-size:18px;text-align:left;line-height:1.5}
#tk-modes{display:flex;gap:8px;margin-bottom:8px}
#tk-modes button{font-size:12.5px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer}
#tk-modes button.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.tk-item{padding:10px 0;border-bottom:1px solid var(--line)}
.tk-item:last-child{border-bottom:0}
.tk-item .num{color:var(--dim);font-size:12px}
.tk-item .q{font-size:19px;margin:2px 0 4px}
.tk-item .q .ans{color:var(--good)}
.tk-item .vars{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.tk-item .opt{background:var(--chip);color:var(--ink);border:0;border-radius:8px;
  padding:7px 12px;font:inherit;font-size:16px;cursor:pointer;font-family:"Noto Serif SC","SimSun",serif}
.tk-item .opt.right{background:var(--good);color:#fff}
.tk-item .opt.wrong{background:var(--acc);color:#fff}
.tk-item .opt.off{opacity:.45;cursor:default}
.tk-item .opt.long{flex:1 1 100%;text-align:left}
/* Ответы отрисованы сразу и просто скрыты: переключение это класс, а не перерисовка. */
.tk-item .ans{display:none}
.tk-item .why{display:none}
.show-ans .tk-item .ans,.tk-item.done .ans{display:inline}
.show-ans .tk-item .why,.tk-item.done .why{display:block}
.tk-item .ansline{display:none;color:var(--good);font-size:15px;margin-top:5px}
.show-ans .tk-item .ansline,.tk-item.done .ansline{display:block}
.tk-item .ansline b{font-family:"Noto Serif SC","SimSun",serif;font-weight:600}
.show-ans .tk-item .blank,.tk-item.done .blank{display:none}
.show-ans .tk-item .opt.key,.tk-item.done .opt.key{background:var(--good);color:#fff}
.tk-head{display:flex;align-items:center;gap:10px}
.eye{background:none;border:1px solid var(--line);color:var(--dim);border-radius:999px;
  font:inherit;font-size:11.5px;padding:2px 9px;cursor:pointer;line-height:1.5}
.eye:hover{color:var(--ink)}
.tk-item .num{display:flex;align-items:center;gap:8px}
.tk-item .why{color:var(--dim);font-size:12.5px;margin-top:2px}
#tk-why{font-size:13.5px;color:var(--dim);min-height:20px;margin-top:4px}
#tk-score{color:var(--dim);font-size:12px;margin-top:10px}
/* шпаргалка */
#ch-search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel);color:var(--ink);font:inherit;font-size:16px}
.ch-top{position:sticky;top:0;background:var(--bg);padding:8px 0 6px;z-index:4}
.ch-hint{color:var(--dim);font-size:12px;margin-top:6px}
.ch-sec{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);margin:8px 0;overflow:hidden}
.ch-sec > summary{cursor:pointer;list-style:none;padding:13px 16px;font-weight:600;font-size:15.5px;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.ch-sec > summary::-webkit-details-marker{display:none}
.ch-sec > summary::after{content:"＋";color:var(--acc);font-size:16px}
.ch-sec[open] > summary::after{content:"－"}
.ch-body{padding:0 16px 14px}
.ch-h{color:var(--acc);font-weight:600;font-size:14px;margin:10px 0 4px}
.ch-p{margin:6px 0;font-size:14.5px;line-height:1.6}
.ch-b{margin:6px 0 6px 2px;font-size:14.5px;line-height:1.6;display:flex;gap:8px}
.ch-b::before{content:"·";color:var(--acc);font-weight:700}
.ch-trap{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:7px 0;font-size:15px}
.ch-trap .bad{color:var(--acc);text-decoration:line-through}
.ch-trap .good{color:var(--good)}
.ch-trap .arr{color:var(--dim)}
@media (max-width:520px){            /* на телефоне пара читается в две строки */
  .ch-trap{flex-direction:column;align-items:flex-start;gap:1px}
  .ch-trap .arr{display:none}
  .ch-trap .good::before{content:"→ ";color:var(--dim)}
}
.ch-tbl{width:100%;border-collapse:collapse;margin:6px 0 2px;font-size:14.5px}
.ch-tbl td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.ch-tbl tr:last-child td{border-bottom:0}
.ch-tbl .k{color:var(--dim);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em}
.ch-tbl td:first-child{padding-right:14px}
.ch-ph{padding:7px 0 6px;border-top:1px solid var(--line)}
.ch-ph .z{font-size:19px;line-height:1.5}
.ch-ph .p{color:var(--acc);font-size:13.5px}
.ch-ph .r{color:var(--dim);font-size:13.5px}
.ch-ans{margin:0 0 4px 4px;padding:3px 0 5px 12px;border-left:3px solid var(--good)}
.ch-ans .z{font-size:19px;line-height:1.5;color:var(--good)}
.ch-ans .p{color:var(--acc);font-size:13.5px}
.ch-ans .r{color:var(--dim);font-size:13.5px}
.ch-trap .note{flex-basis:100%;color:var(--dim);font-size:12.5px;margin-top:-4px}
.ch-body .hz-c{text-decoration:underline dotted var(--dim);text-underline-offset:4px;
  text-decoration-thickness:1px;cursor:pointer}
.ch-body .hz-c + .hz-c{margin-left:3px}
.ch-dict .wrow{grid-template-columns:auto 1fr}
.ch-none{color:var(--dim);font-size:14px;padding:12px 2px}
/* тексты */
.t-h{color:var(--acc);font-weight:600;font-size:16px;margin:20px 0 8px}
.t-zh{font-size:19px;margin:6px 0 0}
.t-pr{color:var(--dim);font-size:13px;margin:0 0 4px}
.t-pr .p{color:var(--acc)}
.t-b{color:var(--dim);font-size:13px;border-left:3px solid var(--line);padding-left:10px;margin:10px 0}
.toggles{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:3}
.hidden{display:none}
.hz-c{cursor:pointer}
.hz-c:active{color:var(--acc)}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
  box-shadow:0 -4px 20px rgba(0,0,0,.18);border-radius:16px 16px 0 0;padding:16px;z-index:10;
  max-height:65vh;overflow-y:auto;max-width:760px;margin:0 auto}
#sheet.hidden{display:none}
#sheet-close{float:right;background:var(--chip);border:0;border-radius:8px;color:var(--dim);
  font:inherit;padding:4px 10px;cursor:pointer}
#sheet-char{font-size:56px;line-height:1.2}
#sheet-py{color:var(--acc);font-size:15px}
#sheet-parts{color:var(--dim);font-size:13px;margin:4px 0 8px}
#sheet-words .wrow .hz{font-size:20px}
@media (min-width:700px){
  #fc-q{font-size:64px}
}
/* Карточки поиска по урокам 1-8: общие для отдельной страницы и шпаргалки тренажёра. Цвета из токенов страницы. */
:root{--s8-mark:#f7dcae;--s8-mark-ink:#5a3a08}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s8-mark:#6a4a1a;--s8-mark-ink:#ffe7c2}}
:root[data-theme="dark"]{--s8-mark:#6a4a1a;--s8-mark-ink:#ffe7c2}
.s8-card{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.s8-card.s8-hit{border-color:var(--good);box-shadow:inset 3px 0 0 var(--good)}
.s8-tag{margin:0;font-size:12px;color:var(--dim)}
.s8-tag .s8-near{color:var(--acc)}
.s8-tag .s8-ok{color:var(--good);font-weight:600}
.s8-ru{margin:0;font-weight:600}
.s8-zh{margin:2px 0 0;font-size:26px;line-height:1.35}
.s8-py{margin:0;font-size:15px;color:var(--ink)}
.s8-card mark{background:var(--s8-mark);color:var(--s8-mark-ink);border-radius:3px;padding:0 2px}
.s8-fix{margin:0;font-size:13px;color:var(--acc)}
.s8-from{margin:0;font-size:13px;color:var(--dim)}
.s8-from span[lang]{font-size:15px;color:var(--ink)}
.s8-alt{margin:4px 0 0;padding-top:6px;border-top:1px dashed var(--line);font-size:14px;color:var(--dim)}
.s8-alt span[lang]{font-size:18px;color:var(--ink)}
.s8-row{display:flex;gap:8px;margin-top:4px}
@media (prefers-reduced-motion: no-preference){.s8-card{animation:s8in .14s ease-out}@keyframes s8in{from{transform:translateY(3px);opacity:.6}to{transform:none;opacity:1}}}
.s8-zh{font-family:var(--f-zh,"Noto Serif SC","Songti SC","PingFang SC","SimSun","Microsoft YaHei",serif)}
.s8-btn{min-height:34px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.s8-btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.s8-list{display:flex;flex-direction:column;gap:10px}

</style>

<header>
  <h1><span class="hz">汉语</span>Ханьюй-тренажёр <span id="vtag" style="font-size:11px;color:#98a1aa">v8</span></h1>
  <div class="chips" id="lessons"></div>
</header>
<main>
  <section id="tab-fc">
    <div class="card">
      <div id="fc-lesson"></div>
      <div id="fc-q" class="hz"></div>
      <div id="fc-a"></div>
      <div id="fc-parts"></div>
      <div class="row" id="fc-btns"></div>
      <div id="fc-stat"></div>
    </div>
  </section>
  <section id="tab-words" class="hidden">
    <input id="search" placeholder="поиск: иероглиф, пиньинь или перевод">
    <div class="card" id="wlist"></div>
  </section>
  <section id="tab-sx" class="hidden">
    <div class="card">
      <div id="sx-ru"></div>
      <div id="sx-built" class="hz">…</div>
      <div id="sx-verdict"></div>
      <div id="sx-chips"></div>
      <div class="row">
        <button class="act" id="sx-reset">сброс</button>
        <button class="act primary" id="sx-check">проверить</button>
        <button class="act ok" id="sx-next">следующее</button>
      </div>
      <div id="sx-score"></div>
    </div>
  </section>
  <section id="tab-tk" class="hidden">
    <div id="tk-modes">
      <button id="tk-mode-one" class="on">по одному</button>
      <button id="tk-mode-all">все списком</button>
      <button id="tk-show-ans">показать ответы</button>
    </div>
    <div class="card" id="tk-card">
      <div id="tk-lesson"></div>
      <div id="tk-q" class="hz"></div>
      <div id="tk-opts"></div>
      <div id="tk-why"></div>
      <div class="row"><button class="act primary" id="tk-next">следующее</button></div>
      <div id="tk-score"></div>
    </div>
    <div class="card hidden" id="tk-list"></div>
  </section>
  <section id="tab-ch" class="hidden">
    <div class="ch-top">
      <input id="ch-search" placeholder="поиск по шпаргалке: 了, счётные, даты, 离…">
      <div class="ch-hint">Ищи по-русски, пиньинем без тонов (gongsi) или иероглифом. Нажми на иероглиф, чтобы увидеть чтение и перевод.
        Предложение уроков 1-10 находится по пиньиню, первым буквам слогов (wjyskr) или по-русски своими словами (сегодня я еду в магазин), опечатки прощаются.</div>
    </div>
    <div id="ch-sent"></div>
    <div id="ch-list"></div>
  </section>
  <section id="tab-texts" class="hidden">
    <div class="toggles row">
      <button class="act" id="tg-py">скрыть пиньинь</button>
      <button class="act" id="tg-ru">скрыть перевод</button>
    </div>
    <div id="treader"></div>
  </section>
</main>
<div id="sheet" class="hidden">
  <button id="sheet-close">закрыть</button>
  <div id="sheet-char" class="hz"></div>
  <div id="sheet-py"></div>
  <div id="sheet-parts"></div>
  <div id="sheet-words"></div>
</div>
<nav class="tabbar">
  <button data-tab="fc" class="on"><span class="ico hz">卡</span>Карточки</button>
  <button data-tab="words"><span class="ico hz">词</span>Слова</button>
  <button data-tab="sx"><span class="ico hz">句</span>Фразы</button>
  <button data-tab="tk"><span class="ico hz">练</span>Задания</button>
  <button data-tab="ch"><span class="ico hz">速</span>Шпаргалка</button>
  <button data-tab="texts"><span class="ico hz">文</span>Тексты</button>
</nav>

<script>window.Poisk18Load = function () {
  if (window.Poisk18) return window.Poisk18;

/* Поиск по урокам 1-10 (экзамен по 1-8): запас предложений, вариации, образцы конструктора и сам поиск.
   Собирается из папки poisk (build.py); тот же движок стоит на отдельной странице и в шпаргалке тренажёра. */

"src":"учебник, текст 1","l":4},{"zh":"你看中国地图干什么？你想去各地旅游？","py":"Nǐ kàn Zhōngguó dìtú gàn shénme? Nǐ xiǎng qù gèdì lǚyóu?","ru":"Зачем тебе карта Китая? Хочешь путешествовать по стране?","src":"учебник, текст 1","l":4},{"zh":"是的，我想去各地玩儿。你看，这是北京。","py":"Shìde, wǒ xiǎng qù gèdì wánr. Nǐ kàn, zhè shì Běijīng.","ru":"Да, хочу везде побывать. Смотри, это Пекин.","src":"учебник, текст 1","l":4},{"zh":"我知道。这是上海。这是龙山。","py":"Wǒ zhīdao. Zhè shì Shànghǎi. Zhè shì Lóngshān.","ru":"Знаю. Это Шанхай. А это Луншань.","src":"учебник, текст 1","l":4},{"zh":"龙山？不知道。龙山大不大？","py":"Lóngshān? Bù zhīdao. Lóngshān dà bu dà?","ru":"Луншань? Не знаю такого. Он большой?","src":"учебник, текст 1","l":4},{"zh":"比较小。我家在那儿。","py":"Bǐjiào xiǎo. Wǒ jiā zài nàr.","ru":"Довольно маленький. Там мой дом.","src":"учебник, текст 1","l":4},{"zh":"这个名字真有意思！那儿有龙吗？","py":"Zhège míngzi zhēn yǒu yìsi! Nàr yǒu lóng ma?","ru":"Какое интересное название! Там есть драконы?","src":"учебник, текст 1","l":4},{"zh":"这是什么词典？","py":"Zhè shì shénme cídiǎn?","ru":"Что это за словарь?","src":"учебник, текст 2","l":4},{"zh":"汉俄词典。","py":"Hàn-É cídiǎn.","ru":"Китайско-русский.","src":"учебник, текст 2","l":4},{"zh":"那本呢？","py":"Nà běn ne?","ru":"А тот?","src":"учебник, текст 2","l":4},{"zh":"俄汉词典。","py":"É-Hàn cídiǎn.","ru":"Русско-китайский.","src":"учебник, текст 2","l":4},{"zh":"这本汉俄词典是我的，那本俄汉词典不是我的。","py":"Zhè běn Hàn-É cídiǎn shì wǒ de, nà běn É-Hàn cídiǎn bú shì wǒ de.","ru":"Этот китайско-русский мой, а тот русско-китайский не мой.","src":"учебник, текст 2","l":4},{"zh":"是谁的？","py":"Shì shuí de?","ru":"А чей?","src":"учебник, текст 2","l":4},{"zh":"不知道。我想，这大概是老师的词典。","py":"Bù zhīdao. Wǒ xiǎng, zhè dàgài shì lǎoshī de cídiǎn.","ru":"Не знаю. Думаю, наверное, учителя.","src":"учебник, текст 2","l":4},{"zh":"老师，请问，这本词典是您的吗？","py":"Lǎoshī, qǐng wèn, zhè běn cídiǎn shì nín de ma?","ru":"Учитель, позвольте спросить, этот словарь ваш?","src":"учебник, текст 2","l":4},{"zh":"对，是我的。","py":"Duì, shì wǒ de.","ru":"Верно, мой.","src":"учебник, текст 2","l":4},{"zh":"这本词典怎么样？","py":"Zhè běn cídiǎn zěnmeyàng?","ru":"И как этот словарь?","src":"учебник, текст 2","l":4},{"zh":"当然可以。","py":"Dāngrán kěyǐ.","ru":"Конечно, можно.","src":"учебник, текст 2","l":4},{"zh":"白小红有几张中国地图？","py":"Bái Xiǎohóng yǒu jǐ zhāng Zhōngguó dìtú?","ru":"Сколько карт Китая у Бай Сяохун?","src":"учебник, вопрос к тексту","l":4},{"zh":"安德烈要中文的还是俄文的？","py":"Āndéliè yào Zhōngwén de háishi Éwén de?","ru":"Андрею нужна карта на китайском или на русском?","src":"учебник, вопрос к тексту","l":4},{"zh":"龙山大不大？那儿有没有龙？","py":"Lóngshān dà bu dà? Nàr yǒu méiyǒu lóng?","ru":"Гора Луншань большая? Там есть драконы?","src":"учебник, вопрос к тексту","l":4},{"zh":"那本俄汉词典是谁的？","py":"Nà běn É-Hàn cídiǎn shì shéi de?","ru":"Чей тот русско-китайский словарь?","src":"учебник, вопрос к тексту","l":4},{"zh":"两张，一张中文的，一张俄文的。","py":"Liǎng zhāng, yì zhāng Zhōngwén de, yì zhāng Éwén de.","ru":"Две: одна на китайском, другая на русском.","src":"учебник, ответ к вопросу по тексту","l":4},{"zh":"他要俄文的。","py":"Tā yào Éwén de.","ru":"Ему нужен на русском.","src":"учебник, ответ к вопросу по тексту","l":4},{"zh":"比较小。那儿没有龙，只有山。","py":"Bǐjiào xiǎo. Nàr méiyǒu lóng, zhǐ yǒu shān.","ru":"Довольно маленький. Там нет драконов, есть только горы.","src":"учебник, ответ к вопросу по тексту","l":4},{"zh":"是张老师的。","py":"Shì Zhāng lǎoshī de.","ru":"Это учителя Чжана.","src":"учебник, ответ к вопросу по тексту","l":4},{"zh":"哟，您会说汉语？","py":"Yō, nín huì shuō Hànyǔ?","ru":"О, вы говорите по-китайски?","src":"учебник, текст 1","l":5},{"zh":"我想买一件衬衫。这件白衬衫多少钱？","py":"Wǒ xiǎng mǎi yí jiàn chènshān. Zhè jiàn bái chènshān duōshao qián?","ru":"Я хочу купить рубашку. Сколько стоит эта белая?","src":"учебник, текст 1","l":5},{"zh":"四百二十八块。","py":"Sìbǎi èrshíbā kuài.","ru":"428 юаней.","src":"учебник, текст 1","l":5},{"zh":"太贵了！那件红衬衫呢？","py":"Tài guì le! Nà jiàn hóng chènshān ne?","ru":"Слишком дорого! А та красная?","src":"учебник, текст 1","l":5},{"zh":"一百六十五块。比较便宜，也比较漂亮。","py":"Yìbǎi liùshíwǔ kuài. Bǐjiào piányi, yě bǐjiào piàoliang.","ru":"165 юаней. Подешевле и покрасивее.","src":"учебник, текст 1","l":5},{"zh":"一条裤子。能不能试一试？","py":"Yì tiáo kùzi. Néng bu néng shì yi shì?","ru":"Брюки. Можно примерить?","src":"учебник, текст 1","l":5},{"zh":"当然可以。…怎么样？","py":"Dāngrán kěyǐ. ... Zěnmeyàng?","ru":"Конечно. ... Ну как?","src":"учебник, текст 1","l":5},{"zh":"这条太大。","py":"Zhè tiáo tài dà.","ru":"Эти слишком велики.","src":"учебник, текст 1","l":5},{"zh":"那您试试这条吧，这条不太大。","py":"Nà nín shìshi zhè tiáo ba, zhè tiáo bú tài dà.","ru":"Тогда примерьте эти, они не такие большие.","src":"учебник, текст 1","l":5},{"zh":"请坐。…请喝茶。","py":"Qǐng zuò. ... Qǐng hē chá.","ru":"Садитесь. ... Пейте чай.","src":"учебник, текст 2","l":5},{"zh":"来点儿什么？","py":"Lái diǎnr shénme?","ru":"Что закажете?","src":"учебник, текст 2","l":5},{"zh":"小姐，你们饭店最好吃的菜是什么？","py":"Xiǎojiě, nǐmen fàndiàn zuì hǎochī de cài shì shénme?","ru":"Девушка, какое блюдо у вас самое вкусное?","src":"учебник, текст 2","l":5},{"zh":"糖醋鱼。","py":"Tángcùyú.","ru":"Рыба в кисло-сладком соусе.","src":"учебник, текст 2","l":5},{"zh":"好，来一个糖醋鱼。","py":"Hǎo, lái yí gè tángcùyú.","ru":"Хорошо, несите её.","src":"учебник, текст 2","l":5},{"zh":"我最喜欢吃辣的。你能不能吃辣的？来个酸辣汤。","py":"Wǒ zuì xǐhuan chī là de. Nǐ néng bu néng chī là de? Lái ge suānlàtāng.","ru":"Я больше всего люблю острое. Ты можешь есть острое? Принесите кисло-острый суп.","src":"учебник, текст 2","l":5},{"zh":"我能吃一点儿。","py":"Wǒ néng chī yìdiǎnr.","ru":"Я немного могу.","src":"учебник, текст 2","l":5},{"zh":"好。要不要来个牛肉？","py":"Hǎo. Yào bu yào lái ge niúròu?","ru":"Хорошо. Будете говядину?","src":"учебник, текст 2","l":5},{"zh":"可以。来一个红烧牛肉吧。","py":"Kěyǐ. Lái yí gè hóngshāo niúròu ba.","ru":"Можно. Давайте тушёную говядину.","src":"учебник, текст 2","l":5},{"zh":"还要什么？","py":"Hái yào shénme?","ru":"Что ещё?","src":"учебник, текст 2","l":5},{"zh":"米饭。","py":"Mǐfàn.","ru":"Рис.","src":"учебник, текст 2","l":5},{"zh":"水饺。","py":"Shuǐjiǎo.","ru":"Пельмени.","src":"учебник, текст 2","l":5},{"zh":"好，请等一下。","py":"Hǎo, qǐng děng yíxià.","ru":"Хорошо, подождите немного.","src":"учебник, текст 2","l":5},{"zh":"那件白衬衫多少钱？","py":"Nà jiàn bái chènshān duōshao qián?","ru":"Сколько стоит та белая рубашка?","src":"учебник, вопрос к тексту","l":5},{"zh":"塔拉斯要白衬衫还是红衬衫？为什么？","py":"Tǎlāsī yào bái chènshān háishi hóng chènshān? Wèi shénme?","ru":"Какую рубашку хочет Тарас, белую или красную? Почему?","src":"учебник, вопрос к тексту","l":5},{"zh":"他们饭店最好吃的菜是什么？","py":"Tāmen fàndiàn zuì hǎochī de cài shì shénme?","ru":"Какое блюдо в их ресторане самое вкусное?","src":"учебник, вопрос к тексту","l":5},{"zh":"谁最喜欢吃辣的？","py":"Shuí zuì xǐhuan chī là de?","ru":"Кто больше всех любит острое?","src":"учебник, вопрос к тексту","l":5},{"zh":"他要红衬衫，因为红衬衫比较便宜，也比较漂亮。","py":"Tā yào hóng chènshān, yīnwèi hóng chènshān bǐjiào piányi, yě bǐjiào piàoliang.","ru":"Он хочет красную рубашку, потому что красная подешевле и покрасивее.","src":"учебник, ответ к вопросу по тексту","l":5},{"zh":"安德烈。","py":"Āndéliè.","ru":"Андрей.","src":"учебник, ответ к вопросу по тексту","l":5},{"zh":"明天星期六，我们都不上课。你们打算干什么？","py":"Míngtiān xīngqīliù, wǒmen dōu bú shàng kè. Nǐmen dǎsuàn gàn shénme?","ru":"Завтра суббота, занятий нет. Что вы собираетесь делать?","src":"учебник, текст 1","l":6},{"zh":"白天呢？","py":"Báitiān ne?","ru":"А днём?","src":"учебник, текст 1","l":6},{"zh":"在家里休息。你呢？","py":"Zài jiāli xiūxi. Nǐ ne?","ru":"Дома отдыхаю. А ты?","src":"учебник, текст 1","l":6},{"zh":"好啊。王英，你去不去？","py":"Hǎo a. Wáng Yīng, nǐ qù bu qù?","ru":"Отлично. Ван Ин, а ты?","src":"учебник, текст 1","l":6},{"zh":"不去。我不喜欢打球。我喜欢在家里看电视。","py":"Bú qù. Wǒ bù xǐhuan dǎ qiú. Wǒ xǐhuan zài jiāli kàn diànshì.","ru":"Нет. Я не люблю играть в мяч, я люблю смотреть дома телевизор.","src":"учебник, текст 1","l":6},{"zh":"喂！","py":"Wèi!","ru":"Алло!","src":"учебник, текст 2","l":6},{"zh":"是小红吗？","py":"Shì Xiǎohóng ma?","ru":"Это Сяохун?","src":"учебник, текст 2","l":6},{"zh":"是我，您哪位？","py":"Shì wǒ, nín nǎ wèi?","ru":"Я. А кто говорит?","src":"учебник, текст 2","l":6},{"zh":"我是托马什。","py":"Wǒ shì Tuōmǎshí.","ru":"Это Томаш.","src":"учебник, текст 2","l":6},{"zh":"啊，托马什呀，你好！什么事儿？","py":"Ā, Tuōmǎshí ya, nǐ hǎo! Shénme shìr?","ru":"А, Томаш, привет! Что случилось?","src":"учебник, текст 2","l":6},{"zh":"什么时候？","py":"Shénme shíhou?","ru":"Когда?","src":"учебник, текст 2","l":6},{"zh":"今天晚上。行吗？","py":"Jīntiān wǎnshang. Xíng ma?","ru":"Сегодня вечером. Пойдёт?","src":"учебник, текст 2","l":6},{"zh":"不行，今天晚上我很忙，我要去看一位朋友，还要做功课。对不起！","py":"Bù xíng, jīntiān wǎnshang wǒ hěn máng, wǒ yào qù kàn yí wèi péngyou, hái yào zuò gōngkè. Duìbuqǐ!","ru":"Нет, сегодня вечером я занята: надо навестить друга и сделать уроки. Извини!","src":"учебник, текст 2","l":6},{"zh":"没关系。明天晚上怎么样？","py":"Méi guānxi. Míngtiān wǎnshang zěnmeyàng?","ru":"Ничего. А завтра вечером?","src":"учебник, текст 2","l":6},{"zh":"明天晚上我有空儿。几点钟？","py":"Míngtiān wǎnshang wǒ yǒu kòngr. Jǐ diǎnzhōng?","ru":"Завтра вечером я свободна. Во сколько?","src":"учебник, текст 2","l":6},{"zh":"行。在哪儿见面？","py":"Xíng. Zài nǎr jiànmiàn?","ru":"Идёт. Где встретимся?","src":"учебник, текст 2","l":6},{"zh":"好吧。谢谢！再见！","py":"Hǎo ba. Xièxie! Zàijiàn!","ru":"Хорошо. Спасибо! Пока!","src":"учебник, текст 2","l":6},{"zh":"明天星期几？","py":"Míngtiān xīngqī jǐ?","ru":"Какой завтра день недели?","src":"учебник, вопрос к тексту","l":6},{"zh":"王英明天打算干什么？","py":"Wáng Yīng míngtiān dǎsuàn gàn shénme?","ru":"Что Ван Ин собирается делать завтра?","src":"учебник, вопрос к тексту","l":6},{"zh":"托马什想请白小红干什么？","py":"Tuōmǎshí xiǎng qǐng Bái Xiǎohóng gàn shénme?","ru":"Куда Томаш хочет пригласить Бай Сяохун?","src":"учебник, вопрос к тексту","l":6},{"zh":"白小红今天晚上为什么很忙？","py":"Bái Xiǎohóng jīntiān wǎnshang wèi shénme hěn máng?","ru":"Почему Бай Сяохун сегодня вечером занята?","src":"учебник, вопрос к тексту","l":6},{"zh":"他们几点见面？","py":"Tāmen jǐ diǎn jiànmiàn?","ru":"Во сколько они встречаются?","src":"учебник, вопрос к тексту","l":6},{"zh":"星期六。","py":"Xīngqīliù.","ru":"Суббота.","src":"учебник, ответ к вопросу по тексту","l":6},{"zh":"晚上有一个约会，白天在家里休息。","py":"Wǎnshang yǒu yí ge yuēhuì, báitiān zài jiāli xiūxi.","ru":"Вечером у неё свидание, днём она отдыхает дома.","src":"учебник, ответ к вопросу по тексту","l":6},{"zh":"一起去喝咖啡。","py":"Yìqǐ qù hē kāfēi.","ru":"Вместе сходить выпить кофе.","src":"учебник, ответ к вопросу по тексту","l":6},{"zh":"因为她要去看一位朋友，还要做功课。","py":"Yīnwèi tā yào qù kàn yí wèi péngyou, hái yào zuò gōngkè.","ru":"Потому что она собирается навестить друга, и ещё ей надо делать уроки.","src":"учебник, ответ к вопросу по тексту","l":6},{"zh":"明天晚上八点半。","py":"Míngtiān wǎnshang bā diǎn bàn.","ru":"Завтра в половине девятого вечера.","src":"учебник, ответ к вопросу по тексту","l":6},{"zh":"托马什八点一刻去接她。","py":"Tuōmǎshí bā diǎn yí kè qù jiē tā.","ru":"Томаш заедет за ней в четверть девятого.","src":"учебник, ответ к вопросу по тексту","l":6},{"zh":"要去很多地方吧？","py":"Yào qù hěn duō dìfang ba?","ru":"Наверное, во много мест?","src":"учебник, текст 1","l":7},{"zh":"是啊，上海、四川、云南…","py":"Shì a, Shànghǎi, Sìchuān, Yúnnán...","ru":"Да: Шанхай, Сычуань, Юньнань...","src":"учебник, текст 1","l":7},{"zh":"什么时候去？","py":"Shénme shíhou qù?","ru":"Когда едешь?","src":"учебник, текст 1","l":7},{"zh":"五月中旬或者下旬。","py":"Wǔ yuè zhōngxún huòzhě xiàxún.","ru":"В середине или конце мая.","src":"учебник, текст 1","l":7},{"zh":"什么时候回来？","py":"Shénme shíhou huílai?","ru":"Когда вернёшься?","src":"учебник, текст 1","l":7},{"zh":"不，跟我的女朋友一起去。可是，我们的汉语不太好，我有点儿担心。","py":"Bù, gēn wǒ de nǚpéngyou yìqǐ qù. Kěshì, wǒmen de Hànyǔ bú tài hǎo, wǒ yǒudiǎnr dānxīn.","ru":"Нет, с девушкой. Но наш китайский не очень, я немного беспокоюсь.","src":"учебник, текст 1","l":7},{"zh":"你别担心。我在上海、四川都有朋友，可以请他们帮助你。","py":"Nǐ bié dānxīn. Wǒ zài Shànghǎi, Sìchuān dōu yǒu péngyou, kěyǐ qǐng tāmen bāngzhù nǐ.","ru":"Не беспокойся. У меня в Шанхае и Сычуани есть друзья, попрошу их помочь тебе.","src":"учебник, текст 1","l":7},{"zh":"我找王老师。","py":"Wǒ zhǎo Wáng lǎoshī.","ru":"Мне нужна учитель Ван.","src":"учебник, текст 2","l":7},{"zh":"哪位王老师？我们这儿有两位王老师。","py":"Nǎ wèi Wáng lǎoshī? Wǒmen zhèr yǒu liǎng wèi Wáng lǎoshī.","ru":"Который Ван? У нас их две.","src":"учебник, текст 2","l":7},{"zh":"我不知道她叫什么名字。她是女的。","py":"Wǒ bù zhīdao tā jiào shénme míngzi. Tā shì nǚ de.","ru":"Не знаю, как её зовут. Она женщина.","src":"учебник, текст 2","l":7},{"zh":"她戴一副眼镜。","py":"Tā dài yí fù yǎnjìng.","ru":"Она носит очки.","src":"учебник, текст 2","l":7},{"zh":"在我们这儿，每位老师都戴眼镜。","py":"Zài wǒmen zhèr, měi wèi lǎoshī dōu dài yǎnjìng.","ru":"У нас каждый учитель носит очки.","src":"учебник, текст 2","l":7},{"zh":"她瘦瘦的，高高的，头发长长的，穿一条牛仔裤。","py":"Tā shòushòu de, gāogāo de, tóufa chángcháng de, chuān yì tiáo niúzǎikù.","ru":"Она худенькая, высокая, с длинными волосами, в джинсах.","src":"учебник, текст 2","l":7},{"zh":"哦，你要找王欢老师，她刚出去。","py":"Ò, nǐ yào zhǎo Wáng Huān lǎoshī, tā gāng chūqu.","ru":"А, вам нужна Ван Хуань, она только что вышла.","src":"учебник, текст 2","l":7},{"zh":"她大概什么时候回来？","py":"Tā dàgài shénme shíhou huílai?","ru":"Когда она примерно вернётся?","src":"учебник, текст 2","l":7},{"zh":"不知道。你过一会儿再来看看吧。","py":"Bù zhīdao. Nǐ guò yíhuìr zài lái kànkan ba.","ru":"Не знаю. Зайдите ещё раз попозже.","src":"учебник, текст 2","l":7},{"zh":"安德烈打算什么时候去中国旅行？","py":"Āndéliè dǎsuàn shénme shíhou qù Zhōngguó lǚxíng?","ru":"Когда Андрей собирается поехать путешествовать по Китаю?","src":"учебник, вопрос к тексту","l":7},{"zh":"他跟谁一起去？","py":"Tā gēn shuí yìqǐ qù?","ru":"С кем он поедет?","src":"учебник, вопрос к тексту","l":7},{"zh":"他为什么有点儿担心？","py":"Tā wèi shénme yǒudiǎnr dānxīn?","ru":"Почему он немного волнуется?","src":"учебник, вопрос к тексту","l":7},{"zh":"王欢老师是什么样的人？","py":"Wáng Huān lǎoshī shì shénmeyàng de rén?","ru":"Какая она, учитель Ван Хуань?","src":"учебник, вопрос к тексту","l":7},{"zh":"五月中旬或者下旬去。","py":"Wǔ yuè zhōngxún huòzhě xiàxún qù.","ru":"В середине или в конце мая.","src":"учебник, ответ к вопросу по тексту","l":7},{"zh":"跟他的女朋友一起去。","py":"Gēn tā de nǚpéngyou yìqǐ qù.","ru":"Поедет вместе со своей девушкой.","src":"учебник, ответ к вопросу по тексту","l":7},{"zh":"因为他们的汉语不太好。","py":"Yīnwèi tāmen de Hànyǔ bú tài hǎo.","ru":"Потому что их китайский не очень хорош.","src":"учебник, ответ к вопросу по тексту","l":7},{"zh":"她瘦瘦的，高高的，头发长长的，戴一副眼镜，穿一条牛仔裤。","py":"Tā shòushòu de, gāogāo de, tóufa chángcháng de, dài yí fù yǎnjìng, chuān yì tiáo niúzǎikù.","ru":"Она худенькая, высокая, с длинными волосами, носит очки и джинсы.","src":"учебник, ответ к вопросу по тексту","l":7},{"zh":"有。附近有一个中国银行。","py":"Yǒu. Fùjìn yǒu yí gè Zhōngguó Yínháng.","ru":"Есть, недалеко Банк Китая.","src":"учебник, текст 1","l":8},{"zh":"不太远。","py":"Bú tài yuǎn.","ru":"Не очень.","src":"учебник, текст 1","l":8},{"zh":"怎么走？","py":"Zěnme zǒu?","ru":"Как пройти?","src":"учебник, текст 1","l":8},{"zh":"往前走一点儿，往右拐，过两条马路，就是中国银行。","py":"Wǎng qián zǒu yìdiǎnr, wǎng yòu guǎi, guò liǎng tiáo mǎlù, jiù shì Zhōngguó Yínháng.","ru":"Пройдите немного вперёд, поверните направо, перейдите две улицы, и вот Банк Китая.","src":"учебник, текст 1","l":8},{"zh":"附近有没有邮局？","py":"Fùjìn yǒu méiyǒu yóujú?","ru":"А почта поблизости есть?","src":"учебник, текст 1","l":8},{"zh":"有。邮局就在那个银行的旁边。","py":"Yǒu. Yóujú jiù zài nàge yínháng de pángbiān.","ru":"Есть, почта прямо рядом с тем банком.","src":"учебник, текст 1","l":8},{"zh":"谢谢您！","py":"Xièxie nín!","ru":"Спасибо!","src":"учебник, текст 1","l":8},{"zh":"不客气。","py":"Bú kèqi.","ru":"Не за что.","src":"учебник, текст 1","l":8},{"zh":"你知道怎么走吗？","py":"Nǐ zhīdao zěnme zǒu ma?","ru":"Ты знаешь, как ехать?","src":"учебник, текст 2","l":8},{"zh":"不知道。","py":"Bù zhīdao.","ru":"Нет.","src":"учебник, текст 2","l":8},{"zh":"我们问一下吧。同学，请问从这儿到市中心怎么走？","py":"Wǒmen wèn yíxià ba. Tóngxué, qǐngwèn cóng zhèr dào shì zhōngxīn zěnme zǒu?","ru":"Давай спросим. Приятель, как отсюда добраться до центра?","src":"учебник, текст 2","l":8},{"zh":"你在学校门口坐139路公共汽车，坐五站，然后换地铁，坐两站，从地铁站出来，就是市中心。","py":"Nǐ zài xuéxiào ménkǒu zuò yāo-sān-jiǔ lù gōnggòng qìchē, zuò wǔ zhàn, ránhòu huàn dìtiě, zuò liǎng zhàn, cóng dìtiě zhàn chūlai, jiù shì shì zhōngxīn.","ru":"У входа в университет садитесь на автобус 139, едете пять остановок, потом пересаживаетесь на метро, две станции, выходите, и вот центр.","src":"учебник, текст 2","l":8},{"zh":"不远。你下车以后往右拐，过马路，就是地铁站。","py":"Bù yuǎn. Nǐ xià chē yǐhòu wǎng yòu guǎi, guò mǎlù, jiù shì dìtiě zhàn.","ru":"Недалеко. Выйдете, повернёте направо, перейдёте дорогу, и вот станция.","src":"учебник, текст 2","l":8},{"zh":"不行，太远了！","py":"Bù xíng, tài yuǎn le!","ru":"Нет, слишком далеко!","src":"учебник, текст 2","l":8},{"zh":"附近有没有银行？怎么走？","py":"Fùjìn yǒu méiyǒu yínháng? Zěnme zǒu?","ru":"Есть поблизости банк? Как пройти?","src":"учебник, вопрос к тексту","l":8},{"zh":"邮局在哪儿？","py":"Yóujú zài nǎr?","ru":"Где почта?","src":"учебник, вопрос к тексту","l":8},{"zh":"从学校到市中心怎么走？","py":"Cóng xuéxiào dào shì zhōngxīn zěnme zǒu?","ru":"Как добраться от университета до центра города?","src":"учебник, вопрос к тексту","l":8},{"zh":"为什么不能骑自行车去市中心？","py":"Wèi shénme bù néng qí zìxíngchē qù shì zhōngxīn?","ru":"Почему нельзя поехать в центр города на велосипеде?","src":"учебник, вопрос к тексту","l":8},{"zh":"有。往前走一点儿，往右拐，过两条马路就是。","py":"Yǒu. Wǎng qián zǒu yìdiǎnr, wǎng yòu guǎi, guò liǎng tiáo mǎlù jiù shì.","ru":"Есть. Пройдите немного вперёд, поверните направо, перейдите две улицы, и вот она.","src":"учебник, ответ к вопросу по тексту","l":8},{"zh":"在学校门口坐139路公共汽车，坐五站，然后换地铁，坐两站。","py":"Zài xuéxiào ménkǒu zuò yāo-sān-jiǔ lù gōnggòng qìchē, zuò wǔ zhàn, ránhòu huàn dìtiě, zuò liǎng zhàn.","ru":"У входа в университет сесть на автобус 139, проехать пять остановок, потом пересесть на метро и проехать две станции.","src":"учебник, ответ к вопросу по тексту","l":8},{"zh":"因为太远了。","py":"Yīnwèi tài yuǎn le.","ru":"Потому что слишком далеко.","src":"учебник, ответ к вопросу по тексту","l":8},{"zh":"是啊。我以前养过花儿，养过鸟儿，但是不喜欢养狗。","py":"Shì a. Wǒ yǐqián yǎngguo huār, yǎngguo niǎor, dànshì bù xǐhuan yǎng gǒu.","ru":"Да. Я раньше выращивал цветы, держал птичек, но собак держать не любил.","src":"учебник, текст 1","l":9},{"zh":"来这儿以后，这儿的人都喜欢养狗，我也养狗了。","py":"Lái zhèr yǐhòu, zhèr de rén dōu xǐhuan yǎng gǒu, wǒ yě yǎng gǒu le.","ru":"После переезда сюда, здесь все любят собак, вот и я завёл.","src":"учебник, текст 1","l":9},{"zh":"以前不行，现在可以了。有的人喜欢养狗，有的人喜欢养猫，","py":"Yǐqián bù xíng, xiànzài kěyǐ le. Yǒude rén xǐhuan yǎng gǒu, yǒude rén xǐhuan yǎng māo,","ru":"Раньше было нельзя, теперь можно. Одни любят собак, другие кошек,","src":"учебник, текст 1","l":9},{"zh":"有的人喜欢养鸟儿，还有的人喜欢养鱼…你也喜欢养小动物？","py":"yǒude rén xǐhuan yǎng niǎor, hái yǒude rén xǐhuan yǎng yú... Nǐ yě xǐhuan yǎng xiǎo dòngwù?","ru":"третьи птичек, а кто-то рыбок... Ты тоже любишь держать животных?","src":"учебник, текст 1","l":9},{"zh":"为什么？是不是太麻烦？","py":"Wèi shénme? Shì bu shì tài máfan?","ru":"Почему? Слишком хлопотно?","src":"учебник, текст 1","l":9},{"zh":"不是。因为我没有时间，也没有钱。我只能养我自己。","py":"Bú shì. Yīnwèi wǒ méiyǒu shíjiān, yě méiyǒu qián. Wǒ zhǐ néng yǎng wǒ zìjǐ.","ru":"Нет. У меня нет ни времени, ни денег. Я могу прокормить только себя.","src":"учебник, текст 1","l":9},{"zh":"对啊。公司让我去上海办点儿事儿。","py":"Duì a. Gōngsī ràng wǒ qù Shànghǎi bàn diǎnr shìr.","ru":"Да, компания посылает уладить дела.","src":"учебник, текст 2","l":9},{"zh":"什么时候走？","py":"Shénme shíhou zǒu?","ru":"Когда едешь?","src":"учебник, текст 2","l":9},{"zh":"下星期三。","py":"Xià xīngqīsān.","ru":"В следующую среду.","src":"учебник, текст 2","l":9},{"zh":"当然。你看这些照片。这是故宫，这是颐和园…","py":"Dāngrán. Nǐ kàn zhèxiē zhàopiàn. Zhè shì Gùgōng, zhè shì Yíhéyuán...","ru":"Конечно. Посмотри эти фотографии. Это Гугун, это Ихэюань...","src":"учебник, текст 2","l":9},{"zh":"“不到长城非好汉”，我怎么能不登长城呢？","py":"\"Bú dào Chángchéng fēi hǎohàn\", wǒ zěnme néng bù dēng Chángchéng ne?","ru":"«Кто не был на Великой стене, тот не молодец», как я мог не подняться?","src":"учебник, текст 2","l":9},{"zh":"上海、西安、成都…我都去过。可是，有一个地方我还没去过。","py":"Shànghǎi, Xī'ān, Chéngdū... wǒ dōu qùguo. K  1","l":10},{"zh":"没有啊。","py":"Méiyǒu a.","ru":"Да нет.","src":"учебник, текст 2","l":10},{"zh":"今天早上吃了什么？","py":"Jīntiān zǎoshang chīle shénme?","ru":"Что вы ели сегодня утром?","src":"учебник, текст 2","l":10},{"zh":"吃了几片面包，喝了一杯牛奶。…不过，昨天晚上朋友请客，","py":"Chīle jǐ piàn miànbāo, hēle yì bēi niúnǎi. ... Búguò, zuótiān wǎnshang péngyou qǐng kè,","ru":"Съела несколько кусочков хлеба, выпила стакан молока. ...Правда, вчера друг угощал,","src":"учебник, текст 2","l":10},{"zh":"我们去了学校附近的一个饭店，我吃了很多生鱼片。","py":"wǒmen qùle xuéxiào fùjìn de yí ge fàndiàn, wǒ chīle hěn duō shēng yúpiàn.","ru":"мы пошли в ресторан рядом с университетом, и я съела много сашими.","src":"учебник, текст 2","l":10},{"zh":"可能生鱼片不太新鲜。你得吃药，还得…","py":"Kěnéng shēng yúpiàn bú tài xīnxiān. Nǐ děi chī yào, hái děi...","ru":"Возможно, рыба была несвежая. Вам нужно принимать лекарство, и ещё...","src":"учебник, текст 2","l":10},{"zh":"对不起…","py":"Duìbuqǐ...","ru":"Извините...","src":"учебник, текст 2","l":10},{"zh":"别着急，我还没说完呢。你得吃药，还得…","py":"Bié zháojí, wǒ hái méi shuō-wán ne. Nǐ děi chī yào, hái děi...","ru":"Не спешите, я ещё не договорил. Вам нужно принимать лекарство, и ещё...","src":"учебник, текст 2","l":10},{"zh":"王英为什么没来上课？","py":"Wáng Yīng wèi shénme méi lái shàng kè?","ru":"Почему Ван Ин не пришла на занятие?","src":"учебник, вопрос к тексту","l":10},{"zh":"她住在哪儿？每天在哪儿吃早饭？","py":"Tā zhù zài nǎr? Měi tiān zài nǎr chī zǎofàn?","ru":"Где она живёт? Где она каждый день завтракает?","src":"учебник, вопрос к тексту","l":10},{"zh":"王英今天早上吃了什么？","py":"Wáng Yīng jīntiān zǎoshang chīle shénme?","ru":"Что Ван Ин ела сегодня утром?","src":"учебник, вопрос к тексту","l":10},{"zh":"医生说，她为什么肚子疼？","py":"Yīshēng shuō, tā wèi shénme dùzi téng?","ru":"Почему, по словам врача, у неё болит живот?","src":"учебник, вопрос к тексту","l":10},{"zh":"医生让她做什么？","py":"Yīshēng ràng tā zuò shénme?","ru":"Что врач велел ей делать?","src":"учебник, вопрос к тексту","l":10},{"zh":"因为她有点儿不舒服，去医院了。","py":"Yīnwèi tā yǒudiǎnr bù shūfu, qù . А ваша?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "白小红: 我姓白。"}, {"t": "pr", "p": "Wǒ xìng Bái.", "r": "Моя фамилия Бай."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "王英: 您是俄罗斯人吗?"}, {"t": "pr", "p": "Nín shì Éluósīrén ma?", "r": "Вы россиянка?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "白小红: 不，我不是俄罗斯人，我是中国人。您是不是俄罗斯人?"}, {"t": "r", "x": "Bù, wǒ bú shì Éluósīrén, wǒ shì Zhōngguórén. Nín shì bu shì Éluósīrén?"}, {"t": "r", "x": "Нет, я не россиянка, я китаянка. А вы россиянка?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "王英: 我是俄罗斯人。"}, {"t": "pr", "p": "Wǒ shì Éluósīrén.", "r": "Я россиянка."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Разбор:** 您贵姓 без 吗 (это уже вопрос). Отрицание 不 перед 是. Вопрос двумя способами: …吗? и 是不是."}, {"t": "sp", "x": ""}]}, {"l": 1, "title": "Урок 1. Текст 2 (в аудитории)", "rows": [{"t": "sp", "x": ""}, {"t": "zh", "x": "张老师: 同学们好!"}, {"t": "pr", "p": "Tóngxuémen hǎo!", "r": "Здравствуйте, товарищи!"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "同学们: 老师好!"}, {"t": "pr", "p": "Lǎoshī hǎo!", "r": "Здравствуйте, учитель!"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "王英: 您是不是林老师?"}, {"t": "pr", "p": "Nín shì bu shì Lín lǎoshī?", "r": "Вы учитель Линь?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "张老师: 我不是林老师，我是张老师。我姓张，叫张林。你叫什么名字?"}, {"t": "r", "x": "Wǒ bú shì Lín lǎoshī, wǒ shì Zhāng lǎoshī. Wǒ xìng Zhāng, jiào Zhāng Lín. Nǐ jiào shénme míngzi?"}, {"t": "r", "x": "Я не учитель Линь, я учитель Чжан. Моя фамилия Чжан, зовут Чжан Линь. Как тебя зовут?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "王英: 我叫王英。"}, {"t": "pr", "p": "Wǒ jiào Wáng Yīng.", "r": "Меня зовут Ван Ин."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "张老师: 你是哪国人?"}, {"t": "pr", "p": "Nǐ shì nǎ guó rén?", "r": "Ты из какой страны?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "王英: 我是俄罗斯人。"}, {"t": "pr", "p": "Wǒ shì Éluósīrén.", "r": "Я из России."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "张老师: 你呢?"}, {"t": "pr", "p": "Nǐ ne?", "r": "А ты?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 我叫安德烈，也是俄罗斯人。"}, {"t": "pr", "p": "Wǒ jiào Āndéliè, yě shì Éluósīrén.", "r": "Меня зовут Андрей, я тоже из России."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "张老师: 你也是俄罗斯人吗?"}, {"t": "pr", "p": "Nǐ yě shì Éluósīrén ma?", "r": "Ты тоже россиянин?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "托马什: 不，我不是俄罗斯人。我是波兰人。"}, {"t": "pr", "p": "Bù, wǒ bú shì Éluósīrén. Wǒ shì Bōlánrén.", "r": "Нет, я не россиянин. Я поляк."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "张老师: 你说俄语还是说英语?"}, {"t": "pr", "p": "Nǐ shuō Éyǔ háishi shuō Yīngyǔ?", "r": "Ты говоришь по-русски или по-английски?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "托马什: 我说俄语。我们都说俄语。张老师，您说不说俄语?"}, {"t": "r", "x": "Wǒ shuō Éyǔ. Wǒmen dōu shuō Éyǔ. Zhāng lǎoshī, nín shuō bu shuō Éyǔ?"}, {"t": "r", "x": "Я говорю по-русски. Мы все говорим по-русски. Учитель Чжан, вы говорите по-русски?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "张老师: 我不说俄语。我只说汉语。"}, {"t": "pr", "p": "Wǒ bù shuō Éyǔ. Wǒ zhǐ shuō Hànyǔ.", "r": "Я не говорю по-русски. Я говорю только по-китайски."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Разбор:** обращение «фамилия + 老师». 也 и 都 и 只 всегда перед глаголом. Выбор через 还是. В 是不是-вопросе нельзя 也/都/只."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Вопросы к текстам урока 1 (ответь письменно):"}, {"t": "zh", "x": "1. 白小红是哪国人?"}, {"t": "zh", "x": "2. 张老师姓什么，叫什么名字?"}, {"t": "zh", "x": "3. 托马什是不是俄罗斯人?"}, {"t": "zh", "x": "4. 张老师说什么语?"}, {"t": "zh", "x": "Ответы: 1. 她是中国人。 2. 他姓张，叫张林。 3. 不是，他是波兰人。 4. 他只说汉语。"}, {"t": "sp", "x": ""}]}, {"l": 2, "title": "Урок 2. Текст 1 (в самолёте)", "rows": [{"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: 你好! 我叫塔拉斯。"}, {"t": "pr", "p": "Nǐ hǎo! Wǒ jiào Tǎlāsī.", "r": "Привет! Меня зовут Тарас."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "白小红: 你好! 我叫白小红。"}, {"t": "pr", "p": "Nǐ hǎo! Wǒ jiào Bái Xiǎohóng.", "r": "Здравствуйте! Меня зовут Бай Сяохун."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: 认识你很高兴!"}, {"t": "pr", "p": "Rènshi nǐ hěn gāoxìng!", "r": "Очень рад с вами познакомиться."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "白小红: 认识你我也很高兴!"}, {"t": "pr", "p": "Rènshi nǐ wǒ yě hěn gāoxìng!", "r": "И я рада с вами познакомиться."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: 我在进出口公司工作，你呢?"}, {"t": "pr", "p": "Wǒ zài jìnchūkǒu gōngsī gōngzuò, nǐ ne?", "r": "Я работаю в импортно-экспортной компании. А вы?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "白小红: 我在北京语言大学汉语学院汉语系学习。"}, {"t": "r", "x": "Wǒ zài Běijīng Yǔyán Dàxué Hànyǔ Xuéyuàn Hànyǔxì xuéxí."}, {"t": "r", "x": "Я учусь в Пекинском университете языков, в Институте китайского языка, на факультете китайского языка."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: 可以给你打电话吗?"}, {"t": "pr", "p": "Kěyǐ gěi nǐ dǎ diànhuà ma?", "r": "Могу ли я вам позвонить?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "白小红: 可以。我的电话号码是 215 70 988。"}, {"t": "pr", "p": "Kěyǐ. Wǒ de diànhuà hàomǎ shì èr yāo wǔ qī líng jiǔ bā bā.", "r": "Пожалуйста. Мой номер: 21570988."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: 可(以)不可以给你发电子邮件?"}, {"t": "pr", "p": "Kě(yǐ) bu kěyǐ gěi nǐ fā diànzǐ yóujiàn?", "r": "А письмо по электронной почте могу послать?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "白小红: 可以，你也可以给我发电子邮件。"}, {"t": "pr", "p": "Kěyǐ, nǐ yě kěyǐ gěi wǒ fā diànzǐ yóujiàn.", "r": "Да, можете и по почте писать."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Разбор:** 在 + место перед глаголом. Цепочка мест от большого к малому (университет → институт → факультет). 给 + кому + глагол. В номерах 1 читается yāo."}, {"t": "sp", "x": ""}]}, {"l": 2, "title": "Урок 2. Текст 2 (в гостях)", "rows": [{"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 这是我的女朋友，张园园。"}, {"t": "pr", "p": "Zhè shì wǒ de nǚ péngyou, Zhāng Yuányuan.", "r": "Это моя подруга, Чжан Юаньюань."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "丁汉生: 你好! 请进!"}, {"t": "pr", "p": "Nǐ hǎo! Qǐng jìn!", "r": "Здравствуйте! Проходите!"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "张园园: 谢谢。"}, {"t": "pr", "p": "Xièxie.", "r": "Спасибо."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "丁汉生: 请坐!"}, {"t": "pr", "p": "Qǐng zuò!", "r": "Присаживай ", "r": "Можно. Тебе на китайском или на русском?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 俄文的。"}, {"t": "pr", "p": "Éwén de.", "r": "На русском."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "白小红: 给。这张地图是俄文的。"}, {"t": "pr", "p": "Gěi. Zhè zhāng dìtú shì Éwén de.", "r": "Держи. Эта карта на русском."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 谢谢!"}, {"t": "pr", "p": "Xièxie!", "r": "Спасибо!"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "白小红: 你看中国地图干什么? 你想去各地旅游?"}, {"t": "r", "x": "Nǐ kàn Zhōngguó dìtú gàn shénme? Nǐ xiǎng qù gèdì lǚyóu?"}, {"t": "r", "x": "Зачем тебе карта Китая? Хочешь путешествовать по стране?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 是的，我想去各地玩儿。你看，这是北京。"}, {"t": "pr", "p": "Shìde, wǒ xiǎng qù gèdì wánr. Nǐ kàn, zhè shì Běijīng.", "r": "Да, хочу везде побывать. Смотри, это Пекин."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "白小红: 我知道。这是上海。这是龙山。"}, {"t": "pr", "p": "Wǒ zhīdao. Zhè shì Shànghǎi. Zhè shì Lóngshān.", "r": "Знаю. Это Шанхай. А это Луншань."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 龙山? 不知道。龙山大不大?"}, {"t": "pr", "p": "Lóngshān? Bù zhīdao. Lóngshān dà bu dà?", "r": "Луншань? Не знаю такого. Он большой?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "白小红: 比较小。我家在那儿。"}, {"t": "pr", "p": "Bǐjiào xiǎo. Wǒ jiā zài nàr.", "r": "Довольно маленький. Там мой дом."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 这个名字真有意思! 那儿有龙吗?"}, {"t": "pr", "p": "Zhège míngzi zhēn yǒu yìsi! Nàr yǒu lóng ma?", "r": "Какое интересное название! Там есть драконы?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "白小红: 那儿没有龙，只有山。"}, {"t": "pr", "p": "Nàr méiyǒu lóng, zhǐ yǒu shān.", "r": "Драконов нет, только горы."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Разбор:** 有没有 вопрос. Счётное слово 张. 的-обороты без существительного: 中文的, 俄文的. 看一下 вежливая просьба. 给 «держи». 真 + прилагательное восклицание. 比较 «довольно»."}, {"t": "sp", "x": ""}]}, {"l": 4, "title": "Урок 4. Текст 2 (чей словарь?)", "rows": [{"t": "sp", "x": ""}, {"t": "zh", "x": "托马什: 这是什么词典?"}, {"t": "pr", "p": "Zhè shì shénme cídiǎn?", "r": "Что это за словарь?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 汉俄词典。"}, {"t": "pr", "p": "Hàn-É cídiǎn.", "r": "Китайско-русский."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "托马什: 那本呢?"}, {"t": "pr", "p": "Nà běn ne?", "r": "А тот?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 俄汉词典。"}, {"t": "pr", "p": "É-Hàn cídiǎn.", "r": "Русско-китайский."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "托马什: 这两本词典都是你的吗?"}, {"t": "pr", "p": "Zhè liǎng běn cídiǎn dōu shì nǐ de ma?", "r": "Оба словаря твои?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 这本汉俄词典是我的，那本俄汉词典不是我的。"}, {"t": "r", "x": "Zhè běn Hàn-É cídiǎn shì wǒ de, nà běn É-Hàn cídiǎn bú shì wǒ de."}, {"t": "r", "x": "Этот китайско-русский мой, а тот русско-китайский не мой."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "托马什: 是谁的?"}, {"t": "pr", "p": "Shì shuí de?", "r": "А чей?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 不知道。我想，这大概是老师的词典。"}, {"t": "pr", "p": "Bù zhīdao. Wǒ xiǎng, zhè dàgài shì lǎoshī de cídiǎn.", "r": "Не знаю. Думаю, наверное, учителя."}, {"t": "sp", "x": ""}, {"t": "r", "x": "(входит учитель Чжан)"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "托马什: 老师，请问，这本词典是您的吗?"}, {"t": "pr", "p": "Lǎoshī, qǐng wèn, zhè běn cídiǎn shì nín de ma?", "r": "Учитель, позвольте спросить, этот словарь ваш?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "张老师: 对，是我的。"}, {"t": "pr", "p": "Duì, shì wǒ de.", "r": "Верно, мой."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "托马什: 这本词典怎么样?"}, {"t": "pr", "p": "Zhè běn cídiǎn zěnmeyàng?", "r": "И как этот словарь?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "张老师: 这本词典非常好，非常有用。"}, {"t": "pr", "p": "Zhè běn cídiǎn fēicháng hǎo, fēicháng yǒuyòng.", "r": "Очень хороший, очень полезный."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "托马什: 我能不能用一下?"}, {"t": "pr", "p": "Wǒ néng bu néng yòng yíxià?", "r": "Можно мне им попользоваться?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "张老师: 当然可以。"}, {"t": "pr", "p": "Dāngrán kěyǐ.", "r": "Конечно, можно."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Разбор:** 这/那 + 本 + сущ. 都 перед 是. 的-принадлежность: 是谁的? 是我的。 Вежливое 请问. 能不能 + глагол + 一下; ответ 当然可以."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Вопросы к текстам урока 4:"}, {"t": "zh", "x": "1. 白小红有几张中国地图?"}, {"t": "zh", "x": "2. 安德烈要中文的还是俄文的?"}, {"t": "zh", "x": "3. 龙山大不大? 那儿有没有龙?"}, {"t": "zh", "x": "4. 那本俄汉词典是谁的?"}, {"t": "zh", "x": "Ответы: 1. 两张，一张中文的，一张俄文的。 2. 他要俄文的。 3. 比较小。那儿没有龙，只有山。 4. 是（张）老师的。"}]}, {"l": 11, "title": "Урок 11. Тексты (читать по учебнику, с. 105-106)", "rows": [{"t": "sp", "x": ""}, {"t": "b", "x": "Здесь нет самих диалогов:** читай их в учебнике на с. 105 и 106. Ниже коротко, о чём они, и на что смотреть."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Текст 1.** Утро. Студент просит на время новую карту и рассказывает, что после завтрака ведёт родителей в исторический музей. Родители приехали на прошлой неделе: были в Гонконге, потом в Пекине, оттуда ехали поездом. В Китае они шестой раз и интересуются экономикой и культурой."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Текст 2.** После занятий. Студент несёт в библиотеку книгу о делах с китайцами. Собеседница просит дать почитать, но срок почти вышел, а за просрочку штраф юань в день."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Разбор:** ищи в текстах 是 … 的 (когда приехали, на чём, откуда), оборот с 的 перед словом (карта, купленная вчера; книга, написанная американцем), 第六次, 快一个月了, 对 … 感兴趣."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Вопросы к уроку 11:"}, {"t": "zh", "x": "1. 他们是什么时候来的?"}, {"t": "zh", "x": "2. 他们是怎么来的?"}, {"t": "zh", "x": "3. 那本书是什么时候借的?"}, {"t": "zh", "x": "Ответы ищи в текстах: это три вопроса на 是 … 的."}]}, {"l": 5, "title": "Урок 5. Текст 1 (в магазине)", "rows": [{"t": "sp", "x": ""}, {"t": "zh", "x": "小姐: 哟，您会说汉语?"}, {"t": "pr", "p": "Yō, nín huì shuō Hànyǔ?", "r": "О, вы говорите по-китайски?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: 我会说一点儿。"}, {"t": "pr", "p": "Wǒ huì shuō yìdiǎnr.", "r": "Я немного говорю."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "小姐: 先生想买什么?"}, {"t": "pr", "p": "Xiānsheng xiǎng mǎi shénme?", "r": "Что господин хочет купить?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: 我想买一件衬衫。这件白衬衫多少钱?"}, {"t": "r", "x": "Wǒ xiǎng mǎi yí jiàn chènshān. Zhè jiàn bái chènshān duōshao qián?"}, {"t": "r", "x": "Я хочу купить рубашку. Сколько стоит эта белая?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "小姐: 四百二十八块。"}, {"t": "pr", "p": "Sìbǎi èrshíbā kuài. 428", "r": "юаней."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: 太贵了! 那件红衬衫呢?"}, {"t": "pr", "p": "Tài guì le! Nà jiàn hóng chènshān ne?", "r": "Слишком дорого! А та красная?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "小姐: 一百六十五块。比较便宜，也比较漂亮。"}, {"t": "pr", "p": "Yìbǎi liùshíwǔ kuài. Bǐjiào piányi, yě bǐjiào piàoliang. 165", "r": "юаней. Подешевле и покрасивее."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: 好，我要那一件。"}, {"t": "pr", "p": "Hǎo, wǒ yào nà yí jiàn.", "r": "Хорошо, мне ту."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "小姐: 您还要买什么?"}, {"t": "pr", "p": "Nín hái yào mǎi shénme?", "r": "Что ещё хотите купить?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: 一条裤子。能不能试一试?"}, {"t": "pr", "p": "Yì tiáo kùzi. Néng bu néng shì yi shì?", "r": "Брюки. Можно примерить?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "小姐: 当然可以。…… 怎么样?"}, {"t": "pr", "p": "Dāngrán kěyǐ. ... Zěnmeyàng?", "r": "Конечно. ... Ну как?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: 这条太大。"}, {"t": "pr", "p": "Zhè tiáo tài dà.", "r": "Эти слишком велики."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "小姐: 那您试试这条吧，这条不太大。"}, {"t": "pr", "p": "Nà nín shìshi zhè tiáo ba, zhè tiáo bú tài dà.", "r": "Тогда примерьте эти, они не такие большие."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Разбор:** 会 умение («выучился»), 能 возможность. 太…了 «слишком». Деньги: 块 (разг.) = 元; 四百二十八块. Счётные слова: 件 (рубашки), 条 (брюки). Удвоение глагола 试一试 = 试试 = 试一下 «попробовать разок». 吧 мягкое предложение."}, {"t": "sp", "x": ""}]}, {"l": 5, "title": "Урок 5. Текст 2 (в ресторане)", "rows": [{"t": "sp", "x": ""}, {"t": "zh", ите». 最 + прилагательное: превосходная степень (最好吃的菜). 辣的 «острое» (的-оборот). 能 про способность переносить. 瓶 счётное слово для бутылок."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Вопросы к урокам 5:"}, {"t": "zh", "x": "1. 那件白衬衫多少钱?"}, {"t": "zh", "x": "2. 塔拉斯要白衬衫还是红衬衫? 为什么?"}, {"t": "zh", "x": "3. 他们饭店最好吃的菜是什么?"}, {"t": "zh", "x": "4. 谁最喜欢吃辣的?"}, {"t": "zh", "x": "Ответы: 1. 四百二十八块。 2. 他要红衬衫，因为红衬衫比较便宜，也比较漂亮。 3. 糖醋鱼。 4. 安德烈。"}, {"t": "sp", "x": ""}]}, {"l": 6, "title": "Урок 6. Текст 1 (планы на выходные)", "rows": [{"t": "sp", "x": ""}, {"t": "zh", "x": "白小红: 明天星期六，我们都不上课。你们打算干什么?"}, {"t": "r", "x": "Míngtiān xīngqīliù, wǒmen dōu bú shàng kè. Nǐmen dǎsuàn gàn shénme?"}, {"t": "r", "x": "Завтра суббота, занятий нет. Что вы собираетесь делать?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 我明天要去打工。"}, {"t": "pr", "p": "Wǒ míngtiān yào qù dǎgōng.", "r": "Я завтра пойду подрабатывать."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "王英: 我明天晚上有一个约会。"}, {"t": "pr", "p": "Wǒ míngtiān wǎnshang yǒu yí gè yuēhuì.", "r": "У меня завтра вечером встреча."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "白小红: 白天呢?"}, {"t": "pr", "p": "Báitiān ne?", "r": "А днём?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "王英: 在家里休息。你呢?"}, {"t": "pr", "p": "Zài jiāli xiūxi. Nǐ ne?", "r": "Дома отдыхаю. А ты?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "白小红: 我想去打球，你们去不去?"}, {"t": "pr", "p": "Wǒ xiǎng qù dǎ qiú, nǐmen qù bu qù?", "r": "Я хочу пойти поиграть в мяч, вы идёте?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "托马什: 我跟你一起去。"}, {"t": "pr", "p": "Wǒ gēn nǐ yìqǐ qù.", "r": "Я пойду с тобой."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "白小红: 好啊。王英，你去不去?"}, {"t": "pr", "p": "Hǎo a. Wáng Yīng, nǐ qù bu qù?", "r": "Отлично. Ван Ин, а ты?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "王英: 不去。我不喜欢打球。我喜欢在家里看电视。"}, {"t": "r", "x": "Bú qù. Wǒ bù xǐhuan dǎ qiú. Wǒ xǐhuan zài jiāli kàn diànshì."}, {"t": "r", "x": "Нет. Я не люблю играть в мяч, я люблю смотреть дома телевизор."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Разбор:** ", "x": "丁汉生: 什么时候去?"}, {"t": "pr", "p": "Shénme shíhou qù?", "r": "Когда едешь?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 五月中旬或者下旬。"}, {"t": "pr", "p": "Wǔ yuè zhōngxún huòzhě xiàxún.", "r": "В середине или конце мая."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "丁汉生: 什么时候回来?"}, {"t": "pr", "p": "Shénme shíhou huílai?", "r": "Когда вернёшься?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 我打算七月一号以前回来。"}, {"t": "pr", "p": "Wǒ dǎsuàn qī yuè yī hào yǐqián huílai.", "r": "Собираюсь вернуться до 1 июля."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "丁汉生: 你一个人去吗?"}, {"t": "pr", "p": "Nǐ yí gè rén qù ma?", "r": "Едешь один?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 不，跟我的女朋友一起去。可是，我们的汉语不太好，我有点儿担心。"}, {"t": "r", "x": "Bù, gēn wǒ de nǚpéngyou yìqǐ qù. Kěshì, wǒmen de Hànyǔ bú tài hǎo, wǒ yǒudiǎnr dānxīn."}, {"t": "r", "x": "Нет, с девушкой. Но наш китайский не очень, я немного беспокоюсь."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "丁汉生: 你别担心。我在上海、四川都有朋友，可以请他们帮助你。"}, {"t": "r", "x": "Nǐ bié dānxīn. Wǒ zài Shànghǎi, Sìchuān dōu yǒu péngyou, kěyǐ qǐng tāmen bāngzhù nǐ."}, {"t": "r", "x": "Не беспокойся. У меня в Шанхае и Сычуани есть друзья, попрошу их помочь тебе."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Разбор:** даты: год (二〇〇五年) → месяц (四月) → число (三十号/日). 以前 / 以后 после отрезка времени: 七月一号以前 «до 1 июля», 放假以后 «после начала каникул». 或者 «или» в утверждении, 还是 в вопросе. 有点儿 + прил./глагол «немного» (о неприятном). 别 + глагол: запрет."}, {"t": "sp", "x": ""}]}, {"l": 7, "title": "Урок 7. Текст 2 (ищет учителя Ван)", "rows": [{"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: 请问，可以进来吗?"}, {"t": "pr", "p": "Qǐngwèn, kěyǐ jìnlai ma?", "r": "Простите, можно войти?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "老师: 你找谁?"}, {"t": "pr", "p": "Nǐ zhǎo shuí?", "r": "Вы к кому?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: 我找王老师。"}, {"t": "pr", "p": "Wǒ zhǎo Wáng lǎoshī.", "r": "Мне нужна учитель Ван."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "老师: 哪位王老师? 我们这儿有两位王老师。"}, {"t": "pr", "p": "Nǎ wèi Wáng lǎoshī? Wǒmen zhèr yǒu liǎng wèi Wáng lǎoshī.", "r": "Который Ван? У нас их две."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: 我不知道她叫什么名字。她是女的。"}, {"t": "pr", "p": "Wǒ bù zhīdao tā jiào shénme míngzi. Tā shì nǚ de.", "r": "Не знаю, как её зовут. Она женщина."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "老师: 这儿的老师都是女的。"}, {"t": "pr", "p": "Zhèr de lǎoshī dōu shì nǚ de.", "r": "Здесь все учителя женщины."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: 她戴一副眼镜。"}, {"t": "pr", "p": "Tā dài yí fù yǎnjìng.", "r": "Она носит очки."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "老师: 在我们这儿，每位老师都戴眼镜。"}, {"t": "pr", "p": "Zài wǒmen zhèr, měi wèi lǎoshī dōu dài yǎnjìng.", "r": "У нас каждый учитель носит очки."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: 她瘦瘦的，高高的，头发长长的，穿一条牛仔裤。"}, {"t": "r", "x": "Tā shòushòu de, gāogāo de, tóufa chángcháng de, chuān yì tiáo niúzǎikù."}, {"t": "r", "x": "Она худенькая, высокая, с длинными волосами, в джинсах."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "老师: 哦，你要找王欢老师，她刚出去。"}, {"t": "pr", "p": "Ò, nǐ yào zhǎo Wáng Huān lǎoshī, tā gāng chūqu.", "r": "А, вам нужна Ван Хуань, она только что вышла."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: 她大概什么时候回来?"}, {"t": "pr", "p": "Tā dàgài shénme shíhou huílai?", "r": "Когда она примерно вернётся?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "老师: 不知道。你过一会儿再来看看吧。"}, {"t": "pr", "p": "Bù zhīdao. Nǐ guò yíhuìr zài lái kànkan ba.", "r": "Не знаю. Зайдите ещё раз попозже."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Разбор:** удвоение прилагательных: 瘦瘦的，高高的，长长的 (живописное описание). 每…都: «каждый… (все)». 刚 + глагол «только что». 过一会儿再… «через некоторое время снова». 这儿/那儿 после существительного: 老师那儿 «у преподавателя», 我们这儿 «у нас». Глаголы направления: 进来/进去, 出来/出去, 回来/回去 (来 к говорящему, 去 от него)."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Вопросы к урокам 7:"}, {"t": "zh", "x": "1. 安德烈打算什么时候去中国旅行?"}, {"t": "zh", "x": "2. 他跟谁一起去?"}, {"t": "zh", "x": "3. 他为什么有点儿担心?"}, {"t": "zh", "x": "4. 王欢老师是什么样的人? (описание)"}, {"t": "zh", "x": "Ответы: 1. 五月中旬或者下旬去。 2. 跟他的女朋友一起去。 3. 因为他们的汉语不太好。 4. 她瘦瘦的，高高的，头发长长的，戴一副眼镜，穿一条牛仔裤。"}, {"t": "sp", "x": ""}]}, {"l": 8, "title": "Урок 8. Текст 1 (ищут банк и почту)", "rows": [{"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 请问，附近有没有银行?"}, {"t": "pr", "p": "Qǐngwèn, fùjìn yǒu méiyǒu yínháng?", "r": "Скажите, поблизости есть банк?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "行人: 有。附近有一个中国银行。"}, {"t": "pr", "p": "Yǒu. Fùjìn yǒu yí gè Zhōngguó Yínháng.", "r": "Есть, недалеко Банк Китая."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 离这儿远不远?"}, {"t": "pr", "p": "Lí zhèr yuǎn bu yuǎn?", "r": "Далеко отсюда?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "行人: 不太远。"}, {"t": "pr", "p": "Bú tài yuǎn.", "r": "Не очень."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 怎么走?"}, {"t": "pr", "p": "Zěnme zǒu?", "r": "Как пройти?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "行人: 往前走一点儿，往右拐，过两条马路，就是中国银行。"}, {"t": "r", "x": "Wǎng qián zǒu yìdiǎnr, wǎng yòu guǎi, guò liǎng tiáo mǎlù, jiù shì Zhōngguó Yínháng."}, {"t": "r", "x": "Пройдите немного вперёд, поверните направо, перейдите две улицы, и вот Банк Китая."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 附近有没有邮局?"}, {"t": "pr", "p": "Fùjìn yǒu méiyǒu yóujú?", "r": "А почта поблизости есть?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "行人: 有。邮局就在那个银行的旁边。"}, {"t": "pr", "p": "Yǒu. Yóujú jiù zài nàge yínháng de pángbiān.", "r": "Есть, почта прямо рядом с тем банком."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 谢谢您!"}, {"t": "pr", "p": "Xièxie nín!", "r": "Спасибо!"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "行人: 不客气。"}, {"t": "pr", "p": "Bú kèqi.", "r": "Не за что."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Разбор:** 有没有 = есть ли. 离 + место + 远/近: расстояние (离这儿远不远?). 往 + направление + глагол: 往前走, 往右拐. 就 подчёркивает «именно, прямо»: 就是, 就在…旁边."}, {"t": "sp", "x": ""}]}, {"l": 8, "title": "Урок 8. Текст 2 (как доехать до центра)", "rows": [{"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 我们现在怎么去市中心呢?"}, {"t": "pr", "p": "Wǒmen xiànzài zěnme qù shì zhōngxīn ne?", "r": "Как нам сейчас добраться до центра?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "张园园: 有人告诉我，可以坐地铁去。"}, {"t": "pr", "p": "Yǒu rén gàosu wǒ, kěyǐ zuò dìtiě qù.", "r": "Мне сказали, можно на метро."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 你知道怎么走吗?"}, {"t": "pr", "p": "Nǐ zhīdao zěnme zǒu ma?", "r": "Ты знаешь, как ехать?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "张园园: 不知道。"}, {"t": "pr", "p": "Bù zhīdao.", "r": "Нет."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 我们问一下吧。同学，请问从这儿到市中心怎么走?"}, {"t": "r", "x": "Wǒmen wèn yíxià ba. Tóngxué, qǐngwèn cóng zhèr dào shì zhōngxīn zěnme zǒu?"}, {"t": "r", "x": "Давай спросим. Приятель, как отсюда добраться до центра?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "学生: 你在学校门口坐139路公共汽车，坐五站，然后换地铁，坐两站，从地铁站出来，就是市中心。"}, {"t": "r", "x": "Nǐ zài xuéxiào ménkǒu zuò yāo-sān-jiǔ lù gōnggòng qìchē, zuò wǔ zhàn, ránhòu huàn dìtiě, zuò liǎng zhàn, cóng dìtiě zhàn chūlai, jiù shì shì zhōngxīn."}, {"t": "r", "x": "У входа в университет садитесь на автобус 139, едете пять остановок, потом пересаживаетесь на метро, две станции, выходите, и вот центр."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "张园园: 地铁站离汽车站远不远?"}, {"t": "pr", "p": "Dìtiě zhàn lí qìchē zhàn yuǎn bu yuǎn?", "r": "Станция метро далеко от остановки?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "学生: 不远。你下车以后往右拐，过马路，就是地铁站。"}, {"t": "r", "x": "Bù yuǎn. Nǐ xià chē yǐhòu wǎng yòu guǎi, guò mǎlù, jiù shì dìtiě zhàn."}, {"t": "r", "x": "Недалеко. Выйдете, повернёте направо, перейдёте дорогу, и вот станция."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 能不能骑自行车去?"}, {"t": "pr", "p": "Néng bu néng qí zìxíngchē qù?", "r": "А на велосипеде можно?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "学生: 不行，太远了!"}, {"t": "pr", "p": "Bù xíng, tài yuǎn le!", "r": "Нет, слишком далеко!"}, {"t": "sp", "x": ""}, {"t": "b", "x": "Разбор:** 从 А 到 Б: «от А до Б». Транспорт: 坐 + транспорт (坐地铁, 坐公共汽车), но 骑 + велосипед/лошадь (骑自行车), пешком 走路. Номер маршрута: 139路, 1 читается yāo. 坐五站 «проехать пять остановок», 换 «пересесть». Направления-слова: 前/后, 左/右, 上/下, 里/外 + 面/边; 旁边 «рядом», 附近 «поблизости», 门口 «у входа»."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Вопросы к урокам 8:"}, {"t": "zh", "x": "1. 附近有没有银行? 怎么走?"}, {"t": "zh", "x": "2. 邮局在哪儿?"}, {"t": "zh", "x": "3. 从学校到市中心怎么走?"}, {"t": "zh", "x": "4. 为什么不能骑自行车去市中心?"}, {"t": "zh", "x": "Ответы: 1. 有。往前走一点儿，往右拐，过两条马路就是。 2. 邮局就在那个银行的旁边。 3. 在学校门口坐139路公共汽车，坐五站，然后换地铁，坐两站。 4. 因为太远了。"}]}, {"l": 9, "title": "Урок 9. Текст 1 (разговор со стариком в парке)", "rows": [{"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 老人家，这只小狗真可爱。"}, {"t": "pr", "p": "Lǎorénjia, zhè zhī xiǎo gǒu zhēn kě'ài.", "r": "Дедушка, эта собачка такая милая."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "老人: 是啊。我以前养过花儿，养过鸟儿，但是不喜欢养狗。"}, {"t": "r", "x": "Shì a. Wǒ yǐqián yǎngguo huār, yǎngguo niǎor, dànshì bù xǐhuan yǎng gǒu."}, {"t": "r", "x": "Да. Я раньше выращивал цветы, держал птичек, но собак держать не любил."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "老人: 来这儿以后，这儿的人都喜欢养狗，我也养狗了。"}, {"t": "r", "x": "Lái zhèr yǐhòu, zhèr de rén dōu xǐhuan yǎng gǒu, wǒ yě yǎng gǒu le."}, {"t": "r", "x": "После переезда сюда, здесь все любят собак, вот и я завёл."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 听说在中国城市里不能养狗，是吗?"}, {"t": "r", "x": "Tīngshuō zài Zhōngguó chéngshì li bù néng yǎng gǒu, shì ma?"}, {"t": "r", "x": "Говорят, в китайских городах нельзя держать собак, это так?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "老人: 以前不行，现在可以了。有的人喜欢养狗，有的人喜欢养猫，"}, {"t": "r", "x": "Yǐqián bù xíng, xiànzài kěyǐ le. Yǒude rén xǐhuan yǎng gǒu, yǒude rén xǐhuan yǎng māo,"}, {"t": "r", "x": "Раньше было нельзя, теперь можно. Одни любят собак, другие кошек,"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "老人: 有的人喜欢养鸟儿，还有的人喜欢养鱼……你也喜欢养小动物?"}, {"t": "r", "x": "yǒude rén xǐhuan yǎng niǎor, hái yǒude rén xǐhuan yǎng yú... Nǐ yě xǐhuan yǎng xiǎo dòngwù?"}, {"t": "r", "x": "третьи птичек, а кто-то рыбок... Ты тоже любишь держать животных?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 我喜欢小动物，但是不养小动物。"}, {"t": "pr", "p": "Wǒ xǐhuan xiǎo dòngwù, dànshì bù yǎng xiǎo dòngwù.", "r": "Я люблю животных, но не завожу их."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "老人: 为什么? 是不是太麻烦?"}, {"t": "pr", "p": "Wèi shénme? Shì bu shì tài máfan?", "r": "Почему? Слишком хлопотно?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "安德烈: 不是。因为我没有时间，也没有钱。我只能养我自己。"}, {"t": "r", "x": "Bú shì. Yīnwèi wǒ méiyǒu shíjiān, yě méiyǒu qián. Wǒ zhǐ néng yǎng wǒ zìjǐ."}, {"t": "r", "x": "Нет. У меня нет ни времени, ни денег. Я могу прокормить только себя."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Разбор:** 过 после глагола означает опыт в прошлом (养过 «доводилось держать»), отрицание 没(有) + глагол + 过. 了 в конце показывает перемену: 我也养狗了 «теперь и я завёл». 有的人…有的人… «одни… другие…». 是不是 «правда ли» между подлежащим и сказуемым."}, {"t": "sp", "x": ""}]}, {"l": 9, "title": "Урок 9. Текст 2 (прощание перед командировкой)", "rows": [{"t": "sp", "x": ""}, {"t": "zh", "x": "白小红: 听说，你要去上海了?"}, {"t": "pr", "p": "Tīngshuō, nǐ yào qù Shànghǎi le?", "r": "Говорят, ты уезжаешь в Шанхай?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: 对啊。公司让我去上海办点儿事儿。"}, {"t": "pr", "p": "Duì a. Gōngsī ràng wǒ qù Shànghǎi bàn diǎnr shìr.", "r": "Да, компания посылает уладить дела."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "白小红: 什么时候走?"}, {"t": "pr", "p": "Shénme shíhou zǒu?", "r": "Когда едешь?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: 下星期三。"}, {"t": "pr", "p": "Xià xīngqīsān.", "r": "В следующую среду."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "白小红: 你对北京很熟悉了吧?"}, {"t": "pr", "p": "Nǐ duì Běijīng hěn shúxī le ba?", "r": "Ты ведь уже хорошо знаешь Пекин?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: 当然。你看这些照片。这是故宫，这是颐和园……"}, {"t": "r", "x": "Dāngrán. Nǐ kàn zhèxiē zhàopiàn. Zhè shì Gùgōng, zhè shì Yíhéyuán..."}, {"t": "r", "x": "Конечно. Посмотри эти фотографии. Это Гугун, это Ихэюань..."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "白小红: 你登过长城吗?"}, {"t": "pr", "p": "Nǐ dēngguo Chángchéng ma?", "r": "Ты поднимался на Великую стену?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: “不到长城非好汉”，我怎么能不登长城呢?"}, {"t": "r", "x": "\"Bú dào Chángchéng fēi hǎohàn\", wǒ zěnme néng bù dēng Chángchéng ne?"}, {"t": "r", "x": "«Кто не был на Великой стене, тот не молодец», как я мог не подняться?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "白小红: 你还去过别的城市吗?"}, {"t": "pr", "p": "Nǐ hái qùguo biéde chéngshì ma?", "r": "Ты бывал в других городах?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: 上海、西安、成都……我都去过。可是，有一个地方我还没去过。"}, {"t": "r", "x": "Shànghǎi, Xī'ān, Chéngdū... wǒ dōu qùguo. Kěshì, yǒu yí ge dìfang wǒ hái méi qùguo."}, {"t": "r", "x": "Шанхай, Сиань, Чэнду... везде был. Но одно место я ещё не видел."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "白小红: 什么地方?"}, {"t": "pr", "p": "Shénme dìfang?", "r": "Какое место?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "塔拉斯: 你的家。"}, {"t": "pr", "p": "Nǐ de jiā.", "r": "Твой дом."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "白小红: 欢迎你去呀! 要是你想去的话，我陪你一起去。但是，你得给我买机票。"}, {"t": "r", "x": "Huānyíng nǐ qù ya! Yàoshi nǐ xiǎng qù dehua, wǒ péi nǐ yìqǐ qù. Dànshì, nǐ děi gěi wǒ mǎi jīpiào."}, {"t": "r", "x": "Добро пожаловать! Если хочешь, поеду с тобой. Но билет на самолёт покупаешь ты."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Разбор:** 要…了 «вот-вот, скоро» о будущем: 你要去上海了. 对 + место + 熟悉 «хорошо знать что-то». 这些 / 那些 / 哪些 множественное от 这 / 那 / 哪, счётное слово после них не ставится. 要是…的话 «если». 得 děi «должен, надо»."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Вопросы к уроку 9:"}, {"t": "zh", "x": "1. 老人以前养过什么?"}, {"t": "zh", "x": "2. 安德烈为什么不养小动物?"}, {"t": "zh", "x": "3. 塔拉斯什么时候去上海?"}, {"t": "zh", "x": "4. 塔拉斯去过哪些城市?"}, {"t": "zh", "x": "5. 塔拉斯还没去过什么地方?"}, {"t": "zh", "x": "Ответы: 1. 养过花儿，养过鸟儿。 2. 因为他没有时间，也没有钱。 3. 下星期三。 4. 上海、西安、成都，还有北京。 5. 白小红的家。"}, {"t": "sp", "x": ""}]}, {"l": 10, "title": "Урок 10. Текст 1 (в аудитории, Ван Ин не пришла)", "rows": [{"t": "sp", "x": ""}, {"t": "zh", "x": "老师: 大家都来了吗?"}, {"t": "pr", "p": "Dàjiā dōu lái le ma?", "r": "Все пришли?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "托马什: 王英还没来，别的同学都来了。"}, {"t": "pr", "p": "Wáng Yīng hái méi lái, biéde tóngxué dōu lái le.", "r": "Ван Ин ещё нет, остальные пришли."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "老师: 王英怎么啦?"}, {"t": "pr", "p": "Wáng Yīng zěnme la?", "r": "Что с Ван Ин?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "托马什: 不知道。"}, {"t": "pr", "p": "Bù zhīdao.", "r": "Не знаю."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "里奇: 她住学生宿舍，每天在学校餐厅吃早饭。"}, {"t": "r", "x": "Tā zhù xuésheng sùshè, měi tiān zài xuéxiào cāntīng chī zǎofàn."}, {"t": "r", "x": "Она живёт в общежитии и каждый день завтракает в студенческой столовой."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "田中: 我想，现在她可能正在吃早饭。"}, {"t": "pr", "p": "Wǒ xiǎng, xiànzài tā kěnéng zhèngzài chī zǎofàn.", "r": "Думаю, сейчас она как раз завтракает."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "金容南: 大概还在睡觉呢。"}, {"t": "pr", "p": "Dàgài hái zài shuìjiào ne.", "r": "Наверное, ещё спит."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "里奇: 不可能，她肯定已经起床了。"}, {"t": "pr", "p": "Bù kěnéng, tā kěndìng yǐjīng qǐchuáng le.", "r": "Не может быть, она точно уже встала."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "张园园: 你们都错了。王英去医院了。"}, {"t": "pr", "p": "Nǐmen dōu cuò le. Wáng Yīng qù yīyuàn le.", "r": "Вы все ошибаетесь. Ван Ин пошла в больницу."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "老师: 怎么，她病了吗?"}, {"t": "pr", "p": "Zěnme, tā bìng le ma?", "r": "Как, она заболела?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "张园园: 她有点儿不舒服。"}, {"t": "pr", "p": "Tā yǒudiǎnr bù shūfu.", "r": "Ей немного нездоровится."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Разбор:** 正在 / 在 + глагол = действие прямо сейчас: 正在吃早饭. Отличать от предлога 在 + место (在餐厅吃饭). 还没 + глагол «ещё не». 已经…了 «уже». 怎么啦 «что случилось?» (о положении дел), 怎么 «как, каким образом», 怎么样 «каков». Удвоенное счётное слово даёт «каждый»: 天天 = 每天, 个个都, 张张都."}, {"t": "sp", "x": ""}]}, {"l": 10, "title": "Урок 10. Текст 2 (Ван Ин у врача)", "rows": [{"t": "sp", "x": ""}, {"t": "zh", "x": "王英: 医生，我肚子疼。"}, {"t": "pr", "p": "Yīshēng, wǒ dùzi téng.", "r": "Доктор, у меня болит живот."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "医生: 你是不是吃了不干净的东西?"}, {"t": "pr", "p": "Nǐ shì bu shì chīle bù gānjìng de dōngxi?", "r": "Вы не съели ли чего-то несвежего?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "王英: 没有啊。"}, {"t": "pr", "p": "Méiyǒu a.", "r": "Да нет."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "医生: 今天早上吃了什么?"}, {"t": "pr", "p": "Jīntiān zǎoshang chīle shénme?", "r": "Что вы ели сегодня утром?"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "王英: 吃了几片面包，喝了一杯牛奶。……不过，昨天晚上朋友请客，"}, {"t": "r", "x": "Chīle jǐ piàn miànbāo, hēle yì bēi niúnǎi. ... Búguò, zuótiān wǎnshang péngyou qǐng kè,"}, {"t": "r", "x": "Съела несколько кусочков хлеба, выпила стакан молока. ...Правда, вчера друг угощал,"}, {"t": "sp", "x": ""}, {"t": "zh", "x": "王英: 我们去了学校附近的一个饭店，我吃了很多生鱼片。"}, {"t": "r", "x": "wǒmen qùle xuéxiào fùjìn de yí ge fàndiàn, wǒ chīle hěn duō shēng yúpiàn."}, {"t": "r", "x": "мы пошли в ресторан рядом с университетом, и я съела много сашими."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "医生: 可能生鱼片不太新鲜。你得吃药，还得……"}, {"t": "r", "x": "Kěnéng shēng yúpiàn bú tài xīnxiān. Nǐ děi chī yào, hái děi..."}, {"t": "r", "x": "Возможно, рыба была несвежая. Вам нужно принимать лекарство, и ещё..."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "王英: 对不起……"}, {"t": "pr", "p": "Duìbuqǐ...", "r": "Извините..."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "医生: 别着急，我还没说完呢。你得吃药，还得……"}, {"t": "r", "x": "Bié zháojí, wǒ hái méi shuō-wán ne. Nǐ děi chī yào, hái děi..."}, {"t": "r", "x": "Не спешите, я ещё не договорил. Вам нужно принимать лекарство, и ещё..."}, {"t": "sp", "x": ""}, {"t": "zh", "x": "王英: 对不起，厕所在哪儿?"}, {"t": "pr", "p": "Duìbuqǐ, cèsuǒ zài nǎr?", "r": "Извините, где туалет?"}, {"t": "sp", "x": ""}, {"t": "b", "x": "Разбор:** 了 после глагола = действие завершено: 吃了几片面包, 喝了一杯牛奶, 去了一个饭店. Сравни с 了 в конце предложения (перемена): 她去医院了. Счётные слова еды: 片 (ломтики), 杯 (стаканы), 块 (куски). 几 здесь «несколько», а не «сколько». 得 děi «надо»: 你得吃药. 别 + глагол: 别着急."}, {"t": "sp", "x": ""}, {"t": "b", "x": "Вопросы к уроку 10:"}, {"t": "zh", "x": "1. 王英为什么没来上课?"}, {"t": "zh", "x": "2. 她住在哪儿? 每天在哪儿吃早饭?"}, {"t": "zh", "x": "3. 王英今天早上吃了什么?"}, {"t": "zh", "x": "4. 医生说，她为什么肚子疼?"}, {"t": "zh", "x": "5. 医生让她做什么?"}, {"t": "zh", "x": "Ответы: 1. 因为她有点儿不舒服，去医院了。 2. 她住学生宿舍，每天在学校餐厅吃早饭。 3. 吃了几片面包，喝了一杯牛奶。 4. 可能昨天晚上的生鱼片不太新鲜。 5. 让她吃药。"}]}], "tasks": [{"s": "«В выходные я отдыхаю дома»", "a": "周末我在家里休息。", "o": ["我周末在家里休息吗。", "周末在家里我休息。"], "e": "Время в начале, потом подлежащее, потом 在 + место.", "l": 0, "gap": false}, {"s": "«Я заканчиваю работу в половине седьмого»", "a": "我六点半下班。", "o": ["我下班六点半。", "六点半我下班吗。"], "e": "Время стоит перед глаголом: 六点半下班.", "l": 0, "gap": false}, {"s": "«Мы поедем в середине или в конце месяца»", "a": "我们中旬或者下旬出发。", "o": ["我们中旬还是下旬出发。", "我们出发中旬或者下旬。"], "e": "В утверждении «или» это 或者, 还是 только в вопросе.", "l": 0, "gap": false}, {"s": "他___哪国人？", "a": "是", "o": ["说", "姓", "叫"], "e": "是 связка «быть»: 他是哪国人?", "l": 1, "gap": true}, {"s": "我___马。", "a": "姓", "o": ["是", "说", "叫"], "e": "姓 + фамилия: 我姓马。 Имя целиком идёт с 叫.", "l": 1, "gap": true}, {"s": "他___什么名字？", "a": "叫", "o": ["是", "说", "姓"], "e": "叫 + имя: 你叫什么名字?", "l": 1, "gap": true}, {"s": "她不___汉语。", "a": "说", "o": ["是", "姓", "叫"], "e": "说 + язык: 说汉语, 说俄语.", "l": 1, "gap": true}, {"s": "我是俄罗斯人，他___是俄罗斯人。", "a": "也", "o": ["都", "只", "不"], "e": "也 «тоже» стоит перед глаголом, в том числе перед 是.", "l": 1, "gap": true}, {"s": "我们___是俄罗斯人。", "a": "都", "o": ["也", "只", "还"], "e": "都 «все» перед глаголом; порядок при встрече: 也 + 都.", "l": 1, "gap": true}, {"s": "我不是中国人，他___不是中国人。", "a": "也", "o": ["都", "只", "很"], "e": "也 ставится перед 不: 他也不是中国人。", "l": 1, "gap": true}, {"s": "您说俄语___？", "a": "吗", "o": ["呢", "吧", "的"], "e": "吗 превращает утверждение в вопрос.", "l": 1, "gap": true}, {"s": "我不说俄语。您___？", "a": "呢", "o": ["吗", "吧", "了"], "e": "呢 переспрашивает: «а вы?»", "l": 1, "gap": true}, ред прилагательным-сказуемым 是 не ставится, обычно стоит 很.", "l": 2, "gap": true}, {"s": "你的大学___？", "a": "怎么样", "o": ["什么", "哪儿", "谁"], "e": "怎么样 спрашивает «каков, как оно».", "l": 2, "gap": true}, {"s": "这是我___女朋友。", "a": "的", "o": ["在", "给", "和"], "e": "的 показывает принадлежность: 我的女朋友.", "l": 2, "gap": true}, {"s": "«Я работаю в компании»", "a": "我在公司工作。", "o": ["我工作在公司。", "我在工作公司。"], "e": "在 + место стоит перед глаголом.", "l": 2, "gap": false}, {"s": "«Можно тебе позвонить?»", "a": "可以给你打电话吗？", "o": ["可以给你电话打吗？", "给你可以打电话吗？"], "e": "给 + кому + глагол: 给你打电话.", "l": 2, "gap": false}, {"s": "«Наш университет большой»", "a": "我们的大学很大。", "o": ["我们的大学是大。", "我们的大学大很。"], "e": "Прилагательное-сказуемое идёт без 是, с 很 впереди.", "l": 2, "gap": false}, {"s": "«Где ты учишься?»", "a": "你在哪儿学习？", "o": ["你学习在哪儿？", "你在学习哪儿？"], "e": "Оборот с 在 стоит перед глаголом, вопросительное слово на месте ответа.", "l": 2, "gap": false}, {"s": "«Это моя девушка»", "a": "这是我的女朋友。", "o": ["这我的女朋友是。", "这是女朋友我的。"], "e": "的 ставится после владельца: 我的女朋友.", "l": 2, "gap": false}, {"s": "你有几___中国朋友？", "a": "个", "o": ["口", "岁", "张"], "e": "个 универсальное счётное слово для людей и предметов.", "l": 3, "gap": true}, {"s": "我家有三___人。", "a": "口", "o": ["个", "岁", "位"], "e": "口 считает членов семьи: 三口人.", "l": 3, "gap": true}, {"s": "我二十___。", "a": "岁", "o": ["个", "口", "年"], "e": "岁 о возрасте: 我二十岁。 Глагол не нужен.", "l": 3, "gap": true}, {"s": "你们有___个汉语老师？", "a": "几", "o": ["多少", "什么", "哪"], "e": "几 для небольших чисел и всегда со счётным словом.", "l": 3, "gap": true}, {"s": "加拿大有___人？", "a": "多少", "o": ["几", "什么", "哪"], "e": "多少 для любых чисел, счётное слово можно опустить.", "l": 3, "gap": true}, {"s": "我们班有___个汉语老师。", "a": "两", "o": ["二", "几", "些"], "e": "Перед счётным словом «два» это 两, а не 二.", "l": 3, "gap": true}, {"s": "我们大学有十___个汉语老师。", "a": "二", "o": ["两", "些", "几"], "e": "В составном числе 12 остаётся 二: 十二个.", "l": 3, "gap": true}, {"s": "我___孩子。", "a": "没有", "o": ["不有"
